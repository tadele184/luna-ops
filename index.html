<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>LUNA Ops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --red: #e6332a; --red-d: #c4261e; --red-50: #fdeeed; --red-100: #fad6d3;
    --ink: #1c2730; --ink2: #5d6c76; --ink3: #95a2ab; --line: #eceff1;
    --bg: #f4f5f7; --card: #ffffff;
    --green: #2e9e44; --green-50: #e8f5eb; --amber: #e08600; --amber-50: #fdf3e2; --blue: #0076a8;
    --r: 18px; --shadow: 0 1px 2px rgba(28,39,48,.05), 0 4px 14px rgba(28,39,48,.05);
    --nav: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.38 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; }
  body { min-height: 100vh; padding-bottom: calc(var(--nav) + 18px + env(safe-area-inset-bottom)); }
  body.noav { padding-bottom: 96px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: var(--ink); }
  .num { font-variant-numeric: tabular-nums; }

  /* top */
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0 25%,#f39200 25% 50%,#3daa35 50% 75%,#0076a8 75%); }
  .top { display: flex; align-items: center; gap: 11px; padding: 12px 16px; background: var(--card); }
  .av { width: 44px; height: 44px; border-radius: 50%; background: var(--red); color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 16px; letter-spacing: .5px; flex: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--red); overflow: hidden; }
  .av img, .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { width: 42px; height: 42px; border-radius: 50%; flex: none; overflow: hidden; background: var(--red); color: #fff; display: grid;
    place-items: center; font-weight: 800; font-size: 14px; box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--line); position: relative; }
  .ph.ok { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--green); }
  .ph.due { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--red); }
  .who .what { font-size: 12px; color: var(--ink2); font-weight: 600; }
  .tm-hero { display: flex; gap: 10px; justify-content: space-around; padding: 6px 0 2px; }
  .tm-hero .p { text-align: center; width: 31%; }
  .tm-hero .ph { width: 64px; height: 64px; margin: 0 auto 6px; font-size: 20px; }
  .tm-hero .n { font-weight: 800; font-size: 13.5px; }
  .tm-hero .r { font-size: 11px; color: var(--ink2); line-height: 1.25; margin-top: 2px; }
  .tm-hero .s { margin-top: 5px; display: inline-block; }
  .top .nm { font-weight: 700; font-size: 16px; line-height: 1.2; }
  .role { display: inline-block; margin-top: 2px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-50);
    padding: 2px 8px; border-radius: 20px; }
  .brand { margin-left: auto; display: flex; align-items: center; gap: 6px; font-weight: 800; letter-spacing: .3px; font-size: 13px; color: var(--ink2); }
  .brand img { width: 26px; height: 26px; object-fit: contain; }

  .screen { display: none; }
  .screen.on { display: block; animation: in .2s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wrap { padding: 12px; display: grid; gap: 12px; }
  .card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; }
  .h { font-size: 12px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px; }
  .h .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink3); }
  .muted { color: var(--ink3); font-size: 12.5px; }

  /* stat pills */
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pill { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 9px 10px; text-align: center; }
  .pill .l { font-size: 11px; color: var(--ink2); font-weight: 600; }
  .pill .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
  .pill .v small { font-size: 11px; color: var(--ink3); font-weight: 700; }

  /* hero */
  .hero { text-align: center; padding: 18px 14px 16px; position: relative; overflow: hidden; }
  .hero:before { content: ""; position: absolute; inset: -40% -20% auto; height: 180px;
    background: radial-gradient(closest-side, var(--red-50), transparent); pointer-events: none; }
  .ring { position: relative; width: 168px; height: 168px; margin: 4px auto 8px; display: block; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; }
  .ring img { width: 30px; height: 30px; object-fit: contain; }
  .ring .big { font-size: 30px; font-weight: 800; line-height: 1; }
  .ring .lab { font-size: 11px; color: var(--ink2); font-weight: 600; max-width: 110px; text-align: center; line-height: 1.2; }
  .ring:active { transform: scale(.97); }
  .heroNum { font-size: 34px; font-weight: 800; letter-spacing: -.5px; position: relative; }
  .heroNum small { font-size: 16px; color: var(--ink2); font-weight: 700; margin-left: 4px; }
  .heroLab { color: var(--ink2); font-size: 13px; font-weight: 600; position: relative; }
  .heroSub { margin-top: 6px; font-size: 12.5px; color: var(--ink3); position: relative; }

  /* tasks */
  .tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .task { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 13px; text-align: left; display: flex;
    flex-direction: column; gap: 6px; min-height: 128px; position: relative; border: 2px solid transparent; transition: transform .08s; }
  .task:active { transform: scale(.97); }
  .task.due { border-color: var(--red-100); }
  .task.wide { grid-column: span 2; min-height: 0; }
  .task .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--red-50); display: grid; place-items: center; font-size: 19px; }
  .task .t { font-weight: 700; font-size: 14.5px; }
  .task .f { font-size: 12.5px; color: var(--ink2); }
  .task .go { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .st { padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap; flex: none; }
  .st.ok { background: var(--green-50); color: var(--green); }
  .st.due { background: var(--red); color: #fff; }
  .st.wait { background: var(--bg); color: var(--ink2); }
  .bar { height: 6px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--red); border-radius: 6px; }

  .asof { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink3); font-size: 12px; padding: 2px 0 6px; }
  .refresh { color: var(--red); font-weight: 700; padding: 6px 12px; border-radius: 20px; background: var(--red-50); }

  /* report */
  .seg { display: flex; background: var(--card); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
  .seg button { flex: 1; padding: 8px 6px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
  .seg button.on { background: var(--red); color: #fff; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
  .kpi .l { font-size: 11.5px; color: var(--ink2); font-weight: 600; }
  .kpi .v { font-size: 20px; font-weight: 800; margin-top: 1px; }
  .kpi .v small { font-size: 12px; color: var(--ink3); font-weight: 700; }
  .kpi .s { font-size: 11.5px; color: var(--ink3); }
  .funnel { display: grid; gap: 8px; }
  .fr { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 8px; font-size: 13px; }
  .fr .lb { color: var(--ink2); font-weight: 600; }
  .fr .tr { height: 12px; background: var(--bg); border-radius: 8px; overflow: hidden; display: flex; }
  .fr .o { background: var(--red); } .fr .s { background: #f2a19c; }
  .fr .n { text-align: right; font-weight: 700; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--ink2); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; font-size: 11px; color: var(--ink3); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 4px 4px 6px; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  tr.grp td { border-top: 0; padding-top: 12px; font-weight: 800; color: var(--ink); text-align: left; }
  tr.tot td { font-weight: 800; border-top: 1.5px solid var(--ink); }
  .chip { display: inline-block; min-width: 46px; text-align: center; padding: 2px 6px; border-radius: 10px; font-weight: 800; font-size: 12px; }
  .chip.g { background: var(--green-50); color: var(--green); } .chip.a { background: var(--amber-50); color: var(--amber); }
  .chip.r { background: var(--red-50); color: var(--red); } .chip.n { background: var(--bg); color: var(--ink3); }
  .iss { display: flex; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .iss:first-of-type { border-top: 0; }
  .empty { text-align: center; color: var(--ink3); padding: 26px 10px; font-size: 13.5px; }
  .chart svg { width: 100%; height: auto; display: block; }

  /* team */
  .who { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
  .who:first-of-type { border-top: 0; }
  .who .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--red-50); display: grid; place-items: center; font-size: 18px; flex: none; }
  .who .t { font-weight: 700; font-size: 14px; }
  .who .u { font-size: 12.5px; color: var(--ink2); }
  .who .st { margin-left: auto; }
  .help { font-size: 13px; color: var(--ink2); line-height: 1.55; }
  .help code { background: var(--bg); padding: 1px 6px; border-radius: 6px; font-size: 12.5px; color: var(--ink); }

  /* nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; z-index: 5; }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px;
    font-weight: 700; color: var(--ink3); }
  nav button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { color: var(--red); }
  nav button .dot { position: absolute; margin: -16px 0 0 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  body.noav nav { display: none; }

  /* entry */
  .ebar { background: var(--card); padding: 12px 16px 10px; display: flex; gap: 8px; align-items: center; }
  .ebar h2 { margin: 0; font-size: 18px; }
  .ebar .tag { font-size: 11px; font-weight: 800; color: var(--red); background: var(--red-50); padding: 3px 8px; border-radius: 20px; }
  .dseg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-left: auto; }
  .dseg button { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--ink2); font-weight: 600; }
  .dseg button.on { background: var(--card); color: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 12px; background: var(--card); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .sec { flex: none; padding: 8px 14px; border-radius: 20px; background: var(--bg); font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink2); }
  .sec.on { background: var(--red); color: #fff; }
  .sec .b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; }
  .sec.on .b { background: #fff; color: var(--red); }
  .glab { padding: 0 16px 6px; color: var(--ink3); font-size: 12px; background: var(--card); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .ec { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 7px;
    border: 2px solid transparent; transition: border-color .15s; }
  .ec.has { border-color: var(--red); }
  .ec .sp { font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .ec .avg { font-size: 11.5px; color: var(--ink3); font-weight: 600; text-align: right; }
  .ec .avg.bad { color: var(--red); font-weight: 800; }
  .hint { font-size: 11.5px; color: var(--blue); font-weight: 600; background: #e9f3f8; border-radius: 8px; padding: 4px 7px; }
  .stepper { display: flex; align-items: center; background: var(--bg); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 40px; height: 42px; font-size: 22px; font-weight: 600; color: var(--red); flex: none; }
  .stepper button:active { background: var(--red-50); }
  .stepper input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 18px; font-weight: 800; padding: 0; height: 42px; outline: none; }
  .lbl { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; font-weight: 700; margin-bottom: -3px; }
  .kg { display: flex; align-items: center; background: var(--bg); border-radius: 12px; padding: 0 12px; height: 42px; }
  .kg input { border: 0; background: none; width: 100%; font-size: 17px; font-weight: 800; outline: none; text-align: right; }
  .kg span { color: var(--ink3); margin-left: 6px; font-size: 13px; font-weight: 700; }
  .kg.auto input { color: var(--ink2); font-style: italic; }
  .woito { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .woito input { width: 64px; border: 0; background: var(--bg); border-radius: 8px; padding: 6px; text-align: center; font-weight: 700; }
  .note { margin: 4px 16px 14px; color: var(--ink3); font-size: 12.5px; }
  .list { background: var(--card); margin: 12px; border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .row { display: flex; padding: 11px 14px; border-bottom: 1px solid var(--line); gap: 8px; align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .l { flex: 1; } .row .r { font-variant-numeric: tabular-nums; text-align: right; }
  .row.head { font-weight: 800; background: var(--red-50); color: var(--red-d); }
  .row.tot { font-weight: 800; }
  .warn { margin: 0 12px 10px; padding: 10px 12px; border-radius: 12px; background: var(--amber-50); font-size: 13px; }
  .fallback-btn { position: fixed; left: 12px; right: 12px; bottom: 16px; height: 52px; border-radius: 14px; background: var(--red);
    color: #fff; font-weight: 800; font-size: 16px; display: none; z-index: 6; letter-spacing: .3px; }
</style>
</head>

  const hp = new URLSearchParams(location.hash.slice(1));
  const b64bytes = h => { const b = h.replace(/-/g, "+").replace(/_/g, "/"); const s = atob(b + "===".slice((b.length + 3) % 4));
    const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  function plain(h) { try { return h ? JSON.parse(new TextDecoder().decode(b64bytes(h))) : null; } catch (e) { return null; } }
  async function packed(h) {
    try {
      if (!h || !window.DecompressionStream) return null;
      const st = new Blob([b64bytes(h)]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return JSON.parse(await new Response(st).text());
    } catch (e) { return null; }
  }
  const ctx = plain(hp.get("d")) || { u: "", nm: "", r: "Viewer", t: new Date().toISOString().slice(0, 10), k: [], c: [], s: {}, a: {} };
  const extra = (await packed(hp.get("x"))) || {};
  ctx.p = extra.p || {}; ctx.h = extra.h || {};
  const snap = await packed(hp.get("z"));
  const mine = ORDER.filter(k => (ctx.k || []).includes(k));
  const isAdmin = ctx.r === "Super Admin";

  // ---------------------------------------------------------------- Telegram main / back buttons
  let mainHandler = null;
  function fbShow(text, enabled) { const b = $("fb"); b.textContent = text; b.style.display = text ? "block" : "none"; b.style.opacity = enabled ? 1 : .45; }
  function mainButton(text, enabled, handler) {
    mainHandler = handler;
    if (!inTelegram) return fbShow(text, enabled);
    const mb = tg.MainButton;
    try {
      if (!text) { mb.hide(); return; }                      // Telegram throws on empty text
      mb.setParams({ text, color: enabled ? "#e6332a" : "#c9cdd2", text_color: "#ffffff" });
      enabled ? mb.enable() : mb.disable();
      mb.show();
    } catch (e) { fbShow(text, enabled); }
  }
  if (inTelegram) tg.MainButton.onClick(() => mainHandler && mainHandler());
  $("fb").onclick = () => mainHandler && mainHandler();
  function backButton(handler) {
    if (!inTelegram) return;
    try {
      if (backButton._h) tg.BackButton.offClick(backButton._h);
      backButton._h = handler;
      if (handler) { tg.BackButton.onClick(handler); tg.BackButton.show(); } else tg.BackButton.hide();
    } catch (e) {}
  }
  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
    document.body.classList.toggle("noav", id === "entry" || id === "review");
    window.scrollTo(0, 0);
  }
  function alertMsg(m) { if (inTelegram && tg.showAlert) tg.showAlert(m); else alert(m); }

  // ---------------------------------------------------------------- header
  const person = u => PEOPLE[(u || "").toLowerCase().replace(/^@/, "")];
  const nameOf = u => (person(u) || {}).name || (u ? "@" + u : "");
  const initialsOf = s => (s || "L").replace(/^Dr\.?\s*/i, "").replace(/[^A-Za-z\u1200-\u137F ]/g, " ").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "L";
  const photo = (u, cls = "") => { const p = person(u), img = p && p.img && p.img.startsWith("data:") ? p.img : "";
    return `<div class="ph ${cls}">${img ? `<img alt="" src="${img}">` : esc(initialsOf(p ? p.name : u))}</div>`; };
  const owners = k => ((ctx.ow || DEF_OWNERS)[k] || []);
  const me = person(ctx.u);
  const initials = (ctx.nm || ctx.u || "L").replace(/[^A-Za-zሀ-፿ ]/g, " ").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "L";
  if (me && me.img.startsWith("data:")) $("av").innerHTML = `<img alt="" src="${me.img}">`; else $("av").textContent = initials;
  $("nm").textContent = ctx.nm || (ctx.u ? "@" + ctx.u : "LUNA Ops");
  $("role").textContent = ctx.r || "Viewer";

  // ---------------------------------------------------------------- data helpers
  const D0 = snap && snap.days && snap.days[0];            // today
  const st = D0 ? D0.st : null;                            // {kind: [done, by, at]}
  const doneOf = k => st ? !!st[k][0] : !!(ctx.s || {})[k];
  function taskFigure(k, d) {
    if (!d) return "";
    const q = d.kpi;
    return { livestock: q.av ? `${fmt(q.av)} heads available` : "",
      antemortem: q.am ? `${fmt(q.am)} heads passed` : "",
      order: q.op ? `Est. ${fmt(q.op)} pcs · ${fmt(q.ok)} kg` : "",
      production: q.h ? `${fmt(q.h)} heads · ${fmt(q.kg)} kg` : "",
      dispatch: q.dk ? `${fmt(q.dp)} pcs · ${fmt(q.dk)} kg` : "" }[k];
  }
  function countUp(el, to, suffix = "") {
    const start = performance.now(), dur = 700;
    const step = t => { const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3);
      el.innerHTML = fmt(Math.round(to * e)) + suffix; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // ---------------------------------------------------------------- HOME
  function renderHome() {
    const q = D0 ? D0.kpi : null;
    $("pills").innerHTML = [
      ["Slaughtered", q ? fmt(q.h) : "-", "hd"], ["Dispatched", q ? fmt(q.dk) : "-", "kg"],
      ["Order done", q && q.ful != null ? Math.round(q.ful * 100) : "-", q && q.ful != null ? "%" : ""],
    ].map(([l, v, u]) => `<div class="pill"><div class="l">${l}</div><div class="v num">${v}<small> ${u}</small></div></div>`).join("");

    // ring: team progress on the five daily reports
    const done = ORDER.filter(doneOf).length, total = st ? 5 : mine.length || 5;
    const shown = st ? done : mine.filter(doneOf).length;
    const R = 70, C = 2 * Math.PI * R;
    $("ring").innerHTML = `<svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="${R}" stroke="#f1f2f4" stroke-width="14" fill="none"/>
      <circle id="arc" cx="84" cy="84" r="${R}" stroke="#e6332a" stroke-width="14" fill="none" stroke-linecap="round"
       stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)"/></svg>
      <div class="c"><img alt="" src="${document.querySelector(".brand img").src}"><div class="big num">${shown}/${total}</div>
      <div class="lab">${st ? "team reports today" : "your reports today"}</div></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const a = $("arc"); if (a) a.style.strokeDashoffset = C * (1 - shown / total); }));
    $("ring").onclick = () => { haptic("medium"); const next = mine.find(k => !doneOf(k)); next ? openEntry(next) : tab("report"); };

    // hero number for this person's role
    let hv = q ? q.kg : null, hu = "kg", hl = "Carcass produced today", hs = "";
    if (mine.length && !mine.some(k => ["order", "production", "dispatch"].includes(k)) && !isAdmin) {
      if (mine.includes("livestock")) { hv = q && q.av; hu = "heads"; hl = "Livestock available today"; }
      else { hv = q && q.am; hu = "heads"; hl = "Passed ante-mortem today"; }
    }
    const y = snap && snap.days[1] ? snap.days[1].kpi : null;
    const yl = snap && snap.days[1] && snap.days[1].d === addDays(ctx.t, -1) ? "Yesterday" : snap && snap.days[1] ? dayLabel(snap.days[1].d) : "";
    if (y) hs = hu === "kg" ? `${yl} ${fmt(y.kg)} kg · ${fmt(y.h)} heads` :
      `${yl} ${fmt(hl.startsWith("Livestock") ? y.av : y.am)} heads`;
    if (hv == null) { $("heroNum").innerHTML = "-"; } else countUp($("heroNum"), hv, `<small>${hu}</small>`);
    $("heroLab").textContent = hl; $("heroSub").textContent = hs;

    // tasks
    let html = "";
    if (mine.length) {
      const myDone = mine.filter(doneOf).length;
      html += `<div class="h">My tasks<span class="sub">${myDone} of ${mine.length} done</span></div><div class="tasks">`;
      mine.forEach((k, i) => {
        const ok = doneOf(k), meta = st ? st[k] : null;
        let extraBar = "";
        if (k === "production" && D0 && D0.kpi.ok) {
          const p = Math.min(1, (D0.kpi.kg || 0) / D0.kpi.ok);
          extraBar = `<div class="bar"><i style="width:${Math.round(p * 100)}%"></i></div><div class="f">${pct(p)} of estimated kg</div>`;
        }
        html += `<button class="task ${ok ? "" : "due"} ${mine.length % 2 && i === mine.length - 1 ? "wide" : ""}" data-k="${k}">
          <div class="ic">${KINDS[k].icon}</div><div class="t">${KINDS[k].name}</div>
          <div class="f">${esc(taskFigure(k, D0)) || (ok ? "Submitted" : "Not posted yet")}</div>${extraBar}
          <div class="go">${ok ? `<span class="st ok">✓ ${meta && meta[2] ? meta[2] : "Done"}</span><span class="muted">Correct ›</span>`
                                : `<span class="st due">Due today</span><span style="color:var(--red)">Enter ›</span>`}</div></button>`;
      });
      html += "</div>";
    } else {
      html += `<div class="card"><div class="h">Today at a glance</div>${teamList()}</div>`;
    }
    html += `<div class="card" style="margin-top:12px"><div class="h">The team<span class="sub">reports done today</span></div>${teamHero()}</div>`;
    $("taskWrap").innerHTML = html;
    $("taskWrap").querySelectorAll(".task").forEach(b => b.onclick = () => { haptic(); openEntry(b.dataset.k); });
    $("asof").innerHTML = snap ? `Data as of ${esc(snap.at)} <button class="refresh" id="rf">↻ Refresh</button>`
                               : `<button class="refresh" id="rf">↻ Load latest data</button>`;
    $("rf").onclick = refresh;
  }

  function refresh() {
    haptic("medium");
    if (inTelegram) tg.sendData(JSON.stringify({ v: 2, cmd: "refresh" }));
    else alertMsg("Preview mode: in Telegram this asks the bot for the latest data.");
  }

  // ---------------------------------------------------------------- REPORT
  let repDay = 0;
  function noData(msg) { return `<div class="card"><div class="empty">${msg || "Reports need a newer Telegram version.<br>Send /daily in the chat instead."}</div></div>`; }
  function renderReport() {
    if (!snap) { $("rep").innerHTML = noData(); return; }
    const days = snap.days, d = days[Math.min(repDay, days.length - 1)], q = d.kpi;
    let h = `<div class="seg">${days.map((x, i) => `<button data-i="${i}" class="${i === repDay ? "on" : ""}">${!i ? "Today" : x.d === addDays(ctx.t, -1) ? "Yesterday" : "Previous"} · ${dayLabel(x.d).replace(/^\w+,? /, "")}</button>`).join("")}</div>`;
    // key figures
    h += `<div class="card"><div class="h">Key figures<span class="sub">${dayLabel(d.d)}</span></div><div class="kpis">
      <div class="kpi"><div class="l">Slaughtered</div><div class="v num">${fmt(q.h)}<small> hd</small></div><div class="s">Own ${fmt(q.ho)} · Service ${fmt(q.hs)}</div></div>
      <div class="kpi"><div class="l">Carcass (actual)</div><div class="v num">${fmt(q.kg)}<small> kg</small></div><div class="s">Own ${fmt(q.kgo)} · Service ${fmt(q.kgs)}</div></div>
      <div class="kpi"><div class="l">Avg carcass</div><div class="v num">${q.avg == null ? "-" : fmt(q.avg)}<small> kg/hd</small></div><div class="s">All species</div></div>
      <div class="kpi"><div class="l">Dispatched</div><div class="v num">${fmt(q.dk)}<small> kg</small></div><div class="s">${fmt(q.dp)} pcs${d.doff ? ` · offal ${fmt(d.doff)} kg` : ""}</div></div>
      <div class="kpi"><div class="l">Order (estimate)</div><div class="v num">${fmt(q.ok)}<small> kg</small></div><div class="s">${fmt(q.op)} pcs</div></div>
      <div class="kpi"><div class="l">Order done</div><div class="v num">${pct(q.ful)}</div><div class="s">kg ${pct(q.fulkg)}</div></div>
    </div></div>`;
    // supply funnel
    const sum = (arr, i) => arr.reduce((a, r) => a + (r[i] || 0), 0);
    const ordO = d.ord.filter(r => r[1] === "o").reduce((a, r) => a + (r[3] || 0), 0), ordS = d.ord.filter(r => r[1] === "s").reduce((a, r) => a + (r[3] || 0), 0);
    const stages = [["Available", sum(d.sup, 1), sum(d.sup, 2)], ["Ante-mortem", sum(d.sup, 3), sum(d.sup, 4)],
                    ["Ordered (est)", ordO, ordS], ["Slaughtered", q.ho || 0, q.hs || 0]];
    const mx = Math.max(1, ...stages.map(s => s[1] + s[2]));
    h += `<div class="card"><div class="h">Livestock flow<span class="sub">heads</span></div><div class="funnel">` +
      stages.map(([l, o, s]) => `<div class="fr"><div class="lb">${l}</div><div class="tr"><div class="o" style="width:${o / mx * 100}%"></div><div class="s" style="width:${s / mx * 100}%"></div></div><div class="n num">${fmt(o + s)}</div></div>`).join("") +
      `</div><div class="legend"><span><i style="background:var(--red)"></i>Own</span><span><i style="background:#f2a19c"></i>Service</span></div>`;
    if (d.sup.length) h += `<table style="margin-top:10px"><tr><th>Species</th><th>Avail</th><th>AM</th><th>Pass</th></tr>` +
      d.sup.map(r => { const av = (r[1] || 0) + (r[2] || 0), am = (r[3] || 0) + (r[4] || 0);
        return `<tr><td>${esc(r[0])}</td><td>${fmt(av)}</td><td>${fmt(am)}</td><td>${av ? pct(am / av) : "-"}</td></tr>`; }).join("") + `</table>`;
    h += `</div>`;
    // order estimate vs actual
    h += `<div class="card"><div class="h">Order (estimate) vs actual</div>`;
    if (!d.ord.length) h += `<div class="empty">No production order for this day.</div>`;
    else {
      h += `<table><tr><th>Species</th><th>Est</th><th>Actual</th><th>Done</th></tr>`;
      let owner = null, te = [0, 0], ta = [0, 0];
      d.ord.forEach(r => {
        if (r[0] !== owner) { owner = r[0]; h += `<tr class="grp"><td colspan="4">${esc(owner)}</td></tr>`; }
        te[0] += r[3] || 0; te[1] += r[4] || 0; ta[0] += r[5] || 0; ta[1] += r[6] || 0;
        h += `<tr><td>${esc(r[2])} <span class="muted">pcs</span></td><td>${fmt(r[3])}</td><td>${fmt(r[5])}</td><td>${chip(r[3] ? r[5] / r[3] : null)}</td></tr>
              <tr><td style="border-top:0;padding-top:0"><span class="muted">kg</span></td><td style="border-top:0;padding-top:0">${fmt(r[4])}</td><td style="border-top:0;padding-top:0">${fmt(r[6])}</td><td style="border-top:0;padding-top:0">${chip(r[4] ? r[6] / r[4] : null)}</td></tr>`;
      });
      h += `<tr class="tot"><td>Total kg</td><td>${fmt(te[1])}</td><td>${fmt(ta[1])}</td><td>${chip(te[1] ? ta[1] / te[1] : null)}</td></tr></table>`;
    }
    h += `</div>`;
    // production
    h += `<div class="card"><div class="h">Production (actual)</div>`;
    if (!d.psp.length) h += `<div class="empty">Production not posted yet.</div>`;
    else {
      const t = (rows, lab) => `<table><tr><th>${lab}</th><th>Heads</th><th>Kg</th><th>Avg</th></tr>` + rows.map(r =>
        `<tr><td>${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td><td>${r[1] ? fmt(r[2] / r[1]) : "-"}</td></tr>`).join("") + `</table>`;
      h += t(d.psp, "Species") + `<div style="height:10px"></div>` + t(d.pch, "Channel");
    }
    h += `</div>`;
    // dispatch
    h += `<div class="card"><div class="h">Dispatch (actual)</div>`;
    h += d.dch.length ? `<table><tr><th>Channel</th><th>Pcs</th><th>Kg</th></tr>` + d.dch.map(r => `<tr><td>${esc(r[0])}</td><td>${fmt(r[1])}</td><td>${fmt(r[2])}</td></tr>`).join("") +
      `<tr class="tot"><td>Total</td><td>${fmt(q.dp)}</td><td>${fmt(q.dk)}</td></tr></table>` : `<div class="empty">Dispatch not posted yet.</div>`;
    h += `</div>`;
    // issues
    if (d.iss.length) h += `<div class="card"><div class="h">⚠️ Checks<span class="sub">${d.iss.length}</span></div>` + d.iss.map(i => `<div class="iss"><span>•</span><span>${esc(i)}</span></div>`).join("") + `</div>`;
    // trend
    h += trendCard();
    $("rep").innerHTML = h;
    $("rep").querySelectorAll(".seg button").forEach(b => b.onclick = () => { select(); repDay = +b.dataset.i; renderReport(); });
  }

  function trendCard() {
    const t = (snap.trend || []).filter(r => r[2] || r[3]);
    if (t.length < 2) return "";
    const W = 340, H = 150, P = 24, mx = Math.max(...t.map(r => Math.max(r[2], r[3], r[5] || 0)), 1);
    const bw = (W - P) / t.length;
    let bars = "", line = "", est = "";
    t.forEach((r, i) => {
      const x = P + i * bw, bh = (r[2] / mx) * (H - 34);
      bars += `<rect x="${x + bw * 0.18}" y="${H - 20 - bh}" width="${bw * 0.64}" height="${bh}" rx="3" fill="#e6332a"/>`;
      const cx = x + bw / 2;
      line += `${i ? "L" : "M"}${cx},${H - 20 - (r[3] / mx) * (H - 34)}`;
      if (r[5]) est += `<line x1="${x + bw * 0.1}" x2="${x + bw * 0.9}" y1="${H - 20 - (r[5] / mx) * (H - 34)}" y2="${H - 20 - (r[5] / mx) * (H - 34)}" stroke="#1c2730" stroke-width="2" stroke-dasharray="3 2"/>`;
      bars += `<text x="${cx}" y="${H - 6}" font-size="9" text-anchor="middle" fill="#95a2ab">${r[0].slice(8)}</text>`;
    });
    return `<div class="card chart"><div class="h">Last ${t.length} days<span class="sub">kg</span></div>
      <svg viewBox="0 0 ${W} ${H}"><text x="0" y="10" font-size="9" fill="#95a2ab">${fmt(mx)}</text>
      <line x1="${P}" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="#eceff1"/>${bars}${est}
      <path d="${line}" fill="none" stroke="#0076a8" stroke-width="2"/></svg>
      <div class="legend"><span><i style="background:#e6332a"></i>Carcass actual</span><span><i style="background:#1c2730"></i>Order estimate</span><span><i style="background:#0076a8"></i>Dispatched</span></div></div>`;
  }

  // ---------------------------------------------------------------- STOCK
  function renderStock() {
    if (!snap) { $("stk").innerHTML = noData(); return; }
    let h = `<div class="card" style="padding:12px 14px"><div class="muted">Calculated by the bot: production minus dispatch. Carcass only. Own and each customer are kept apart and species are never added together.</div></div>`;
    if (!snap.stock.length) h += noData("No stock yet. Production and dispatch build the balance.");
    const groups = {};
    snap.stock.forEach(r => (groups[r[0]] = groups[r[0]] || { t: r[1], rows: [] }).rows.push(r));
    const ownFirst = Object.entries(groups).sort((a, b) => (a[1].t === "o" ? 0 : 1) - (b[1].t === "o" ? 0 : 1));
    ownFirst.forEach(([name, g]) => {
      h += `<div class="card"><div class="h">${g.t === "o" ? "🔴 " : ""}${esc(name)}<span class="sub">${g.t === "o" ? "Own" : "Service"}</span></div>
        <table><tr><th>Species</th><th>Pcs</th><th>Kg</th><th>+In</th><th>−Out</th></tr>` +
        g.rows.map(r => `<tr><td>${esc(r[2])}</td><td style="${r[3] < 0 ? "color:var(--red);font-weight:800" : ""}">${fmt(r[3])}</td>
          <td style="${r[4] < 0 ? "color:var(--red);font-weight:800" : "font-weight:700"}">${fmt(r[4])}</td><td>${fmt(r[5])}</td><td>${fmt(r[6])}</td></tr>`).join("") + `</table></div>`;
    });
    h += `<p class="muted" style="text-align:center">Pcs and Kg = balance now · +In produced today · −Out dispatched today (kg)</p>`;
    $("stk").innerHTML = h;
  }

  // ---------------------------------------------------------------- TEAM
  function stOf(k) { return st ? st[k] : [(ctx.s || {})[k] ? 1 : 0, "", ""]; }
  function teamList() {
    return ORDER.map(k => {
      const s = stOf(k), own = owners(k)[0] || "";
      const by = s[0] && s[1] && s[1].toLowerCase() !== own ? ` by ${esc(nameOf(s[1]))}` : "";
      return `<div class="who">${photo(own, s[0] ? "ok" : "due")}<div><div class="t">${KINDS[k].icon} ${KINDS[k].name}</div>
        <div class="u">${esc(nameOf(own))} · ${s[0] ? `posted${s[2] ? " " + esc(s[2]) : ""}${by}` : "waiting"}</div></div>
        <span class="st ${s[0] ? "ok" : "wait"}">${s[0] ? "✓ Done" : "Pending"}</span></div>`;
    }).join("");
  }
  function teamHero() {
    const users = [...new Set(ORDER.flatMap(owners))];
    return `<div class="tm-hero">` + users.map(u => {
      const ks = ORDER.filter(k => owners(k).includes(u)), done = ks.filter(k => stOf(k)[0]).length;
      const p = person(u) || { name: "@" + u, role: "" };
      return `<div class="p">${photo(u, done === ks.length ? "ok" : "due")}<div class="n">${esc(p.name)}</div><div class="r">${esc(p.role)}</div>
        <span class="st ${done === ks.length ? "ok" : done ? "wait" : "due"} s">${done}/${ks.length}</span></div>`;
    }).join("") + `</div>`;
  }
  function renderTeam() {
    let h = `<div class="card"><div class="h">The team<span class="sub">${dayLabel(ctx.t)}</span></div>${teamHero()}</div>`;
    h += `<div class="card"><div class="h">Today's reports</div>${teamList()}</div>`;
    h += `<div class="card"><div class="h">How it works</div><div class="help">
      Each report is entered only by its owner. The bot checks the numbers and posts them to the group.<br>
      <b>Production Order</b> is the estimate. <b>Production</b> and <b>Dispatch</b> are actual. Stock = production − dispatch.<br>
      Daily report in the group at 18:00 with the Excel file.</div></div>`;
    h += `<div class="card"><div class="h">Bot commands</div><div class="help">
      <code>/daily</code> full daily report · <code>/stock</code> stock balance<br><code>/today</code> what is in · <code>/excel</code> Excel report
      ${isAdmin ? `<br><br><b>Admin</b><br><code>/setgroup</code> in the group · <code>/routes</code> · <code>/resetuser @name</code><br><code>/addcustomer NAME</code> · <code>/removecustomer NAME</code>` : ""}</div></div>`;
    $("tm").innerHTML = h;
  }

  // ---------------------------------------------------------------- tabs
  let current = "home";
  function tab(t) {
    current = t; kind = null;
    show(t); backButton(null); mainButton("", false, null);
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    ({ home: renderHome, report: renderReport, stock: renderStock, team: renderTeam })[t]();
  }
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => { select(); tab(b.dataset.t); });

  // ================================================================ ENTRY (locked templates)
  let kind = null, date = ctx.t, sel = null, values = {};
  const secKey = s => s.o + "|" + (s.n || "");
  function sections() {
    const own = KINDS[kind].own.map(ch => ({ o: "own", n: ch, label: ch ? "Own · " + ch : "Own" }));
    const svc = (ctx.c || []).map(c => ({ o: "svc", n: c, label: c }));
    return own.concat(svc);
  }
  function loadPrefill(k) {
    values = {};
    ((ctx.p || {})[k] || []).forEach(s => {
      const key = s.o + "|" + (s.n || ""); values[key] = {};
      Object.entries(s.v).forEach(([sp, v]) => {
        if (KINDS[k].unit === "heads") {
          const m = String(v).match(/^(\d+)(?:\+(\d+)\(Woito\))?$/i);
          values[key][sp] = m ? { h: +m[1], w: m[2] ? +m[2] : 0 } : { h: +String(v).replace(/\D/g, "") || 0, w: 0 };
        } else values[key][sp] = { p: v[0], kg: v[1] };
      });
    });
  }
  function openEntry(k) {
    if (kind !== k) { kind = k; date = ctx.t; loadPrefill(k); sel = null; }
    sel = sel && sections().some(s => secKey(s) === secKey(sel)) ? sel : sections()[0];
    show("entry");
    backButton(() => { haptic(); tab(current); });
    renderEntry();
  }
  const has = v => v && ((v.h || 0) + (v.w || 0) > 0 || (v.p || 0) > 0 || (v.kg || 0) > 0);
  const lineCount = () => Object.values(values).reduce((n, sec) => n + Object.values(sec).filter(has).length, 0);
  const avgOf = sp => (ctx.a && ctx.a[sp]) || DEF_AVG[sp];

  function hintFor(sp) {
    if (kind === "production") {
      const o = (((ctx.h.production || {})[date] || {})[secKey(sel)] || {})[sp];
      return o ? { text: `Order est: ${fmt(o[0])} pcs · ${fmt(o[1])} kg`, est: o } : null;
    }
    if (kind === "dispatch") {
      const k = sel.o === "own" ? "own" : "svc|" + sel.n;
      const s = ((ctx.h.dispatch || {})[k] || {})[sp];
      return s ? { text: `In stock: ${fmt(s[0])} pcs · ${fmt(s[1])} kg`, stock: s } : null;
    }
    return null;
  }

  function renderEntry() {
    $("eTitle").textContent = KINDS[kind].short;
    $("eTag").textContent = KINDS[kind].tag || "HEADS";
    const seg = $("dateSeg"); seg.innerHTML = "";
    [["Yesterday", addDays(ctx.t, -1)], ["Today", ctx.t]].concat(kind === "order" ? [["Tomorrow", addDays(ctx.t, 1)]] : [])
      .forEach(([lab, iso]) => { const b = document.createElement("button"); b.textContent = lab; b.className = iso === date ? "on" : "";
        b.onclick = () => { select(); date = iso; renderEntry(); }; seg.appendChild(b); });
    const chips = $("chips"); chips.innerHTML = "";
    sections().forEach(s => {
      const n = Object.values(values[secKey(s)] || {}).filter(has).length;
      const b = document.createElement("button");
      b.className = "sec" + (secKey(s) === secKey(sel) ? " on" : "");
      b.innerHTML = `${esc(s.label)}${n ? `<span class="b">${n}</span>` : ""}`;
      b.onclick = () => { select(); sel = s; renderEntry(); };
      chips.appendChild(b);
    });
    const on = chips.querySelector(".on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
    const cards = $("cards"); cards.innerHTML = "";
    const key = secKey(sel); values[key] = values[key] || {};
    SPECIES.forEach(sp => cards.appendChild(KINDS[kind].unit === "heads" ? headsCard(key, sp) : pcsKgCard(key, sp)));
    $("entryNote").textContent = {
      livestock: "Tap + / − or type the number of heads available. Leave at 0 if none.",
      antemortem: "Heads that passed ante-mortem inspection. Leave at 0 if none.",
      order: "Estimated pieces. Kg is estimated automatically from the recent average carcass weight; type over it to change.",
      production: "Actual pieces and carcass kg produced. The blue line shows the order estimate.",
      dispatch: "Actual pieces and carcass kg dispatched. The blue line shows what is in stock.",
    }[kind];
    updateMain();
  }

  function stepper(value, onChange) {
    const w = document.createElement("div"); w.className = "stepper";
    const minus = document.createElement("button"); minus.textContent = "−";
    const plus = document.createElement("button"); plus.textContent = "+";
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "numeric"; inp.pattern = "[0-9]*"; inp.value = value || ""; inp.placeholder = "0";
    const set = v => { v = Math.max(0, Math.round(v)); inp.value = v || ""; onChange(v); };
    minus.onclick = () => { haptic(); set((+inp.value || 0) - 1); };
    plus.onclick = () => { haptic(); set((+inp.value || 0) + 1); };
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 6); onChange(+inp.value || 0); };
    inp.onfocus = () => inp.select();
    w.append(minus, inp, plus);
    return w;
  }

  function headsCard(key, sp) {
    const v = values[key][sp] || { h: 0, w: 0 };
    const c = document.createElement("div"); c.className = "ec" + (has(v) ? " has" : "");
    c.innerHTML = `<div class="sp">${sp}</div>`;
    const upd = () => { values[key][sp] = v; c.classList.toggle("has", has(v)); refreshBadges(); updateMain(); };
    c.appendChild(stepper(v.h, n => { v.h = n; upd(); }));
    if (sp === "Bull" && kind === "livestock") {
      const wo = document.createElement("label"); wo.className = "woito";
      wo.innerHTML = `+ Woito <input inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${v.w || ""}">`;
      const i = wo.querySelector("input");
      i.oninput = () => { i.value = i.value.replace(/\D/g, "").slice(0, 5); v.w = +i.value || 0; upd(); };
      c.appendChild(wo);
    }
    return c;
  }

  function pcsKgCard(key, sp) {
    const v = values[key][sp] || { p: 0, kg: 0 };
    const est = kind === "order";
    const c = document.createElement("div"); c.className = "ec" + (has(v) ? " has" : "");
    c.innerHTML = `<div class="sp">${sp}<span class="avg"></span></div>`;
    const hint = hintFor(sp);
    if (hint) { const hd = document.createElement("div"); hd.className = "hint"; hd.textContent = hint.text; c.appendChild(hd); }
    const avg = c.querySelector(".avg");
    const l1 = document.createElement("div"); l1.className = "lbl"; l1.textContent = est ? "Est. pcs" : "Actual pcs"; c.appendChild(l1);
    const kgBox = document.createElement("div"); kgBox.className = "kg";
    kgBox.innerHTML = `<input inputmode="decimal" placeholder="0" value="${v.kg || ""}"><span>kg</span>`;
    const i = kgBox.querySelector("input");
    const showAvg = () => {
      kgBox.classList.toggle("auto", !!v.auto);
      if (v.p > 0 && v.kg > 0) {
        const a = v.kg / v.p, [lo, hi] = RANGE[sp];
        let t = fmt(a) + " kg/hd";
        if (hint && hint.est && hint.est[1] && !est) t = Math.round(v.kg / hint.est[1] * 100) + "% of est";
        avg.textContent = v.auto ? "auto" : t; avg.classList.toggle("bad", a < lo || a > hi);
      } else { avg.textContent = ""; avg.classList.remove("bad"); }
    };
    const upd = () => { values[key][sp] = v; c.classList.toggle("has", has(v)); showAvg(); refreshBadges(); updateMain(); };
    c.appendChild(stepper(v.p, n => {
      v.p = n;
      if (est && (v.auto || !v.kg)) { v.kg = n ? Math.round(n * avgOf(sp)) : 0; v.auto = !!n; i.value = v.kg || ""; }
      upd();
    }));
    const l2 = document.createElement("div"); l2.className = "lbl"; l2.textContent = est ? `Est. kg · ${fmt(avgOf(sp))} kg/hd` : "Actual carcass kg";
    i.oninput = () => { i.value = i.value.replace(",", ".").replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1").slice(0, 9);
      v.kg = parseFloat(i.value) || 0; v.auto = false; upd(); };
    i.onfocus = () => i.select();
    c.append(l2, kgBox);
    showAvg();
    return c;
  }

  function refreshBadges() {
    const secs = sections();
    document.querySelectorAll("#chips .sec").forEach((b, idx) => {
      const s = secs[idx], n = Object.values(values[secKey(s)] || {}).filter(has).length;
      b.innerHTML = `${esc(s.label)}${n ? `<span class="b">${n}</span>` : ""}`;
    });
  }
  function updateMain() {
    const n = lineCount();
    mainButton(n ? `REVIEW  ·  ${n} line${n > 1 ? "s" : ""}` : "ENTER NUMBERS TO CONTINUE", n > 0, n ? openReview : null);
  }

  // ---------------------------------------------------------------- REVIEW
  function problems() {
    const out = [];
    sections().forEach(s => {
      Object.entries(values[secKey(s)] || {}).forEach(([sp, v]) => {
        if (!has(v) || KINDS[kind].unit === "heads") return;
        if (!v.p) out.push(`${s.label} · ${sp}: pcs missing.`);
        else if (!v.kg) out.push(`${s.label} · ${sp}: kg missing.`);
        else { const a = v.kg / v.p, [lo, hi] = RANGE[sp]; if (a < lo || a > hi) out.push(`${s.label} · ${sp}: ${fmt(a)} kg per head is outside ${lo}-${hi} kg.`); }
        if (kind === "dispatch" && date === ctx.t && !(ctx.s || {}).dispatch) {
          const st = ((ctx.h.dispatch || {})[s.o === "own" ? "own" : "svc|" + s.n] || {})[sp];
          if (s.o === "svc" && (!st || v.kg > st[1] + 0.5)) out.push(`${s.label} · ${sp}: more than in stock (${st ? fmt(st[1]) : 0} kg).`);
        }
      });
    });
    return out;
  }
  function openReview() {
    haptic("medium");
    show("review");
    backButton(() => { haptic(); show("entry"); backButton(() => { haptic(); tab(current); }); updateMain(); });
    $("rTitle").textContent = `${KINDS[kind].name} · ${dayLabel(date)}`;
    const heads = KINDS[kind].unit === "heads";
    const unitLab = kind === "order" ? "Est. pcs · kg" : "Pcs · Kg";
    let html = "", gp = 0, gk = 0;
    sections().forEach(s => {
      const rows = Object.entries(values[secKey(s)] || {}).filter(([, v]) => has(v));
      if (!rows.length) return;
      let tp = 0, tk = 0;
      html += `<div class="list"><div class="row head"><div class="l">${esc(s.label)}</div>${heads ? "" : `<div class="r">${unitLab}</div>`}</div>`;
      SPECIES.forEach(sp => {
        const v = (values[secKey(s)] || {})[sp]; if (!has(v)) return;
        if (heads) { const t = (v.h || 0) + (v.w || 0); tp += t;
          html += `<div class="row"><div class="l">${sp}${v.w ? ` <span class="muted">(${v.h} + ${v.w} Woito)</span>` : ""}</div><div class="r">${fmt(t)}</div></div>`; }
        else { tp += v.p || 0; tk += v.kg || 0;
          html += `<div class="row"><div class="l">${sp}</div><div class="r">${fmt(v.p || 0)} · ${fmt(v.kg || 0)} kg</div></div>`; }
      });
      if (rows.length > 1) html += `<div class="row tot"><div class="l">Total</div><div class="r">${heads ? fmt(tp) : fmt(tp) + " · " + fmt(tk) + " kg"}</div></div>`;
      html += "</div>"; gp += tp; gk += tk;
    });
    const probs = problems();
    const total = heads ? `${fmt(gp)} heads` : `${fmt(gp)} pcs · ${fmt(gk)} kg`;
    html = `<div class="list"><div class="row tot"><div class="l">${kind === "order" ? "Estimated total" : "Grand total"}</div><div class="r">${total}</div></div></div>` + html;
    html += probs.map(p => `<div class="warn">⚠️ ${esc(p)}</div>`).join("");
    if (ctx.s && ctx.s[kind] && date === ctx.t) html += `<p class="note">This replaces today's earlier ${KINDS[kind].name}.</p>`;
    $("rBody").innerHTML = html;
    const blocked = probs.some(p => p.includes("missing"));
    mainButton(blocked ? "FIX MISSING PCS / KG" : "SUBMIT TO GROUP", !blocked, blocked ? null : submit);
  }

  // ---------------------------------------------------------------- SUBMIT
  function payload() {
    const heads = KINDS[kind].unit === "heads", s = [];
    sections().forEach(sec => {
      const v = {};
      Object.entries(values[secKey(sec)] || {}).forEach(([sp, x]) => {
        if (!has(x)) return;
        v[sp] = heads ? (x.w ? `${x.h || 0}+${x.w}(Woito)` : String(x.h || 0)) : [x.p || 0, Math.round((x.kg || 0) * 10) / 10];
      });
      if (Object.keys(v).length) s.push({ o: sec.o, n: sec.n, v });
    });
    return JSON.stringify({ v: 1, k: kind, d: date, s });
  }
  function submit() {
    const data = payload();
    if (new Blob([data]).size > 4000) { alertMsg("Too many lines to send at once. Please split the report."); return; }
    const go = () => {
      try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      if (inTelegram) tg.sendData(data);
      else { console.log("sendData", data); alertMsg("Preview mode: in Telegram this would be sent to the bot.\n\n" + data); }
    };
    if (inTelegram && tg.showConfirm) tg.showConfirm(`Submit ${KINDS[kind].name} for ${dayLabel(date)}?`, ok => ok && go());
    else go();
  }

  // ---------------------------------------------------------------- boot
  if (inTelegram) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#f4f5f7"); } catch (e) {}
    try { tg.setBottomBarColor && tg.setBottomBarColor("#ffffff"); } catch (e) {}
  }
  if (ctx.o && mine.includes(ctx.o)) { current = "home"; openEntry(ctx.o); } else tab("home");
  window.__luna = { payload: () => kind && payload(), state: () => ({ kind, date, values }), tab, openEntry };
})();
</script>
</body>
</html>
