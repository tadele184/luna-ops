<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>LUNA Ops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Written for old and new web engines alike (Mac Telegram uses the system Safari engine):
     no inset, no flex gap, no colour-mix, no optional chaining. */
  :root { --red:#e6332a; --red-d:#c4261e; --red-50:#fdeeed; --red-100:#fad6d3; --ink:#1c2730; --ink2:#5d6c76; --ink3:#95a2ab;
    --line:#eceff1; --bg:#f4f5f7; --card:#fff; --green:#2e9e44; --green-50:#e8f5eb; --amber:#e08600; --amber-50:#fdf3e2;
    --blue:#0076a8; --blue-50:#e9f3f8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: 86px; }
  body.noav { padding-bottom: 96px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  .num, td, .v { font-variant-numeric: tabular-nums; }
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0,#e6332a 25%,#f39200 25%,#f39200 50%,#3daa35 50%,#3daa35 75%,#0076a8 75%); }
  .top { display: flex; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .av { width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 16px; flex: none; overflow: hidden; border: 2px solid var(--red); margin-right: 11px; }
  .av.logo { background: #fff; padding: 5px; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av.logo img { object-fit: contain; }
  .who-nm { font-weight: 800; font-size: 16px; line-height: 1.2; }
  .role { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-50);
    padding: 2px 8px; border-radius: 20px; }
  .brand { margin-left: auto; }
  .brand img { height: 26px; display: block; }

  .screen { display: none; }
  .screen.on { display: block; }
  .wrap { padding: 12px; }
  .wrap > * { margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 14px; }
  .h { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px;
    display: flex; align-items: center; }
  .h .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink3); }
  .muted { color: var(--ink3); font-size: 12.5px; }
  .note { color: var(--ink2); font-size: 12.5px; line-height: 1.5; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .big small { font-size: 13px; color: var(--ink2); font-weight: 700; margin-left: 3px; }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--red); border-radius: 6px; }
  .statuses { display: flex; flex-wrap: wrap; margin: 6px -3px 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 8px; gap: 8px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px 12px; }

  .kpi .v { font-size: 19px; font-weight: 800; margin-top: 1px; }

  .kpi .s { font-size: 11.5px; color: var(--ink3); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: right; font-size: 11px; color: var(--ink3); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 4px 4px 6px; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--line); }
  tr.grp td { border-top: 0; padding-top: 12px; font-weight: 800; text-align: left; }
  tr.tot td { font-weight: 800; border-top: 1.5px solid var(--ink); }
  td.sub2 { border-top: 0; padding-top: 0; }
  .chip { display: inline-block; min-width: 44px; text-align: center; padding: 2px 7px; border-radius: 10px; font-weight: 800; font-size: 12px; }
  .g { background: var(--green-50); color: var(--green); } .a { background: var(--amber-50); color: var(--amber); }
  .r { background: var(--red-50); color: var(--red); } .n { background: var(--bg); color: var(--ink3); }
  .st { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }

  .task .f { font-size: 12px; color: var(--ink2); min-height: 16px; }
  .task .go { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
  .ph { width: 42px; height: 42px; border-radius: 50%; flex: none; overflow: hidden; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 2.5px solid var(--line); }
  .ph.ok { border-color: var(--green); } .ph.due { border-color: var(--red); }

  .team { display: flex; justify-content: space-around; text-align: center; }

  .team .nm { font-weight: 800; font-size: 13px; }

  .row { display: flex; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .ph { margin-right: 11px; }
  .row .mid { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; font-size: 14px; }
  .row .u { font-size: 12.5px; color: var(--ink2); }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 4px; box-shadow: 0 1px 3px rgba(28,39,48,.06); }
  .seg button { flex: 1; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
  .seg button.on { background: var(--red); color: #fff; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 12px; background: var(--red); color: #fff; font-weight: 800; text-align: center; }
  .btn.ghost { background: var(--red-50); color: var(--red); }
  .btn + .btn { margin-top: 8px; }
  .refresh { color: var(--red); font-weight: 700; padding: 6px 12px; border-radius: 20px; background: var(--red-50); margin-left: 8px; }
  .asof { text-align: center; color: var(--ink3); font-size: 12px; }
  .foot { text-align: center; color: var(--ink3); font-size: 11px; line-height: 1.6; padding: 6px 10px 4px; }
  .foot a { color: var(--ink2); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid var(--line);
    display: flex; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--ink3); }
  nav svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 2px; }
  nav button.on { color: var(--red); }
  body.noav nav { display: none; }
  .ebar { background: var(--card); padding: 12px 16px 10px; display: flex; align-items: center; flex-wrap: wrap; }
  .ebar h2 { margin: 0 8px 0 0; font-size: 18px; }
  .tag { font-size: 11px; font-weight: 800; color: var(--red); background: var(--red-50); padding: 3px 8px; border-radius: 20px; }
  .dseg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-left: auto; }
  .dseg button { padding: 6px 9px; border-radius: 8px; font-size: 13px; color: var(--ink2); font-weight: 700; }
  .dseg button.on { background: #fff; color: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { white-space: nowrap; overflow-x: auto; padding: 4px 12px 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
  .sec { display: inline-block; padding: 8px 14px; border-radius: 20px; background: var(--bg); font-size: 14px; font-weight: 700; color: var(--ink2); margin-right: 8px; }
  .sec.on { background: var(--red); color: #fff; }
  .sec .b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; text-align: center; }
  .sec.on .b { background: #fff; color: var(--red); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; padding: 12px; }
  .ec { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 12px; border: 2px solid transparent; }
  .ec.has { border-color: var(--red); }
  .ec > * + * { margin-top: 7px; }
  .ec .sp { font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
  .ec .avg { font-size: 11.5px; color: var(--ink3); font-weight: 700; text-align: right; }
  .ec .avg.bad { color: var(--red); }
  .hint { font-size: 11.5px; color: var(--blue); font-weight: 700; background: var(--blue-50); border-radius: 8px; padding: 4px 7px; }
  .stepper { display: flex; align-items: center; background: var(--bg); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 40px; height: 42px; font-size: 22px; font-weight: 700; color: var(--red); flex: none; }
  .stepper input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 18px; font-weight: 800; padding: 0; height: 42px; outline: none; }
  .lbl { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; font-weight: 800; }
  .kg { display: flex; align-items: center; background: var(--bg); border-radius: 12px; padding: 0 12px; height: 42px; }
  .kg input { border: 0; background: none; width: 100%; font-size: 17px; font-weight: 800; outline: none; text-align: right; }
  .kg span { color: var(--ink3); margin-left: 6px; font-size: 13px; font-weight: 700; }
  .kg.auto input { color: var(--ink2); font-style: italic; }
  .mini { width: 100%; border: 0; background: var(--bg); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 600; }
  .tagbtn { width: 100%; padding: 8px; border-radius: 10px; background: var(--blue-50); color: var(--blue); font-weight: 800; font-size: 12.5px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 11px; color: var(--ink3); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .fld select, .fld input, .fld textarea { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px; font-size: 15px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; }
  .tchip { display: inline-block; padding: 6px 10px; border-radius: 16px; background: var(--bg); margin: 0 6px 6px 0; font-size: 13px; font-weight: 700; }
  .tchip.on { background: var(--red); color: #fff; }
  .list { background: var(--card); margin: 12px; border-radius: 16px; overflow: hidden; }
  .li { display: flex; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .li:last-child { border-bottom: 0; }
  .li .l { flex: 1; } .li .r2 { text-align: right; }
  .li.head { font-weight: 800; background: var(--red-50); color: var(--red-d); }
  .li.tot { font-weight: 800; }
  .warn { margin: 0 12px 10px; padding: 10px 12px; border-radius: 12px; background: var(--amber-50); font-size: 13px; }
  .fallback-btn { position: fixed; left: 12px; right: 12px; bottom: 16px; height: 52px; border-radius: 14px; background: var(--red);
    color: #fff; font-weight: 800; font-size: 16px; display: none; z-index: 6; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { font-weight: 700; cursor: pointer; outline: none; }
  details p { font-size: 13.5px; color: var(--ink2); line-height: 1.55; }
  .lesson h3 { margin: 14px 0 6px; font-size: 15px; }
  .lesson p, .lesson li { font-size: 14px; line-height: 1.6; color: var(--ink); }
  .lesson .sci { background: var(--blue-50); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink); margin-top: 10px; }
  .q { margin-top: 12px; }
  .q button.opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-top: 6px; border-radius: 10px; background: var(--bg); font-size: 14px; }
  .q button.opt.right { background: var(--green-50); color: var(--green); font-weight: 800; }
  .q button.opt.wrong { background: var(--red-50); color: var(--red); }
  .prog { font-size: 12px; font-weight: 800; }
  input.search { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 15px; background: #fff; }
  .lot { border-top: 1px solid var(--line); padding: 10px 0; }
  .lot:first-of-type { border-top: 0; }
  .lot .t { font-weight: 800; font-size: 14px; }
  .lot .u { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .chain { margin: 8px 0 0; padding: 0; list-style: none; }
  .chain li { position: relative; padding: 0 0 10px 22px; font-size: 13.5px; }
  .chain li:before { content: ""; position: absolute; left: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .chain li.done:before { background: var(--green); }
  .chain li:after { content: ""; position: absolute; left: 9px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
  .chain li:last-child:after { display: none; }
  .seg2 { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; }
  .seg2 button { flex: 1; padding: 9px 4px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
  .seg2 button.ok { background: var(--green); color: #fff; }
  .seg2 button.bad { background: var(--amber); color: #fff; }
  .erow { display: flex; align-items: center; width: 100%; text-align: left; background: var(--card); border-radius: 16px;
    box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 14px; margin-bottom: 10px; border: 2px solid transparent; }
  .erow.due { border-color: var(--red-100); }
  .erow .ic { font-size: 26px; width: 44px; flex: none; }
  .erow .mid { flex: 1; min-width: 0; padding-right: 8px; }
  .erow .t { font-weight: 800; font-size: 15.5px; }
  .erow .u { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .sect { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); margin: 16px 4px 8px; }
  .fld input[type=date] { -webkit-appearance: none; min-height: 42px; }
  .chk { display: flex; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .chk:first-child { border-top: 0; }
  .chk .l { flex: 1; font-weight: 700; font-size: 14px; padding-right: 6px; }
  .chk button { padding: 9px 11px; border-radius: 10px; background: var(--bg); color: var(--ink2); font-weight: 800; font-size: 13px; margin-left: 6px; white-space: nowrap; }
  .chk button.ok { background: var(--green); color: #fff; } .chk button.bad { background: var(--amber); color: #fff; }
  .chknote { padding: 0 0 10px; } .chknote input { width: 100%; border: 1px solid var(--amber); border-radius: 10px; padding: 10px; font-size: 15px; }
  .pick { display: flex; flex-wrap: wrap; margin: 0 -4px; }
  .pick button { margin: 4px; padding: 11px 14px; border-radius: 12px; background: var(--bg); font-weight: 800; font-size: 15px; color: var(--ink2); }
  .pick button.on { background: var(--red); color: #fff; }
  .bigseg { display: flex; background: var(--bg); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .bigseg button { flex: 1; padding: 12px 4px; border-radius: 11px; font-weight: 800; font-size: 15px; color: var(--ink2); }
  .bigseg button.on { background: var(--red); color: #fff; }
  .sumrow { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .sumrow:first-child { border-top: 0; }
  details.more summary { color: var(--red); font-weight: 800; padding: 6px 0; }
  .net { padding: 7px 16px; font-size: 13px; font-weight: 800; display: flex; align-items: center; }
  .net.ok { background: var(--green-50); color: var(--green); } .net.bad { background: var(--red-50); color: var(--red); } .net.wait { background: var(--amber-50); color: var(--amber); }
  .net button { margin-left: auto; background: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 800; color: inherit; }
  .hide { display: none; } body.native .net.hide { display: flex; }
  .rep { font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; } .rep pre { background: var(--bg); padding: 8px 10px; border-radius: 10px; font-size: 12px; overflow-x: auto; }
</style>
</head>
<body class="noav">
<div class="stripe"></div>
<div class="top">

  function bindQuiz(i) {

        var oi = +this.getAttribute("data-o"), q = l.q[qi];

        if (oi === q[2]) { this.className = "opt right"; right[qi] = 1; qel.querySelector(".fb").innerHTML = "✓ Correct. " + q[3]; try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
        else { this.className = "opt wrong"; delete right[qi]; qel.querySelector(".fb").innerHTML = "Not quite. " + q[3]; try { tg.HapticFeedback.notificationOccurred("error"); } catch (e) {} }

  // ================================================================ ANDROID APP: connection, queue, reports
  function queue() { return nget("queue") || []; }
  function setQueue(q) { nset("queue", q); netBar(); }
  function results() { return nget("results") || []; }
  var NET = { state: "wait", msg: "" };
  function netBar() {
    if (!NATIVE) return;
    var q = queue().length, el = $("net");
    if (!el) return;
    var cls = NET.state === "ok" ? "ok" : NET.state === "bad" ? "bad" : "wait";
    var txt = NET.state === "ok" ? "● Connected" : NET.state === "bad" ? "● " + (NET.msg || "Not connected") : "● Connecting…";
    if (q) txt += " · " + q + " waiting to send";
    el.className = "net " + (q && NET.state !== "ok" ? "wait" : cls);
    el.innerHTML = esc(txt) + (q ? ' <button id="netGo">Send now</button>' : "");
    if ($("netGo")) $("netGo").onclick = function () { flush(true); };
  }
  function timeout(p, ms) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej(new Error("timeout")); }, ms);
    p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }
  function apiFetch(path, opts) {
    opts = opts || {};
    var h = opts.headers || {};
    if (CFG.token) h.Authorization = "Bearer " + CFG.token;
    h["ngrok-skip-browser-warning"] = "1"; h["X-App-Version"] = APPV; h["X-Pending"] = String(queue().length);
    if (opts.body) h["Content-Type"] = "application/json";
    opts.headers = h;
    return timeout(fetch(String(CFG.server || "").replace(/\/+$/, "") + path, opts), 25000);
  }
  function unpaired(msg) { NET.state = "bad"; NET.msg = msg || "This phone is not connected. Pair it again."; netBar(); }
  var flushing = false;
  function flush(manual) {
    if (!NATIVE || flushing || !CFG.token) return Promise.resolve();
    var q = queue();
    if (!q.length) return Promise.resolve();
    flushing = true;
    var sent = 0;
    function next() {
      var q2 = queue();
      if (!q2.length) return Promise.resolve();
      var it = q2[0];
      return apiFetch("/api/submit", { method: "POST", body: JSON.stringify({ qid: it.qid, data: it.data }) }).then(function (r) {
        if (r.status === 401) { unpaired("Blocked or not paired. Ask Tadele."); throw new Error("stop"); }
        return r.json().then(function (js) {
          if (js.retry) { NET.state = "ok"; NET.msg = ""; throw new Error("stop"); }
          var q3 = queue().filter(function (x) { return x.qid !== it.qid; });
          setQueue(q3);
          var rs = results(); rs.unshift({ qid: it.qid, at: it.at, label: it.label, ok: !!js.ok, html: js.html || "" }); nset("results", rs.slice(0, 20));
          NET.state = "ok"; NET.msg = ""; sent++;
          return next();
        });
      });
    }
    return next().catch(function (e) {
      if (e.message !== "stop") { NET.state = "bad"; NET.msg = "Offline"; }
      if (manual && e.message !== "stop") alertMsg("No connection. The entries stay on the phone and are sent automatically.");
    }).then(function () { flushing = false; netBar(); if (sent) refreshCtx(); });
  }
  function describe(o) {
    var k = KINDS[o.k];
    return (k ? k.name : "Entry") + (o.d ? " · " + dayLabel(o.d) : "");
  }
  function nativeSend(obj, confirmText) {
    if (obj.cmd) return nativeCmd(obj);
    if (confirmText && !window.confirm(confirmText)) return;
    var qid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var q = queue(); q.push({ qid: qid, data: obj, at: new Date().toISOString(), label: describe(obj) }); setQueue(q);
    try { if (window.LunaNative && window.LunaNative.vibrate) window.LunaNative.vibrate(); } catch (e) {}
    resultPage(null, "Sending…");
    flush().then(function () {
      var r = results().filter(function (x) { return x.qid === qid; })[0];
      if (r) resultPage(r);
      else resultPage(null, "📱 Saved on the phone. It will be sent automatically when the connection is back.");
    });
  }
  function resultPage(r, msg) {
    show("page"); mainButton("", false, null);
    backButton(function () { afterResult(); });
    $("pageW").innerHTML = '<div class="card"><div class="h">' + (r ? (r.ok ? "✅ Saved and posted" : "⛔ Not saved") : "Sending") + '</div><div class="rep">' +
      (r ? r.html : esc(msg)) + "</div></div>" + (r && !r.ok ? '<div class="card"><div class="note">Correct it and submit again.</div></div>' : "") +
      '<button class="btn" id="resOk">' + (r && !r.ok ? "Back" : "Done") + "</button>";
    $("resOk").onclick = afterResult;
  }
  function afterResult() { refreshCtx(true); home(); }
  function sameCtx(a, b) { try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; } }
  function refreshCtx(force) {
    if (!NATIVE || !CFG.token) return;
    apiFetch("/api/ctx").then(function (r) {
      if (r.status === 401) { unpaired("Blocked or not paired. Ask Tadele."); return; }
      return r.json().then(function (js) {
        if (!js.ok) return;
        NET.state = "ok"; NET.msg = ""; netBar();
        var fresh = { d: js.d, x: js.x };
        if (!sameCtx(fresh, CACHE)) {
          nset("ctx", fresh);
          var onHome = $("home").className.indexOf("on") >= 0;
          if (onHome || force || !CACHE) location.reload();
        }
      });
    }).catch(function () { NET.state = "bad"; NET.msg = "Offline"; netBar(); });
  }
  function download(path, name) {
    var url = String(CFG.server || "").replace(/\/+$/, "") + path;
    if (window.LunaNative && window.LunaNative.download) { window.LunaNative.download(url, name, CFG.token || ""); alertMsg("Downloading " + name + ". Find it in Downloads."); return; }
    apiFetch(path).then(function (r) { return r.blob(); }).then(function (b) { var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; a.click(); })
      .catch(function () { alertMsg("No connection."); });
  }
  function nativeCmd(o) {
    if (o.cmd === "excel") return download("/api/file?f=excel&p=" + (o.p || "w"), "LUNA_Report_" + (o.p || "w") + ".xlsx");
    if (o.cmd === "template") return download("/api/file?f=template&p=" + (o.p || "w"), "Stock_Input_Sheet.xlsx");
    if (o.cmd === "traceform") return download("/api/file?f=traceform&lot=" + encodeURIComponent(o.lot) + "&why=" + encodeURIComponent(o.why || ""), "OF-LESH-021_" + o.lot + ".xlsx");
    if (o.cmd === "trace") return openReports("trace", o.lot);
  }
  var REPS = [["today", "Today"], ["daily", "Daily"], ["weekly", "Weekly"], ["monthly", "Monthly"], ["stock", "Stock"], ["aged", "Aged beef"]];
  function openReports(k, q) {
    show("page"); kind = null; mainButton("", false, null); backButton(goHome);
    k = k || "today";
    var cached = nget("rep_" + k + (q || ""));
    $("pageW").innerHTML = '<div class="card"><div class="h">📊 Reports</div><div class="pick">' + REPS.map(function (r) {
      return '<button data-rk="' + r[0] + '" class="' + (r[0] === k ? "on" : "") + '">' + r[1] + "</button>"; }).join("") + "</div>" +
      '<div class="two" style="margin-top:8px"><input class="mini" id="rq" placeholder="Batch or lot to trace" value="' + esc(q || "") + '" autocapitalize="characters"><button class="tagbtn" id="rqGo">🔎 Trace</button></div></div>' +
      '<div class="card rep" id="repBody">' + (cached ? cached.html + '<div class="muted" style="margin-top:8px">Saved ' + esc(cached.at) + ". Updating…</div>" : "Loading…") + "</div>" + backLink() + footer();
    bindBack(goHome);
    var b = $("pageW").querySelectorAll("[data-rk]");
    for (var i = 0; i < b.length; i++) b[i].onclick = function () { select(); openReports(this.getAttribute("data-rk")); };
    $("rqGo").onclick = function () { var v = $("rq").value.trim().toUpperCase(); if (v) openReports("trace", v); };
    apiFetch("/api/report?k=" + k + (q ? "&q=" + encodeURIComponent(q) : "")).then(function (r) { return r.json(); }).then(function (js) {
      NET.state = "ok"; netBar();
      if ($("repBody")) $("repBody").innerHTML = js.html || "";
      nset("rep_" + k + (q || ""), { html: js.html, at: new Date().toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) });
    }).catch(function () { if ($("repBody") && !cached) $("repBody").innerHTML = "No connection. Try again when online."; NET.state = "bad"; NET.msg = "Offline"; netBar(); });
  }
  function pairPage(link) {
    show("page"); mainButton("", false, null); backButton(null);
    var p = {};
    String(link || "").replace(/[?&]([sc])=([^&]*)/g, function (m, k, v) { p[k] = decodeURIComponent(v); });
    $("pageW").innerHTML = '<div class="card"><div class="h">🔗 Connect this phone</div><div class="note">Tadele gives you a 6-digit code on the Mac (or scan his QR code with the camera).</div>' +
      '<div class="fld" style="margin-top:10px"><label>Server address</label><input id="pS" placeholder="https://….ngrok-free.app" value="' + esc(p.s || CFG.server || "") + '" autocapitalize="none"></div>' +
      '<div class="fld"><label>Code</label><input id="pC" inputmode="numeric" maxlength="6" placeholder="123456" value="' + esc(p.c || "") + '" style="font-size:26px;letter-spacing:6px;text-align:center"></div>' +
      '<button class="btn" id="pGo">Connect</button><div class="muted" id="pMsg" style="margin-top:10px"></div></div>' + footer();
    $("pGo").onclick = function () {
      var srv = $("pS").value.trim().replace(/\/+$/, ""), code = $("pC").value.replace(/\D/g, "");
      if (!/^https?:\/\//.test(srv)) srv = "https://" + srv;
      if (code.length !== 6) { alertMsg("Enter the 6-digit code."); return; }
      $("pMsg").textContent = "Connecting…";
      var name = "Android phone"; try { if (window.LunaNative && window.LunaNative.deviceName) name = window.LunaNative.deviceName(); } catch (e) {}
      timeout(fetch(srv + "/api/pair", { method: "POST", headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1", "X-App-Version": APPV },
        body: JSON.stringify({ code: code, name: name }) }), 25000).then(function (r) { return r.json(); }).then(function (js) {
        if (!js.ok) { $("pMsg").textContent = js.error || "Not accepted."; return; }
        CFG = { server: srv, token: js.token, user: js.user }; nset("cfg", CFG); nset("ctx", null);
        location.reload();
      }).catch(function () { $("pMsg").textContent = "Cannot reach the server. Check the address and the internet."; });
    };
    if (p.s && p.c) $("pGo").onclick();
  }
  window.__lunaLink = function (url) { if (/pair/.test(url)) pairPage(url); };
  function phonePage() {
    show("page"); mainButton("", false, null); backButton(goHome);
    var q = queue(), rs = results();
    $("pageW").innerHTML = '<div class="card"><div class="h">📱 This phone</div>' +
      '<div class="sumrow"><span>Person</span><b>' + esc((CFG.user && CFG.user.name) || ctx.nm || "-") + "</b></div>" +
      '<div class="sumrow"><span>Server</span><b style="word-break:break-all">' + esc(CFG.server || "-") + "</b></div>" +
      '<div class="sumrow"><span>Waiting to send</span><b>' + q.length + "</b></div>" +
      '<div class="sumrow"><span>App version</span><b>' + APPV + "</b></div></div>" +
      (q.length ? '<div class="card"><div class="h">Waiting</div>' + q.map(function (x) { return '<div class="sumrow"><span>' + esc(x.label) + "</span><b>" + esc(x.at.slice(11, 16)) + "</b></div>"; }).join("") +
        '<button class="btn" id="phGo" style="margin-top:10px">Send now</button></div>' : "") +
      (rs.length ? '<div class="card"><div class="h">Last sent</div>' + rs.slice(0, 8).map(function (x) {
        return '<div class="sumrow"><span>' + (x.ok ? "✅ " : "⛔ ") + esc(x.label) + "</span><b>" + esc(x.at.slice(5, 10)) + "</b></div>"; }).join("") + "</div>" : "") +
      '<button class="btn ghost" id="phUn">Disconnect this phone</button>' + backLink() + footer();
    bindBack(goHome);
    if ($("phGo")) $("phGo").onclick = function () { flush(true).then(phonePage); };
    $("phUn").onclick = function () {
      if (q.length && !window.confirm(q.length + " entries are not sent yet and will be lost. Disconnect anyway?")) return;
      if (!q.length && !window.confirm("Disconnect this phone?")) return;
      nset("cfg", {}); nset("ctx", null); nset("queue", []); location.reload();
    };
  }

  // ================================================================ boot
  if (inTelegram) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#f4f5f7"); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor("#ffffff"); } catch (e) {}
  }
  if (NATIVE) {
    document.body.className += " native";
    var link = ""; try { if (window.LunaNative && window.LunaNative.takeLink) link = window.LunaNative.takeLink() || ""; } catch (e) {}
    if (!CFG.token || /pair/.test(link)) pairPage(link);
    else {
      home(); netBar(); refreshCtx(!CACHE); flush();
      setInterval(function () { refreshCtx(); flush(); }, 60000);
      window.addEventListener("online", function () { flush(); refreshCtx(); });
    }
  } else if (ctx.o && contains(mine, ctx.o)) openTask(ctx.o); else home();
  window.__luna = { home: home, openTask: openTask, openPage: openPage, openReview: function () { openReview(); },
                    payload: function () { return kind ? payloadDaily() : null; }, state: function () { return { kind: kind, date: date, values: values, notes: notes }; } };
})();
</script>
</body>
