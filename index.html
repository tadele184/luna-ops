<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>LUNA Ops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Written for old and new web engines alike (Mac Telegram uses the system Safari engine):
     no inset, no flex gap, no colour-mix, no optional chaining. */
  :root { --red:#e6332a; --red-d:#c4261e; --red-50:#fdeeed; --red-100:#fad6d3; --ink:#1c2730; --ink2:#5d6c76; --ink3:#95a2ab;
    --line:#eceff1; --bg:#f4f5f7; --card:#fff; --green:#2e9e44; --green-50:#e8f5eb; --amber:#e08600; --amber-50:#fdf3e2;
    --blue:#0076a8; --blue-50:#e9f3f8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Ethiopic", Helvetica, Arial, sans-serif; }
  body { min-height: 100vh; padding-bottom: 86px; }
  body.noav { padding-bottom: 96px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--ink); }
  .num, td, .v { font-variant-numeric: tabular-nums; }
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0,#e6332a 25%,#f39200 25%,#f39200 50%,#3daa35 50%,#3daa35 75%,#0076a8 75%); }
  .top { display: flex; align-items: center; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
  .av { width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 800; font-size: 16px; flex: none; overflow: hidden; border: 2px solid var(--red); margin-right: 11px; }
  .av.logo { background: #fff; padding: 5px; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av.logo img { object-fit: contain; }
  .who-nm { font-weight: 800; font-size: 16px; line-height: 1.2; }
  .role { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-50);
    padding: 2px 8px; border-radius: 20px; }
  .brand { margin-left: auto; }
  .brand img { height: 26px; display: block; }

  .screen { display: none; }
  .screen.on { display: block; }
  .wrap { padding: 12px; }
  .wrap > * { margin-bottom: 12px; }
  .card { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 14px; }
  .h { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px;
    display: flex; align-items: center; }
  .h .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ink3); }
  .muted { color: var(--ink3); font-size: 12.5px; }
  .note { color: var(--ink2); font-size: 12.5px; line-height: 1.5; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .big small { font-size: 13px; color: var(--ink2); font-weight: 700; margin-left: 3px; }
  .bar { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--red); border-radius: 6px; }
  .statuses { display: flex; flex-wrap: wrap; margin: 6px -3px 0; }
  .statuses span { margin: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 8px; gap: 8px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .kpi .l { font-size: 11.5px; color: var(--ink2); font-weight: 600; }
  .kpi .v { font-size: 19px; font-weight: 800; margin-top: 1px; }
  .kpi .v small { font-size: 12px; color: var(--ink3); font-weight: 700; }
  .kpi .s { font-size: 11.5px; color: var(--ink3); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: right; font-size: 11px; color: var(--ink3); font-weight: 700; text-transform: uppercase; letter-spacing: .3px; padding: 4px 4px 6px; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td { text-align: right; padding: 7px 4px; border-top: 1px solid var(--line); }
  tr.grp td { border-top: 0; padding-top: 12px; font-weight: 800; text-align: left; }
  tr.tot td { font-weight: 800; border-top: 1.5px solid var(--ink); }
  td.sub2 { border-top: 0; padding-top: 0; }
  .chip { display: inline-block; min-width: 44px; text-align: center; padding: 2px 7px; border-radius: 10px; font-weight: 800; font-size: 12px; }
  .g { background: var(--green-50); color: var(--green); } .a { background: var(--amber-50); color: var(--amber); }
  .r { background: var(--red-50); color: var(--red); } .n { background: var(--bg); color: var(--ink3); }
  .st { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .st.ok { background: var(--green-50); color: var(--green); } .st.due { background: var(--red); color: #fff; }
  .st.wait { background: var(--bg); color: var(--ink2); } .st.warn { background: var(--amber-50); color: var(--amber); }
  .alert { display: flex; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .alert:first-of-type { border-top: 0; }
  .alert b.i { width: 26px; flex: none; }
  .empty { text-align: center; color: var(--ink3); padding: 20px 10px; font-size: 13.5px; }
  .tasks { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; }
  .task { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 12px; text-align: left;
    border: 2px solid transparent; display: block; width: 100%; }
  .task.due { border-color: var(--red-100); }
  .task .ic { font-size: 22px; line-height: 1; }
  .task .t { font-weight: 800; font-size: 14px; margin: 6px 0 2px; }
  .task .f { font-size: 12px; color: var(--ink2); min-height: 16px; }
  .task .go { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
  .ph { width: 42px; height: 42px; border-radius: 50%; flex: none; overflow: hidden; background: var(--red); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 2.5px solid var(--line); }
  .ph.ok { border-color: var(--green); } .ph.due { border-color: var(--red); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .team { display: flex; justify-content: space-around; text-align: center; }
  .team .p { width: 32%; }
  .team .ph { width: 58px; height: 58px; margin: 0 auto 6px; font-size: 19px; }
  .team .nm { font-weight: 800; font-size: 13px; }
  .team .rl { font-size: 11px; color: var(--ink2); line-height: 1.25; margin: 2px 0 5px; }
  .row { display: flex; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .ph { margin-right: 11px; }
  .row .mid { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; font-size: 14px; }
  .row .u { font-size: 12.5px; color: var(--ink2); }
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 4px; box-shadow: 0 1px 3px rgba(28,39,48,.06); }
  .seg button { flex: 1; padding: 8px 4px; border-radius: 9px; font-size: 13.5px; font-weight: 700; color: var(--ink2); }
  .seg button.on { background: var(--red); color: #fff; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 12px; background: var(--red); color: #fff; font-weight: 800; text-align: center; }
  .btn.ghost { background: var(--red-50); color: var(--red); }
  .btn + .btn { margin-top: 8px; }
  .refresh { color: var(--red); font-weight: 700; padding: 6px 12px; border-radius: 20px; background: var(--red-50); margin-left: 8px; }
  .asof { text-align: center; color: var(--ink3); font-size: 12px; }
  .foot { text-align: center; color: var(--ink3); font-size: 11px; line-height: 1.6; padding: 6px 10px 4px; }
  .foot a { color: var(--ink2); }
  nav { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid var(--line);
    display: flex; z-index: 5; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--ink3); }
  nav svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 2px; }
  nav button.on { color: var(--red); }
  body.noav nav { display: none; }
  .ebar { background: var(--card); padding: 12px 16px 10px; display: flex; align-items: center; flex-wrap: wrap; }
  .ebar h2 { margin: 0 8px 0 0; font-size: 18px; }
  .tag { font-size: 11px; font-weight: 800; color: var(--red); background: var(--red-50); padding: 3px 8px; border-radius: 20px; }
  .dseg { display: inline-flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-left: auto; }
  .dseg button { padding: 6px 9px; border-radius: 8px; font-size: 13px; color: var(--ink2); font-weight: 700; }
  .dseg button.on { background: #fff; color: var(--red); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { white-space: nowrap; overflow-x: auto; padding: 4px 12px 12px; background: var(--card); -webkit-overflow-scrolling: touch; }
  .sec { display: inline-block; padding: 8px 14px; border-radius: 20px; background: var(--bg); font-size: 14px; font-weight: 700; color: var(--ink2); margin-right: 8px; }
  .sec.on { background: var(--red); color: #fff; }
  .sec .b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; text-align: center; }
  .sec.on .b { background: #fff; color: var(--red); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; padding: 12px; }
  .ec { background: var(--card); border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.06); padding: 12px; border: 2px solid transparent; }
  .ec.has { border-color: var(--red); }
  .ec > * + * { margin-top: 7px; }
  .ec .sp { font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
  .ec .avg { font-size: 11.5px; color: var(--ink3); font-weight: 700; text-align: right; }
  .ec .avg.bad { color: var(--red); }
  .hint { font-size: 11.5px; color: var(--blue); font-weight: 700; background: var(--blue-50); border-radius: 8px; padding: 4px 7px; }
  .stepper { display: flex; align-items: center; background: var(--bg); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 40px; height: 42px; font-size: 22px; font-weight: 700; color: var(--red); flex: none; }
  .stepper input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 18px; font-weight: 800; padding: 0; height: 42px; outline: none; }
  .lbl { font-size: 10.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; font-weight: 800; }
  .kg { display: flex; align-items: center; background: var(--bg); border-radius: 12px; padding: 0 12px; height: 42px; }
  .kg input { border: 0; background: none; width: 100%; font-size: 17px; font-weight: 800; outline: none; text-align: right; }
  .kg span { color: var(--ink3); margin-left: 6px; font-size: 13px; font-weight: 700; }
  .kg.auto input { color: var(--ink2); font-style: italic; }
  .mini { width: 100%; border: 0; background: var(--bg); border-radius: 10px; padding: 8px; font-size: 13px; font-weight: 600; }
  .tagbtn { width: 100%; padding: 8px; border-radius: 10px; background: var(--blue-50); color: var(--blue); font-weight: 800; font-size: 12.5px; }
  .fld { margin-bottom: 12px; }
  .fld label { display: block; font-size: 11px; color: var(--ink3); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .fld select, .fld input, .fld textarea { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px; font-size: 15px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 10px; gap: 10px; }
  .tchip { display: inline-block; padding: 6px 10px; border-radius: 16px; background: var(--bg); margin: 0 6px 6px 0; font-size: 13px; font-weight: 700; }
  .tchip.on { background: var(--red); color: #fff; }
  .list { background: var(--card); margin: 12px; border-radius: 16px; overflow: hidden; }
  .li { display: flex; padding: 11px 14px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .li:last-child { border-bottom: 0; }
  .li .l { flex: 1; } .li .r2 { text-align: right; }
  .li.head { font-weight: 800; background: var(--red-50); color: var(--red-d); }
  .li.tot { font-weight: 800; }
  .warn { margin: 0 12px 10px; padding: 10px 12px; border-radius: 12px; background: var(--amber-50); font-size: 13px; }
  .fallback-btn { position: fixed; left: 12px; right: 12px; bottom: 16px; height: 52px; border-radius: 14px; background: var(--red);
    color: #fff; font-weight: 800; font-size: 16px; display: none; z-index: 6; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { font-weight: 700; cursor: pointer; outline: none; }
  details p { font-size: 13.5px; color: var(--ink2); line-height: 1.55; }
  .lesson h3 { margin: 14px 0 6px; font-size: 15px; }
  .lesson p, .lesson li { font-size: 14px; line-height: 1.6; color: var(--ink); }
  .lesson .sci { background: var(--blue-50); border-radius: 12px; padding: 10px 12px; font-size: 13px; color: var(--ink); margin-top: 10px; }
  .q { margin-top: 12px; }
  .q button.opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-top: 6px; border-radius: 10px; background: var(--bg); font-size: 14px; }
  .q button.opt.right { background: var(--green-50); color: var(--green); font-weight: 800; }
  .q button.opt.wrong { background: var(--red-50); color: var(--red); }
  .prog { font-size: 12px; font-weight: 800; }
  input.search { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: 15px; background: #fff; }
  .lot { border-top: 1px solid var(--line); padding: 10px 0; }
  .lot:first-of-type { border-top: 0; }
  .lot .t { font-weight: 800; font-size: 14px; }
  .lot .u { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .chain { margin: 8px 0 0; padding: 0; list-style: none; }
  .chain li { position: relative; padding: 0 0 10px 22px; font-size: 13.5px; }
  .chain li:before { content: ""; position: absolute; left: 5px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
  .chain li.done:before { background: var(--green); }
  .chain li:after { content: ""; position: absolute; left: 9px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
  .chain li:last-child:after { display: none; }
</style>
</head>

  function tagCard(t) {
    // [tag, sp, status, src, reg, slaughter, kg, channel, dispatch, dest, aged, condemned]
    var steps = [["Registered in Available Livestock", t[4], t[3] ? "Source: " + t[3] : ""],
      ["Slaughtered", t[5], (t[6] ? fmt(t[6]) + " kg · " : "") + (t[7] || "")]];
    if (t[10]) steps.push(["Into ageing", "", t[10]]);
    steps.push(["Dispatched", t[8], t[9]]);
    if (t[11]) steps.push(["Condemned", "", t[11]]);
    return '<div class="card"><div class="h">🏷 ' + esc(t[0]) + '<span class="sub">' + esc(t[1]) + " · " + esc(t[2]) + '</span></div><ul class="chain">' + steps.map(function (s) {
      var done = !!(s[1] || (s[0] === "Into ageing" || s[0] === "Condemned"));
      return '<li class="' + (done ? "done" : "") + '"><b>' + s[0] + "</b>" + (s[1] ? " · " + shortDate(s[1]) : "") + (s[2] ? '<br><span class="muted">' + esc(s[2]) + "</span>" : "") + "</li>"; }).join("") + "</ul></div>";
  }
  function lotRow(l) {
    // [lot, name, t, sp, source, avail, passed, pcs, kg, disp_pcs, rem_pcs, age, status, dest, tags]

    return '<div class="lot" data-lot="1"><div class="t">' + esc(l[0]) + ' <span class="chip ' + c + '">' + esc(l[12]) + '</span></div><div class="u">' + esc(l[1]) + " · " + esc(l[3]) + " · " +

      '<li class="done"><b>Source</b><br><span class="muted">' + esc(l[4] || "-") + "</span></li>" +
      '<li class="done"><b>Available ' + fmt0(l[5]) + " · passed ante-mortem " + fmt0(l[6]) + "</b></li>" +

  var LESSONS = [

    html = '<div class="list"><div class="li tot"><div class="l">' + (kind === "order" ? "Estimated total" : "Grand total") + '</div><div class="r2">' + (heads ? fmt0(gp) + " heads" : fmt0(gp) + " pcs · " + fmt(gk) + " kg") + "</div></div></div>" + html;
    html += probs.map(function (p) { return '<div class="warn">⚠️ ' + esc(p) + "</div>"; }).join("");
    if (ctx.s && ctx.s[kind] && date === ctx.t) html += '<p class="note" style="margin:0 16px">This replaces today\'s earlier ' + KINDS[kind].name + ".</p>";
    $("rBody").innerHTML = html;
    var blocked = probs.some(function (p) { return p.indexOf("missing") >= 0; });
    mainButton(blocked ? "FIX THE MISSING ITEMS" : "SUBMIT TO GROUP", !blocked, blocked ? null : submitDaily);
  }
  function payloadDaily() {
    var heads = KINDS[kind].unit === "heads", s = [], t = {};
    sections().forEach(function (sec) {
      var v = {}, vs = values[secKey(sec)] || {};
      keys(vs).forEach(function (sp) {
        var x = vs[sp]; if (!has(x)) return;
        v[sp] = heads ? (x.w ? (x.h || 0) + "+" + x.w + "(Woito)" : String(x.h || 0)) : [x.p || 0, Math.round((x.kg || 0) * 10) / 10];
      });
      if (keys(v).length) s.push({ o: sec.o, n: sec.n, v: v });
    });
    var payload = { v: 1, k: kind, d: date, s: s };
    if (kind === "livestock") {
      var own = tagsSel["own|"] || {}, tt = {}, ov = values["own|"] || {};
      keys(own).forEach(function (sp) { if (own[sp] && own[sp].length && has(ov[sp])) tt[sp] = own[sp]; });
      if (keys(tt).length) payload.t = tt;
      var src = {}; keys(srcSel).forEach(function (sp) { if (has(ov[sp])) src[sp] = srcSel[sp]; });
      if (keys(src).length) payload.src = src;
    } else if (kind === "production" || kind === "dispatch") {
      keys(tagsSel).forEach(function (sk) {
        if (sk.indexOf("own|") !== 0) return;
        keys(tagsSel[sk]).forEach(function (sp) {
          var l = tagsSel[sk][sp], vv = (values[sk] || {})[sp];
          if (!l || !l.length || !has(vv)) return;
          t[sk] = t[sk] || {}; t[sk][sp] = l.map(function (x) { return kind === "production" && x.kg ? { id: x.id, kg: x.kg } : { id: x.id }; });
        });
      });
      if (keys(t).length) payload.t = t;
    }
    return payload;
  }
  function submitDaily() { send(payloadDaily(), "Submit " + KINDS[kind].name + " for " + dayLabel(date) + "?"); }

  // ================================================================ CONDEMNATION & DAMAGE
  var cLines = [], cDate = ctx.t;
  function opt(list, cur, ph) { return (ph ? '<option value="">' + ph + "</option>" : "") + list.map(function (x) { return "<option" + (x === cur ? " selected" : "") + ">" + esc(x) + "</option>"; }).join(""); }
  function reasonOpts(cur) { return '<option value="">Reason…</option>' + keys(C.REASONS).map(function (g) { return '<optgroup label="' + esc(g) + '">' + C.REASONS[g].map(function (r) { return "<option" + (r === cur ? " selected" : "") + ">" + esc(r) + "</option>"; }).join("") + "</optgroup>"; }).join(""); }
  function openCondemn() { show("page"); kind = null; backButton(function () { haptic(); tab(current); }); drawCondemn(); }
  function drawCondemn() {
    var h = '<div class="card"><div class="h">⚠️ Condemnation & damage<span class="sub">' + dayLabel(cDate) + "</span></div>" +
      '<div class="dseg" style="margin:0 0 10px">' + [["2 days ago", addDays(ctx.t, -2)], ["Yesterday", addDays(ctx.t, -1)], ["Today", ctx.t]].map(function (x) { return '<button data-d="' + x[1] + '" class="' + (x[1] === cDate ? "on" : "") + '">' + x[0] + "</button>"; }).join("") + "</div>";
    h += cLines.length ? cLines.map(function (l, i) {
      return '<div class="lot"><div class="t">' + esc(l.p) + " · " + esc(l.sp) + ' <span class="chip r">' + (l.q ? fmt0(l.q) + " pcs " : "") + (l.kg ? fmt(l.kg) + " kg" : "") + '</span></div><div class="u">' +
        esc(l.st) + " · " + esc(l.c) + " · " + esc(l.o === "own" ? "Own" : l.n) + " · " + esc(l.r) + (l.t ? " · 🏷 " + esc(l.t) : "") + (l.note ? "<br><i>" + esc(l.note) + "</i>" : "") +
        '</div><button class="tagbtn" style="width:auto;margin-top:6px;padding:4px 10px" data-del="' + i + '">Remove</button></div>'; }).join("") : '<div class="empty">No lines yet. Add the first one below.</div>';
    h += "</div>";
    h += '<div class="card"><div class="h">Add a line</div>' +
      '<div class="two"><div class="fld"><label>Stage</label><select id="cSt">' + opt(C.STAGES, "Post-mortem") + '</select></div><div class="fld"><label>Owner</label><select id="cOw"><option value="own">Own (Luna)</option>' + (ctx.c || []).map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("") + "</select></div></div>" +
      '<div class="two"><div class="fld"><label>Category</label><select id="cCat">' + opt(C.CATEGORIES, "Offal") + '</select></div><div class="fld"><label>Product</label><select id="cPr"></select></div></div>' +
      '<div class="two"><div class="fld"><label>Species</label><select id="cSp">' + opt(SPECIES, "", "Species…") + '</select></div><div class="fld" id="cTagF" style="display:none"><label>Ear tag (optional)</label><input id="cTag" placeholder="ET…"></div></div>' +
      '<div class="two"><div class="fld"><label>Pcs</label><input id="cQ" inputmode="numeric" placeholder="0"></div><div class="fld"><label>Kg</label><input id="cKg" inputmode="decimal" placeholder="0"></div></div>' +
      '<div class="fld"><label>Reason</label><select id="cR">' + reasonOpts("") + "</select></div>" +
      '<div class="fld"><label>Note (required for Other)</label><input id="cN" maxlength="120" placeholder="Short note"></div>' +
      '<button class="btn ghost" id="cAdd">+ Add line</button></div>';
    h += '<div class="card"><div class="note">Stages <b>Chiller</b>, <b>Storage</b> and <b>Dispatch / Transport</b> reduce carcass stock. Ante-mortem and post-mortem losses are not in stock yet. Reasons follow standard meat-inspection findings.</div></div>';
    $("pageW").innerHTML = h + footer();
    var ds = $("pageW").querySelectorAll("[data-d]");
    for (var i = 0; i < ds.length; i++) ds[i].onclick = function () { select(); cDate = this.getAttribute("data-d"); drawCondemn(); };
    var dl = $("pageW").querySelectorAll("[data-del]");
    for (i = 0; i < dl.length; i++) dl[i].onclick = function () { cLines.splice(+this.getAttribute("data-del"), 1); drawCondemn(); };
    function prods() { var c = $("cCat").value; $("cPr").innerHTML = opt(C.PRODUCTS[c] || []); if (c === "Live animal") $("cSt").value = "Ante-mortem"; }
    $("cCat").onchange = prods; prods();
    $("cSp").onchange = function () { $("cTagF").style.display = contains(TAGGED, this.value) ? "block" : "none"; };
    $("cQ").oninput = function () { this.value = this.value.replace(/\D/g, ""); };
    $("cKg").oninput = function () { this.value = this.value.replace(",", ".").replace(/[^\d.]/g, ""); };
    $("cAdd").onclick = function () {
      var ow = $("cOw").value, sp = $("cSp").value;
      var l = { st: $("cSt").value, o: ow === "own" ? "own" : "svc", n: ow === "own" ? "" : ow, c: $("cCat").value, p: $("cPr").value, sp: sp,
        q: +$("cQ").value || 0, kg: parseFloat($("cKg").value) || 0, r: $("cR").value, t: contains(TAGGED, sp) ? $("cTag").value.trim().toUpperCase() : "", note: $("cN").value.trim() };
      var err = !l.sp ? "Choose the species." : !l.r ? "Choose the reason." : (!l.q && !l.kg) ? "Enter pcs and/or kg." : (l.r.indexOf("Other") === 0 && !l.note) ? "Add a note for Other." :
        (l.c === "Live animal" && l.st !== "Ante-mortem") ? "Live animals are rejected at ante-mortem." : "";
      if (err) { alertMsg(err); return; }
      haptic(); cLines.push(l); drawCondemn(); window.scrollTo(0, 0);
    };
    mainButton(cLines.length ? "SUBMIT " + cLines.length + " LINE" + (cLines.length > 1 ? "S" : "") : "ADD A LINE FIRST", cLines.length > 0, cLines.length ? function () {
      send({ v: 1, k: "condemn", d: cDate, e: cLines }, "Submit " + cLines.length + " condemnation line(s) for " + dayLabel(cDate) + "?");
    } : null);
  }

  // ================================================================ AGED BEEF
  function openAged() {
    show("page"); kind = null;
    backButton(function () { haptic(); tab(current); });
    mainButton("", false, null);
    $("pageW").innerHTML = agedCard(true) + '<button class="btn" id="agNew">+ New ageing batch</button>' +
      '<div class="card" style="margin-top:12px"><div class="note">Plan: maximum ' + C.AGED_MAX + " days; from day " + (C.AGED_MAX + 1) + " Fresh Kitchen pays storage. Dry ageing: 0–2 °C, 75–85% humidity, steady air flow; expect 5–15% weight loss plus trim.</div></div>" + footer();
    var b = document.querySelectorAll("[data-rel]");
    for (var i = 0; i < b.length; i++) b[i].onclick = function () { agedRelease(this.getAttribute("data-rel")); };
    $("agNew").onclick = agedNew;
  }
  function agedNew() {
    var stockTags = (ctx.tg.stock || []).filter(function (t) { return contains(TAGGED, t[1]); }), chosen = {};
    $("pageW").innerHTML = '<div class="card"><div class="h">🥩 New ageing batch</div>' +
      '<div class="two"><div class="fld"><label>Production date</label><input id="aPd" type="date" value="' + ctx.t + '" max="' + ctx.t + '"></div><div class="fld"><label>Into ageing</label><input id="aD" type="date" value="' + ctx.t + '" max="' + ctx.t + '"></div></div>' +
      '<div class="two"><div class="fld"><label>Species</label><select id="aSp">' + opt(["Bull", "Calf"], "Bull") + '</select></div><div class="fld"><label>Cut</label><select id="aCut">' + opt(C.CUTS, "Whole carcass") + "</select></div></div>" +
      '<div class="two"><div class="fld"><label>Method</label><select id="aM">' + opt(C.METHODS, "Dry") + '</select></div><div class="fld"><label>For</label><select id="aDest">' + opt(C.AGED_DEST, "Fresh Kitchen") + "</select></div></div>" +
      '<div class="two"><div class="fld"><label>Pcs</label><input id="aQ" inputmode="numeric" placeholder="0"></div><div class="fld"><label>Kg</label><input id="aKg" inputmode="decimal" placeholder="0"></div></div>' +
      '<div class="fld"><label><input type="checkbox" id="aFs" checked style="width:auto"> Taken from chilled carcass stock</label></div>' +
      '<div class="fld"><label>Ear tags (from stock)</label><div id="aTags">' + (stockTags.length ? stockTags.map(function (t) { return '<button class="tchip" data-t="' + esc(t[0]) + '">' + esc(t[0]) + "</button>"; }).join("") : '<span class="muted">No tagged carcass in stock.</span>') + "</div></div></div>" + footer();
    var cs = $("pageW").querySelectorAll(".tchip");
    for (var i = 0; i < cs.length; i++) cs[i].onclick = function () { var t = this.getAttribute("data-t"); if (chosen[t]) { delete chosen[t]; this.className = "tchip"; } else { chosen[t] = 1; this.className = "tchip on"; } };
    backButton(function () { haptic(); openAged(); });
    mainButton("SAVE BATCH", true, function () {
      var p = { v: 1, k: "aged", a: "in", pd: $("aPd").value, d: $("aD").value, sp: $("aSp").value, cut: $("aCut").value, m: $("aM").value, dest: $("aDest").value,
        q: +$("aQ").value || 0, kg: parseFloat($("aKg").value) || 0, fs: $("aFs").checked, t: keys(chosen) };
      if (!p.kg) { alertMsg("Enter the kg."); return; }
      if (p.pd > p.d) { alertMsg("Production date must be on or before the ageing date."); return; }
      send(p, "Save ageing batch: " + p.cut + ", " + fmt0(p.q) + " pcs, " + fmt(p.kg) + " kg?");
    });
  }
  function agedRelease(batch) {
    var b = ((snap && snap.aged) || []).filter(function (x) { return x[0] === batch; })[0];
    if (!b) return;
    show("page");
    $("pageW").innerHTML = '<div class="card"><div class="h">Release from ' + esc(batch) + '</div><div class="note">' + esc(b[1]) + " · on hand " + fmt0(b[6]) + " pcs · " + fmt(b[7]) + " kg · day " + b[5] + "</div>" +
      '<div class="two" style="margin-top:10px"><div class="fld"><label>Date</label><input id="rD" type="date" value="' + ctx.t + '" max="' + ctx.t + '"></div><div class="fld"><label>To</label><select id="rDest">' + opt(C.AGED_DEST, b[3]) + "</select></div></div>" +
      '<div class="two"><div class="fld"><label>Pcs</label><input id="rQ" inputmode="numeric" value="' + (b[6] || "") + '"></div><div class="fld"><label>Kg (after ageing)</label><input id="rKg" inputmode="decimal" placeholder="0"></div></div>' +
      '<div class="muted">Weight loss is calculated from the kg you enter.</div></div>' + footer();
    backButton(function () { haptic(); openAged(); });
    mainButton("SAVE RELEASE", true, function () {
      var p = { v: 1, k: "aged", a: "out", b: batch, d: $("rD").value, q: +$("rQ").value || 0, kg: parseFloat($("rKg").value) || 0, dest: $("rDest").value };
      if (!p.kg) { alertMsg("Enter the kg released."); return; }
      send(p, "Release " + fmt0(p.q) + " pcs, " + fmt(p.kg) + " kg from " + batch + "?");
    });
  }

  // ================================================================ boot
  if (inTelegram) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#f4f5f7"); } catch (e) {}
    try { if (tg.setBottomBarColor) tg.setBottomBarColor("#ffffff"); } catch (e) {}
  }
  if (ctx.o && contains(mine, ctx.o)) { current = "home"; openEntry(ctx.o); } else tab("home");
  window.__luna = { state: function () { return { kind: kind, date: date, values: values, tags: tagsSel }; }, payload: function () { return kind ? payloadDaily() : null; },
                    tab: tab, openEntry: openEntry, openTask: openTask, openPage: openPage };
})();
</script>
</body>
</html>
