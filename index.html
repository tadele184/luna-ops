<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LUNA Ops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LUNA Ops</title>
<style>
  /* Plain CSS for old and new web engines (older Mac Telegram): no flex gap, no inset, no optional chaining. */
  :root { --red:#e6332a; --red-50:#fdeeed; --red-100:#fad6d3; --ink:#1c2730; --ink2:#5d6c76; --ink3:#95a2ab; --line:#eceff1;
    --bg:#f4f5f7; --card:#fff; --green:#2e9e44; --green-50:#e8f5eb; --amber:#e08600; --amber-50:#fdf3e2; --blue:#0076a8; --blue-50:#e9f3f8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: 30px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); }
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0,#e6332a 25%,#f39200 25%,#f39200 50%,#3daa35 50%,#3daa35 75%,#0076a8 75%); }
  .top { display: flex; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .av { width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; overflow: hidden; border: 2px solid var(--red); margin-right: 11px; flex: none; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .nm { font-weight: 800; font-size: 16px; } .role { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-50); padding: 2px 8px; border-radius: 20px; }
  .brand { margin-left: auto; } .brand img { height: 26px; display: block; }
  .wrap { padding: 12px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.07); padding: 14px; margin-bottom: 12px; }
  .h { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px; display: flex; align-items: center; }
  .h .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 700; color: var(--ink3); }
  .title { font-size: 18px; font-weight: 800; margin: 0 0 2px; }
  .note { font-size: 12.5px; color: var(--ink2); line-height: 1.45; margin: 4px 0 10px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink2); line-height: 1.2; }
  .seg button small { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; }
  .seg button.on { background: var(--red); color: #fff; }
  .st { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 800; margin: 2px 4px 2px 0; }
  .ok { background: var(--green-50); color: var(--green); } .wait { background: var(--bg); color: var(--ink2); }
  .row { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .row.has { border-color: var(--red-100); }
  .rhead { display: flex; align-items: center; font-weight: 800; margin-bottom: 8px; }
  .rhead .x { margin-left: auto; color: var(--red); font-size: 13px; font-weight: 800; padding: 4px 8px; background: var(--red-50); border-radius: 8px; }
  .two { display: flex; } .two > * { flex: 1; min-width: 0; } .two > * + * { margin-left: 8px; }
  .three { display: flex; } .three > * { flex: 1; min-width: 0; } .three > * + * { margin-left: 6px; }
  .fld { margin-bottom: 8px; }
  .fld label { display: block; font-size: 10.5px; color: var(--ink3); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
  .fld input, .fld select { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; font-size: 15px; -webkit-appearance: none; }
  .fld select { background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2395a2ab'/></svg>") no-repeat right 10px center; padding-right: 24px; }
  .num { display: flex; align-items: center; background: var(--bg); border-radius: 10px; overflow: hidden; }
  .num button { width: 36px; height: 40px; font-size: 21px; font-weight: 700; color: var(--red); flex: none; }
  .num input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 17px; font-weight: 800; height: 40px; outline: none; padding: 0; }
  .val { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; border-radius: 10px; background: var(--green-50); color: var(--green); }
  .val.bad { background: var(--red-50); color: var(--red); }
  .hint { font-size: 12px; color: var(--blue); font-weight: 700; background: var(--blue-50); border-radius: 8px; padding: 4px 8px; margin-bottom: 8px; }
  .warn { font-size: 12.5px; color: var(--amber); font-weight: 700; background: var(--amber-50); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--red); color: #fff; font-weight: 800; text-align: center; font-size: 15.5px; }
  .btn.ghost { background: var(--red-50); color: var(--red); }
  .btn + .btn { margin-top: 8px; }
  .small-btns { display: flex; margin-bottom: 10px; } .small-btns > * { flex: 1; } .small-btns > * + * { margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; font-size: 10.5px; color: var(--ink3); font-weight: 800; text-transform: uppercase; padding: 4px 3px; }
  td { text-align: right; padding: 6px 3px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  tr.grp td { font-weight: 800; color: var(--red); border-top: 0; padding-top: 10px; }
  td.neg { color: var(--red); font-weight: 800; }
  .empty { text-align: center; color: var(--ink3); padding: 14px 6px; font-size: 13.5px; }
  .foot { text-align: center; color: var(--ink3); font-size: 11px; padding: 8px 12px; }
  .chips { margin: 0 0 6px; } .chips .lab { display: block; font-size: 10.5px; color: var(--ink3); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 4px; }
  .chip { display: inline-block; padding: 8px 12px; border-radius: 20px; background: var(--bg); margin: 0 6px 6px 0; font-size: 13.5px; font-weight: 700; color: var(--ink2); border: 1.5px solid transparent; }
  .chip.on { background: var(--red); color: #fff; }
  .chip.sm { padding: 6px 10px; font-size: 12.5px; }
  .chip.sug { background: var(--blue-50); color: var(--blue); }
  .menu { display: block; width: 100%; text-align: left; background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.07); padding: 14px; margin-bottom: 10px; border: 2px solid transparent; }
  .menu.due { border-color: var(--red-100); }
  .menu .in { display: flex; align-items: center; }
  .menu .no { width: 34px; height: 34px; border-radius: 50%; background: var(--red); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; margin-right: 12px; }
  .menu .t { font-weight: 800; font-size: 16px; } .menu .u { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .menu .go { margin-left: auto; padding-left: 8px; color: var(--ink3); font-size: 22px; }
  .bar { display: flex; align-items: center; margin: 0 0 10px; }
  .bar .back { padding: 7px 12px; border-radius: 10px; background: #fff; font-weight: 800; color: var(--red); box-shadow: 0 1px 3px rgba(28,39,48,.07); }
  .bar .ttl { margin-left: 10px; font-weight: 800; font-size: 17px; }
  .line { border-top: 1px solid var(--line); padding: 10px 0; } .line:first-child { border-top: 0; }
  .line .t { font-weight: 800; } .line .u { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
  .acts { margin-top: 6px; } .acts button { padding: 5px 12px; border-radius: 9px; font-size: 12.5px; font-weight: 800; margin-right: 6px; }
  .acts .ed { background: var(--blue-50); color: var(--blue); } .acts .rm { background: var(--red-50); color: var(--red); }
  .editing { background: var(--blue-50); border-radius: 12px; padding: 10px; }
  .kgbox input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px; font-size: 17px; font-weight: 800; text-align: right; height: 40px; }
  .kgbox input.auto { color: var(--ink2); font-style: italic; }
  .ok-t { color: var(--green); } .bad-t { color: var(--red); }
  body { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .top { padding-top: calc(12px + env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5; }
  .seg { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .seg button { min-width: 62px; }
  .menu.due { border-color: var(--red-100); }
  .who { display: flex; align-items: center; width: 100%; text-align: left; background: #fff; border-radius: 16px; padding: 12px; margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(28,39,48,.07); border: 2px solid transparent; }
  .who.on { border-color: var(--red); }
  .who .av { width: 42px; height: 42px; font-size: 16px; }
  .who .r { font-size: 12px; color: var(--ink2); }
  .pin { display: flex; justify-content: center; margin: 14px 0 18px; }
  .pin span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--red); margin: 0 8px; }
  .pin span.f { background: var(--red); }
  .keys { display: flex; flex-wrap: wrap; justify-content: space-between; }
  .keys button { width: 31%; margin-bottom: 10px; padding: 15px 0; border-radius: 14px; background: #fff; font-size: 22px; font-weight: 800;
    box-shadow: 0 1px 3px rgba(28,39,48,.09); }
  .keys button.k0 { background: none; box-shadow: none; font-size: 15px; color: var(--ink2); }
  .err { color: var(--red); font-weight: 800; text-align: center; min-height: 20px; font-size: 13.5px; }
  .shade { position: fixed; left: 0; right: 0; top: 0; bottom: 0; background: rgba(28,39,48,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .sheet .msg { font-size: 15px; line-height: 1.45; margin-bottom: 14px; white-space: pre-line; }
  .sheet .big { font-size: 34px; text-align: center; }
  .busy { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); background: rgba(28,39,48,.88); color: #fff; padding: 14px 20px; border-radius: 14px;
    font-weight: 700; z-index: 60; }
  .banner { background: var(--amber-50); color: var(--amber); font-weight: 800; border-radius: 14px; padding: 12px; margin-bottom: 12px; display: flex; align-items: center; }
  .banner button { margin-left: auto; background: var(--amber); color: #fff; padding: 7px 12px; border-radius: 10px; font-weight: 800; }
  .alert-r { color: var(--red); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  .alert-a { color: var(--amber); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  .links { text-align: center; margin-top: 6px; }
  .links button { color: var(--ink2); font-weight: 700; font-size: 13px; padding: 8px 10px; }
  .saved-by { font-size: 12px; color: var(--green); font-weight: 700; }
  .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 9px; font: inherit; font-size: 13px; }
  .small-btns .btn + .btn { margin-top: 0; }

</style>
</head>

<script>
// ============================================================================================================
// SHARED LOGIC (used by the server in Google Apps Script AND by the app on the phone).
// Everything is aligned on the SLAUGHTER DAY S:
//   Available Livestock   entered on S-1 (animals in the lairage the day before slaughter)
//   Ante Mortem           done on S-1, recorded for S (one day ahead of the other entries)
//   Production Order      for S (plan)
//   Production Actual     on S (pieces and carcass kg, against the order)
// Dates are ISO text "yyyy-mm-dd" everywhere, so there are no time-zone surprises.
// ============================================================================================================
var L = (function () {
  var SPECIES = ["HL Sheep", "BH Sheep", "Goat", "Bull", "Calf"];
  var CUSTOMERS = ["YABU", "BILASOT", "BBM", "ART MERI", "GETACHEW", "BLACK PHOENIX", "HABTAMU DEMBEL",
    "AL HALAL", "YASMIN JIBRIL", "HOMESIDE", "FUAD"];
  var CHANNELS = ["Export", "Local", "Fresh Corner", "Kitchen"];
  var REASONS = ["Sick / fever", "Lame / injured", "Emaciated", "Pregnant", "Dead on arrival", "Other"];
  var AVG_KG = { "HL Sheep": 15, "BH Sheep": 13, "Goat": 11, "Bull": 210, "Calf": 70 };        // carcass kg per head
  var RANGE = { "HL Sheep": [7, 28], "BH Sheep": [7, 28], "Goat": [5, 22], "Bull": [90, 420], "Calf": [25, 160] };
  var KINDS = { lv: "Available Livestock", am: "Ante Mortem", order: "Production Order", prod: "Production Actual" };
  var OWN = "Own";
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  // ---------------------------------------------------------------- dates
  function isISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + "T00:00:00Z")) && new Date(s + "T00:00:00Z").toISOString().slice(0, 10) === s; }
  function addDays(iso, k) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); }
  function diff(a, b) { return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 864e5); }   // a - b in days
  function dObj(iso) { return new Date(iso + "T00:00:00Z"); }
  function dShort(iso) { var d = dObj(iso); return DOW[d.getUTCDay()] + " " + ("0" + d.getUTCDate()).slice(-2) + " " + MON[d.getUTCMonth()]; }
  function dLong(iso) { var d = dObj(iso); return DOWL[d.getUTCDay()] + " " + ("0" + d.getUTCDate()).slice(-2) + " " + MONL[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function dDM(iso) { var d = dObj(iso); return ("0" + d.getUTCDate()).slice(-2) + " " + MON[d.getUTCMonth()]; }
  function range(d1, d2) { var out = [], d = d1; while (d <= d2) { out.push(d); d = addDays(d, 1); } return out; }

  // Which dates each form may be saved for, relative to today. The admin may also correct the past week.
  function win(kind, admin) {
    var w = { lv: [-1, 0], am: [-1, 1], order: [-1, 2], prod: [-2, 0] }[kind];
    return admin ? [Math.min(w[0], -7), w[1]] : [w[0], w[1]];
  }
  function defaultDate(kind, t) { return addDays(t, { lv: 0, am: 1, order: 1, prod: 0 }[kind]); }

  // ---------------------------------------------------------------- numbers and text
  function n(x) { return x ? Math.round(x).toLocaleString("en-US") : "-"; }
  function n1(x) { return x ? (Math.round(x * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : "-"; }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function int_(v, lo, hi) {
    if (v === null || v === undefined || v === "" || typeof v === "boolean") return null;
    var f = Number(v);
    if (!isFinite(f) || f !== Math.floor(f) || f < lo || f > hi) return null;
    return f;
  }
  function num_(v, lo, hi) {
    if (v === null || v === undefined || v === "" || typeof v === "boolean") return null;
    var f = Number(v);
    if (!isFinite(f) || f < lo || f > hi) return null;
    return Math.round(f * 10) / 10;
  }
  function txt(v, max) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim().slice(0, max || 80); }
  function owner(o) {
    if (o === "own" || o === OWN) return OWN;
    o = txt(o).toUpperCase();
    return CUSTOMERS.indexOf(o) >= 0 ? o : null;
  }
  function ownerLabel(o) { return o === OWN ? "Own" : o; }

  function sum(rows, field) {          // {"owner|species": total} in first-seen order
    var t = {};
    (rows || []).forEach(function (r) { var k = r.o + "|" + r.sp; t[k] = (t[k] || 0) + (Number(r[field]) || 0); });
    return t;
  }

  // ---------------------------------------------------------------- validation (the server always re-checks)
  // getDoc(kind, iso) returns the saved rows or null. Returns {d, rows, warn, err}.
  function clean(kind, data, t, admin, getDoc) {
    var bad = function (m) { return { err: m, warn: [] }; };
    if (!KINDS[kind]) return bad("Unknown form.");
    var d = data && data.d;
    if (!isISO(d)) return bad("Choose the date.");
    var w = win(kind, admin), k = diff(d, t);
    if (k < w[0] || k > w[1]) return bad("That date cannot be entered any more. Ask the admin.");
    var rows = data.rows;
    if (!Array.isArray(rows) || rows.length > 120) return bad("The data is not valid.");
    var out = [], warn = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], no = i + 1;
      if (!r || typeof r !== "object") return bad("Line " + no + " is not valid.");
      var o = owner(r.o), sp = r.sp;
      if (!o) return bad("Line " + no + ": choose the owner.");
      if (SPECIES.indexOf(sp) < 0) return bad("Line " + no + ": choose the species.");
      if (kind === "lv") {
        var q = int_(r.q, 1, 5000);
        if (q === null) return bad("Line " + no + " (" + sp + "): enter the number of heads.");
        var sup = txt(r.sup), plate = txt(r.plate, 20).toUpperCase(), org = txt(r.org);
        if (!sup) return bad("Line " + no + " (" + sp + "): enter the supplier name.");
        if (!plate) return bad("Line " + no + " (" + sp + "): enter the plate number.");
        if (!org) return bad("Line " + no + " (" + sp + "): enter the origin (location).");
        out.push({ o: o, sp: sp, q: q, sup: sup, plate: plate, org: org });
      } else if (kind === "am") {
        var ins = int_(r.ins, 0, 5000), rej = int_(r.rej === "" || r.rej == null ? 0 : r.rej, 0, 5000);
        if (ins === null || rej === null) return bad("Line " + no + " (" + sp + "): heads must be whole numbers.");
        if (rej > ins) return bad("Line " + no + " (" + sp + "): rejected cannot be more than inspected.");
        var why = txt(r.why, 120);
        if (rej && !why) return bad("Line " + no + " (" + sp + "): give the reason for the " + rej + " rejected.");
        if (ins) out.push({ o: o, sp: sp, ins: ins, rej: rej, ok: ins - rej, why: rej ? why : "" });
      } else {
        var ch = o === OWN ? txt(r.ch) : o;
        if (o === OWN && CHANNELS.indexOf(ch) < 0) return bad("Line " + no + " (" + sp + "): choose the channel (Export, Local, Fresh Corner, Kitchen).");
        var pcs = int_(r.pcs === "" || r.pcs == null ? 0 : r.pcs, 0, 5000), kg = num_(r.kg === "" || r.kg == null ? 0 : r.kg, 0, 1e7);
        if (pcs === null || kg === null) return bad("Line " + no + " (" + sp + "): pieces and kg must be numbers.");
        if (kind === "prod" && pcs && !kg) return bad("Line " + no + " (" + sp + "): enter the actual carcass kg.");
        if (kind === "prod" && kg && !pcs) return bad("Line " + no + " (" + sp + "): enter the pieces.");
        if (pcs && kg && (kg / pcs < 3 || kg / pcs > 450)) return bad("Line " + no + " (" + sp + "): " + (kg / pcs).toFixed(1) + " kg per head is not possible. Check pieces and kg.");
        if (pcs) {
          if (kind === "prod") {
            var rg = RANGE[sp];
            if (kg / pcs < rg[0] || kg / pcs > rg[1]) warn.push(ownerLabel(o) + " " + sp + ": " + (kg / pcs).toFixed(1) + " kg per carcass is outside the usual " + rg[0] + "-" + rg[1] + " kg.");
          }
          out.push({ o: o, ch: ch, sp: sp, pcs: pcs, kg: kg });
        }
      }
    }
    if (!out.length) return bad("Nothing entered yet.");
    if (kind === "am") {
      var av = available(d, getDoc);
      out.forEach(function (r) {
        var a = av[r.o + "|" + r.sp];
        if (a !== undefined && r.ins > a) warn.push(ownerLabel(r.o) + " " + r.sp + ": " + r.ins + " inspected but " + a + " available.");
      });
    }
    if (kind === "order" || kind === "prod") {
      var passed = amPassed(d, getDoc), tot = sum(out, "pcs");
      Object.keys(tot).forEach(function (key) {
        var p = passed[key], parts = key.split("|");
        if (p !== undefined && tot[key] > p) warn.push(ownerLabel(parts[0]) + " " + parts[1] + ": " + tot[key] + (kind === "order" ? " ordered" : " produced") + " but only " + p + " passed ante-mortem.");
      });
    }
    return { d: d, rows: out, warn: warn, err: null };
  }

  // ---------------------------------------------------------------- the plan for a slaughter day
  function available(S, getDoc) { var r = getDoc("lv", addDays(S, -1)); return r ? sum(r, "q") : {}; }
  function amPassed(S, getDoc) { var r = getDoc("am", S); return r ? sum(r, "ok") : {}; }

  function plan(S, getDoc) {
    var lvDay = addDays(S, -1);
    var lv = getDoc("lv", lvDay), am = getDoc("am", S), od = getDoc("order", S), pr = getDoc("prod", S);
    var lines = {}, keys = [];
    function line(o, sp) {
      var k = o + "|" + sp;
      if (!lines[k]) { lines[k] = { o: o, sp: sp, av: null, ins: null, rej: 0, ok: null, why: [], pcs: 0, kg: 0, ch: {}, apcs: null, akg: null }; keys.push(k); }
      return lines[k];
    }
    (lv || []).forEach(function (r) { var x = line(r.o, r.sp); x.av = (x.av || 0) + r.q; });
    (am || []).forEach(function (r) {
      var x = line(r.o, r.sp); x.ins = (x.ins || 0) + r.ins; x.ok = (x.ok || 0) + r.ok; x.rej += r.rej;
      if (r.why) x.why.push(r.rej + " " + r.why);
    });
    (od || []).forEach(function (r) { var x = line(r.o, r.sp); x.pcs += r.pcs; x.kg += r.kg; x.ch[r.ch] = (x.ch[r.ch] || 0) + r.pcs; });
    (pr || []).forEach(function (r) { var x = line(r.o, r.sp); x.apcs = (x.apcs || 0) + r.pcs; x.akg = Math.round(((x.akg || 0) + r.kg) * 10) / 10; });
    var ok = [OWN].concat(CUSTOMERS);
    var rows = keys.map(function (k) { return lines[k]; }).sort(function (a, b) {
      var ao = ok.indexOf(a.o), bo = ok.indexOf(b.o);

  // ================================================================ 1 AVAILABLE LIVESTOCK

    var isOrder = S.kind === "order", sav = !!saved(S.kind, S.d), pm = passedMap(S.d, isOrder ? "ok" : "okp"), src = (X.pre.src || {})[S.d];
    var note = isOrder ? "Reservation for the <b>slaughter date</b>. " + (sav ? savedBy("order", S.d) + " <b>Correct and save again.</b>" : src === "am" ? "Filled from the heads that passed ante-mortem: adjust the pieces; kg is estimated." : src === "lv" ? "Filled from the available livestock (no ante-mortem yet)." : "No ante-mortem for this date yet: add lines.")
      : "Actual pieces and <b>weighed carcass kg</b> for the slaughter date. " + (sav ? savedBy("prod", S.d) + " <b>Correct and save again.</b>" : (X.pre.od || {})[S.d] && X.pre.od[S.d].length ? "Lines come from the production order; the plan is shown on each line." : "No production order for this date: add lines.");
    var h = '<div class="note">' + note + "</div>" + dateSeg(S.kind, S.d), sum = {}, tP = 0, tK = 0;
    S.rows.forEach(function (r) { var k = r.o + "|" + r.sp; sum[k] = (sum[k] || 0) + (+r.pcs || 0); tP += +r.pcs || 0; tK += +r.kg || 0; });
    S.rows.forEach(function (r, i) {
      var p = pm[r.o + "|" + r.sp], over = p != null && sum[r.o + "|" + r.sp] > p, avg = (+r.pcs && +r.kg) ? r.kg / r.pcs : null, rg = X.range[r.sp] || [0, 1e9];
      h += '<div class="row has"><div class="rhead">' + esc(ownerName(r.o)) + " · " + esc(r.sp) +
        (r.o === "Own" ? '<button class="x" data-split="' + i + '" style="margin-left:auto;background:var(--blue-50);color:var(--blue)">+ Other channel</button>' : "") +
        '<button class="x" data-del="' + i + '"' + (r.o === "Own" ? ' style="margin-left:6px"' : "") + ">✕</button></div>" +
        (r.o === "Own" ? chips("Channel", X.ch, r.ch, "ch" + i, "sm") : "") +
        (!isOrder && r.plan ? '<div class="hint">Order: ' + fmt(r.plan[0]) + " pcs · " + fmt(r.plan[1]) + ' kg <button class="chip sm sug" data-same="' + i + '" style="margin:0 0 0 6px">Same pieces</button></div>' : "") +
        (isOrder && p != null ? '<div class="hint">' + (src === "am" ? "Passed ante-mortem" : "Available") + ": " + fmt(p) + " · ordered " + fmt(sum[r.o + "|" + r.sp]) + "</div>" : "") +
        '<div class="two"><div class="fld"><label>Pieces</label>' + numBox("lp" + i, r.pcs) + '</div><div class="fld kgbox"><label>' + (isOrder ? "Kg (estimated · " + fmt(X.avg[r.sp]) + " kg/hd)" : "Carcass kg (weighed)") + '</label><input data-kg="' + i + '" inputmode="decimal" class="' + (isOrder && r.auto ? "auto" : "") + '" value="' + (r.kg || "") + '" placeholder="0"></div></div>' +
        (!isOrder && avg ? '<div class="' + (avg < rg[0] || avg > rg[1] ? "warn" : "hint") + '">' + fmt(avg, 1) + " kg per carcass" + (avg < rg[0] || avg > rg[1] ? " · outside the usual " + rg[0] + "-" + rg[1] + " kg" : "") + (r.plan && r.plan[0] ? " · " + Math.round(r.pcs / r.plan[0] * 100) + "% of order" : "") + "</div>" : "") +
        (over ? '<div class="warn">' + (isOrder ? "Ordered" : "Produced") + " more than " + (isOrder && src !== "am" ? "available" : "passed ante-mortem") + ".</div>" : "") + "</div>";
    });
    if (!S.rows.length) h += '<div class="empty">No lines yet.</div>';
    else h += '<div class="hint">Total: ' + fmt(tP) + " pcs · " + fmt(tK, 1) + " kg</div>";
    if (S.add) h += '<div class="card" style="background:var(--bg);box-shadow:none;margin:12px 0"><div class="h">Add a line</div>' +
      ownerChips(S.add.o, "ao") + chips("Species", X.sp, S.add.sp, "asp") +
      (S.add.o === "Own" ? chips("Channel", X.ch, S.add.ch, "ach", "sm") : "") + '<button class="btn ghost" id="addOk">Add the line</button></div>';
    else h += '<button class="btn ghost" id="addLine">+ Add a line</button>';
    h += '<button class="btn" id="save">' + (sav ? "Save changes" : isOrder ? "Save Production Order" : "Save Production Actual") + "</button>";
    var el = screen(S.kind, h);
    onChip(el, "date", function (d) { odLoad(S, d); lineDraw(S); });
    bindSteps(el, function (inp, redraw) {
      var r = S.rows[+inp.id.slice(2)]; r.pcs = +inp.value || 0;
      if (isOrder && (r.auto || !r.kg)) { r.kg = Math.round(r.pcs * (X.avg[r.sp] || 0)); r.auto = true; }
      if (redraw) lineDraw(S);
    });
    all(el, "[data-kg]").forEach(function (inp) {
      inp.oninput = function () { this.value = this.value.replace(",", ".").replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1").slice(0, 9); var r = S.rows[+this.getAttribute("data-kg")]; r.kg = this.value; r.auto = false; };
      inp.onchange = function () { lineDraw(S); };
    });
    S.rows.forEach(function (r, i) { onChip(el, "ch" + i, function (v) { r.ch = v; lineDraw(S); }); });
    onChip(el, "same", function (v) { var r = S.rows[+v]; r.pcs = r.plan[0]; lineDraw(S); });
    onChip(el, "del", function (v) { S.rows.splice(+v, 1); lineDraw(S); });
    onChip(el, "split", function (v) {
      var j = +v, l = S.rows[j], used = S.rows.filter(function (r) { return r.o === l.o && r.sp === l.sp; }).map(function (r) { return r.ch; });
      var ch = X.ch.filter(function (c) { return used.indexOf(c) < 0; })[0];
      if (!ch) return alertMsg("All channels are already used for " + l.sp + ".");
      S.rows.splice(j + 1, 0, { o: l.o, sp: l.sp, ch: ch, pcs: 0, kg: 0, auto: true }); lineDraw(S);
    });
    if ($("addLine")) $("addLine").onclick = function () { S.add = { o: "Own", sp: "", ch: "Export" }; lineDraw(S); window.scrollTo(0, 9999); };
    onChip(el, "ao", function (v) { S.add.o = v; S.add.ch = v === "Own" ? "Export" : v; lineDraw(S); });
    onChip(el, "asp", function (v) { S.add.sp = v; lineDraw(S); });
    onChip(el, "ach", function (v) { S.add.ch = v; lineDraw(S); });
    if ($("addOk")) $("addOk").onclick = function () {
      if (!S.add.sp) return alertMsg("Tap the species.");
      var ch = S.add.o === "Own" ? S.add.ch : S.add.o;
      if (S.rows.some(function (r) { return r.o === S.add.o && r.sp === S.add.sp && (r.ch || r.o) === ch; })) return alertMsg("That line is already in the list.");
      S.rows.push({ o: S.add.o, sp: S.add.sp, ch: ch, pcs: 0, kg: 0, auto: true }); S.add = null; lineDraw(S);
    };
    $("save").onclick = function () {
      var rows = [], err = "";
      S.rows.forEach(function (r) {
        var pcs = +r.pcs || 0, kg = Math.round((+r.kg || 0) * 10) / 10;
        if (!pcs && !kg) return;
        if (!isOrder && pcs && !kg) err = err || ownerName(r.o) + " " + r.sp + ": enter the weighed carcass kg.";
        else if (!isOrder && kg && !pcs) err = err || ownerName(r.o) + " " + r.sp + ": enter the pieces.";
        else if (pcs && kg && (kg / pcs < 3 || kg / pcs > 450)) err = err || ownerName(r.o) + " " + r.sp + ": " + fmt(kg / pcs, 1) + " kg per head is not possible.";
        rows.push({ o: r.o, sp: r.sp, ch: r.o === "Own" ? r.ch : r.o, pcs: pcs, kg: kg });
      });
      if (err) return alertMsg(err); if (!rows.length) return alertMsg("Enter pieces on at least one line.");
      submit({ k: S.kind, d: S.d, rows: rows }, "Save " + FORMS[S.kind].name + " for " + dlabel(S.d) + "?");
    };
  }


  // ================================================================ 5 EXCEL EXPORT (built on the phone from the server data)
  var XLP = "t";
  function period(p) {
    var t = X.t, wd = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7;
    if (p === "y") return [addDays(t, -1), addDays(t, -1)];
    if (p === "w") return [addDays(t, -wd), t];
    if (p === "lw") return [addDays(t, -wd - 7), addDays(t, -wd - 1)];
    if (p === "m") return [t.slice(0, 8) + "01", t];
    if (p === "tt") return [t, addDays(t, 1)];
    return [t, t];
  }
  function xlOpen() {
    var P = [{ v: "t", l: "Today" }, { v: "y", l: "Yesterday" }, { v: "tt", l: "Today + tomorrow" }, { v: "w", l: "This week" }, { v: "lw", l: "Last week" }, { v: "m", l: "This month" }];
    var pr = period(XLP);
    var h = '<div class="note">Sheets: <b>Plan vs Actual</b> (available, ante mortem, order, actual, done %), <b>Available Livestock</b> (lines), <b>Ante Mortem</b> (rejections and reasons), <b>Order &amp; Actual</b> by channel.</div>' +
      chips("Slaughter days", P, XLP, "p") + '<div class="hint">' + esc(pr[0] === pr[1] ? dlabel(pr[0]) : dlabel(pr[0]) + " to " + dlabel(pr[1])) + "</div>" +
      '<button class="btn" id="xlGo">📊 Make the Excel</button>';
    var el = screen("xl", h);
    onChip(el, "p", function (v) { XLP = v; xlOpen(); });
    $("xlGo").onclick = function () {
      busy(true, "Making the Excel…");
      Promise.all([api("export", { d1: pr[0], d2: pr[1] }), loadExcelJS()]).then(function (res) {
        var j = res[0]; if (!j.ok) { busy(false); return alertMsg(j.error); }
        return XL.build(j, LOGO, FOOTER).then(function (blob) {
          busy(false);
          var name = "Slaughter_Plan_" + pr[0] + (pr[1] !== pr[0] ? "_to_" + pr[1] : "") + ".xlsx";
          var file = null; try { file = new File([blob], name, { type: blob.type }); } catch (e) {}
          var btns = [{ t: "⬇️ Save to the phone", v: "dl" }];
          if (file && navigator.canShare && navigator.canShare({ files: [file] })) btns.push({ t: "📤 Share (WhatsApp, Telegram, email)", v: "sh", ghost: true });
          btns.push({ t: "Close", v: "", ghost: true });
          return sheet('<div class="big">📊</div><div class="msg" style="text-align:center"><b>' + esc(name) + "</b></div>", btns).then(function (v) {
            if (v === "dl") { var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
            if (v === "sh") navigator.share({ files: [file], title: name }).catch(function () {});
          });
        });
      }).catch(function (e) { busy(false); alertMsg(e && e.message === "lib" ? "Could not load the Excel tool. Check the internet and try again." : "No internet connection."); });
    };
  }
  var xlLoading = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve();
    if (xlLoading) return xlLoading;
    xlLoading = new Promise(function (res, rej) {
      var s = document.createElement("script"); s.src = "exceljs.min.js"; s.onload = res; s.onerror = function () { xlLoading = null; rej(new Error("lib")); }; document.head.appendChild(s);
    });
    return xlLoading;
  }

  // ================================================================ go
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  start();
  window.__app = { get X() { return X; }, home: home, LV: function () { return LV; }, AM: function () { return AM; } };
})();
</script>
