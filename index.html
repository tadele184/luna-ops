<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>LUNA Ops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Plain CSS for old and new web engines (older Mac Telegram): no flex gap, no inset, no optional chaining. */
  :root { --red:#e6332a; --red-50:#fdeeed; --red-100:#fad6d3; --ink:#1c2730; --ink2:#5d6c76; --ink3:#95a2ab; --line:#eceff1;
    --bg:#f4f5f7; --card:#fff; --green:#2e9e44; --green-50:#e8f5eb; --amber:#e08600; --amber-50:#fdf3e2; --blue:#0076a8; --blue-50:#e9f3f8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { padding-bottom: 30px; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); }
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0,#e6332a 25%,#f39200 25%,#f39200 50%,#3daa35 50%,#3daa35 75%,#0076a8 75%); }
  .top { display: flex; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); }
  .av { width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; overflow: hidden; border: 2px solid var(--red); margin-right: 11px; flex: none; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .nm { font-weight: 800; font-size: 16px; } .role { display: inline-block; margin-top: 3px; font-size: 11.5px; font-weight: 700; color: var(--red); background: var(--red-50); padding: 2px 8px; border-radius: 20px; }
  .brand { margin-left: auto; } .brand img { height: 26px; display: block; }
  .wrap { padding: 12px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(28,39,48,.07); padding: 14px; margin-bottom: 12px; }
  .h { font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px; display: flex; align-items: center; }
  .h .sub { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 700; color: var(--ink3); }
  .title { font-size: 18px; font-weight: 800; margin: 0 0 2px; }
  .note { font-size: 12.5px; color: var(--ink2); line-height: 1.45; margin: 4px 0 10px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--ink2); line-height: 1.2; }
  .seg button small { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; }
  .seg button.on { background: var(--red); color: #fff; }
  .st { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 800; margin: 2px 4px 2px 0; }
  .ok { background: var(--green-50); color: var(--green); } .wait { background: var(--bg); color: var(--ink2); }
  .row { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-bottom: 10px; }
  .row.has { border-color: var(--red-100); }
  .rhead { display: flex; align-items: center; font-weight: 800; margin-bottom: 8px; }
  .rhead .x { margin-left: auto; color: var(--red); font-size: 13px; font-weight: 800; padding: 4px 8px; background: var(--red-50); border-radius: 8px; }
  .two { display: flex; } .two > * { flex: 1; min-width: 0; } .two > * + * { margin-left: 8px; }
  .three { display: flex; } .three > * { flex: 1; min-width: 0; } .three > * + * { margin-left: 6px; }
  .fld { margin-bottom: 8px; }
  .fld label { display: block; font-size: 10.5px; color: var(--ink3); font-weight: 800; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
  .fld input, .fld select { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 9px; font-size: 15px; -webkit-appearance: none; }
  .fld select { background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2395a2ab'/></svg>") no-repeat right 10px center; padding-right: 24px; }
  .num { display: flex; align-items: center; background: var(--bg); border-radius: 10px; overflow: hidden; }
  .num button { width: 36px; height: 40px; font-size: 21px; font-weight: 700; color: var(--red); flex: none; }
  .num input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 17px; font-weight: 800; height: 40px; outline: none; padding: 0; }
  .val { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; border-radius: 10px; background: var(--green-50); color: var(--green); }
  .val.bad { background: var(--red-50); color: var(--red); }
  .hint { font-size: 12px; color: var(--blue); font-weight: 700; background: var(--blue-50); border-radius: 8px; padding: 4px 8px; margin-bottom: 8px; }
  .warn { font-size: 12.5px; color: var(--amber); font-weight: 700; background: var(--amber-50); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
  .btn { display: block; width: 100%; padding: 13px; border-radius: 12px; background: var(--red); color: #fff; font-weight: 800; text-align: center; font-size: 15.5px; }
  .btn.ghost { background: var(--red-50); color: var(--red); }
  .btn + .btn { margin-top: 8px; }
  .small-btns { display: flex; margin-bottom: 10px; } .small-btns > * { flex: 1; } .small-btns > * + * { margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: right; font-size: 10.5px; color: var(--ink3); font-weight: 800; text-transform: uppercase; padding: 4px 3px; }
  td { text-align: right; padding: 6px 3px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  tr.grp td { font-weight: 800; color: var(--red); border-top: 0; padding-top: 10px; }
  td.neg { color: var(--red); font-weight: 800; }
  .empty { text-align: center; color: var(--ink3); padding: 14px 6px; font-size: 13.5px; }
  .foot { text-align: center; color: var(--ink3); font-size: 11px; padding: 8px 12px; }
</style>
</head>

  // ---------------------------------------------------------------- status
  function statusCard() {
    var names = ["Livestock", "Ante-mortem", "Order"], h = '<div class="card"><div class="h">Slaughter plan<span class="sub">group: 08:00 · 12:00 · 14:00 · 18:00</span></div>';
    [X.t, addDays(X.t, 1)].forEach(function (d, i) {
      var s = X.st[d] || [0, 0, 0];
      h += '<div style="margin-bottom:4px"><b>' + (i ? "Tomorrow" : "Today") + "</b> " + dlabel(d) + "<br>" + names.map(function (n, j) { return '<span class="st ' + (s[j] ? "ok" : "wait") + '">' + (s[j] ? "✓ " : "") + n + "</span>"; }).join("") + "</div>";
    });
    return h + "</div>";
  }

  // ---------------------------------------------------------------- 1 LIVESTOCK AVAILABILITY
  var LV = { d: X.dd.lv, rows: null };
  function lvLoad(d) { LV.d = d; LV.rows = clone(saved("lv", d)) || []; if (!LV.rows.length) LV.rows.push({ o: "Own", sp: "", q: "", sup: "", plate: "", org: "" }); }
  function lvDraw() {
    var el = $("sec_lv"), sav = !!saved("lv", LV.d), tot = {}, keysT = [];
    LV.rows.forEach(function (r) { if (r.sp && +r.q) { var k = ownerName(r.o) + " · " + r.sp; if (!(k in tot)) { tot[k] = 0; keysT.push(k); } tot[k] += +r.q; } });
    var h = '<div class="title">🐑 Livestock Availability</div><div class="note">Animals in the lairage on this day, for slaughter the next day (' + dlabel(addDays(LV.d, 1)) + "). One line per truck or supplier." + (sav ? " <b>Saved: correct anything and save again.</b>" : "") + "</div>" + dateSeg("lv", LV.d);
    if (keysT.length) h += '<table><tr><th>Owner · species</th><th>Heads</th></tr>' + keysT.map(function (k) { return "<tr><td>" + esc(k) + "</td><td><b>" + fmt(tot[k]) + "</b></td></tr>"; }).join("") + "</table><div style=\"height:10px\"></div>";
    h += '<datalist id="supL">' + (X.sup || []).map(function (s) { return '<option value="' + esc(s[0]) + '">'; }).join("") + "</datalist>";
    LV.rows.forEach(function (r, i) {
      h += '<div class="row' + (r.sp && +r.q ? " has" : "") + '"><div class="rhead">Line ' + (i + 1) + (LV.rows.length > 1 ? '<button class="x" data-del="' + i + '">✕ Remove</button>' : "") + "</div>" +
        '<div class="two"><div class="fld"><label>Owner</label><select data-f="o" data-i="' + i + '">' + opts(OWNERS, r.o) + '</select></div><div class="fld"><label>Species</label><select data-f="sp" data-i="' + i + '">' + opts(X.sp, r.sp, "Choose…") + "</select></div></div>" +
        '<div class="two"><div class="fld"><label>Heads</label>' + numBox("lvq" + i, r.q) + '</div><div class="fld"><label>Supplier</label><input data-f="sup" data-i="' + i + '" list="supL" maxlength="80" value="' + esc(r.sup) + '" placeholder="Type or pick"></div></div>' +
        '<div class="two"><div class="fld"><label>Plate number</label><input data-f="plate" data-i="' + i + '" maxlength="20" value="' + esc(r.plate) + '" autocapitalize="characters"></div><div class="fld"><label>Origin (location)</label><input data-f="org" data-i="' + i + '" maxlength="80" value="' + esc(r.org) + '"></div></div></div>';
    });
    h += '<button class="btn ghost" id="lvAdd">+ Add line</button><button class="btn" id="lvSave">' + (sav ? "Save changes" : "Save livestock") + "</button>";
    el.innerHTML = h;
    bindDates(el, function (d) { lvLoad(d); lvDraw(); });
    var f = el.querySelectorAll("[data-f]");
    for (var i = 0; i < f.length; i++) f[i][f[i].tagName === "SELECT" ? "onchange" : "oninput"] = function () {
      var r = LV.rows[+this.getAttribute("data-i")], k = this.getAttribute("data-f"); r[k] = this.value;
      if (k === "sup") (X.sup || []).forEach(function (s) { if (s[0].toLowerCase() === r.sup.trim().toLowerCase()) { if (!r.plate) r.plate = s[1]; if (!r.org) r.org = s[2]; lvDraw(); } });
      if (k === "o" || k === "sp") lvDraw();
    };
    bindSteps(el, function (inp, redraw) { LV.rows[+inp.id.slice(3)].q = inp.value; if (redraw) lvDraw(); });
    var dl = el.querySelectorAll("[data-del]");
    for (i = 0; i < dl.length; i++) dl[i].onclick = function () { LV.rows.splice(+this.getAttribute("data-del"), 1); lvDraw(); };
    $("lvAdd").onclick = function () { var last = LV.rows[LV.rows.length - 1] || {}; LV.rows.push({ o: last.o || "Own", sp: "", q: "", sup: last.sup || "", plate: last.plate || "", org: last.org || "" }); lvDraw(); };
    $("lvSave").onclick = function () {
      var rows = [], err = "";
      LV.rows.forEach(function (r, i) {
        if (!r.sp && !+r.q && !r.sup) return;
        if (!r.sp) err = err || "Line " + (i + 1) + ": choose the species."; else if (!(+r.q > 0)) err = err || "Line " + (i + 1) + ": enter the heads.";
        else if (!r.sup.trim()) err = err || "Line " + (i + 1) + ": enter the supplier."; else if (!r.plate.trim()) err = err || "Line " + (i + 1) + ": enter the plate number."; else if (!r.org.trim()) err = err || "Line " + (i + 1) + ": enter the origin.";
        rows.push({ o: r.o, sp: r.sp, q: +r.q, sup: r.sup.trim(), plate: r.plate.trim(), org: r.org.trim() });
      });
      if (err) return alertMsg(err); if (!rows.length) return alertMsg("Add at least one line.");
      send({ k: "lv", d: LV.d, rows: rows }, "Save Livestock Availability for " + dlabel(LV.d) + "?");
    };
  }

  // ---------------------------------------------------------------- 2 ANTE-MORTEM (one day ahead)
  var AM = { d: X.dd.am, rows: null };
  function amLoad(d) {
    AM.d = d; var s = saved("am", d);
    AM.rows = s ? clone(s) : ((X.pre.av || {})[d] || []).map(function (a) { return { o: a[0], sp: a[1], ins: a[2], rej: 0, why: "", av: a[2] }; });
    var av = {}; ((X.pre.av || {})[d] || []).forEach(function (a) { av[a[0] + "|" + a[1]] = a[2]; });
    AM.rows.forEach(function (r) { r.av = av[r.o + "|" + r.sp]; });
  }
  function amDraw() {
    var el = $("sec_am"), sav = !!saved("am", AM.d), lvd = addDays(AM.d, -1);
    var h = '<div class="title">🩺 Ante-mortem</div><div class="note">Done the day before slaughter. Choose the <b>slaughter date</b>; the animals available on ' + dlabel(lvd) + " are listed for you. Enter only the rejected." + (sav ? " <b>Saved: correct anything and save again.</b>" : "") + "</div>" + dateSeg("am", AM.d);
    if (!AM.rows.length) h += '<div class="empty">No Livestock Availability for ' + dlabel(lvd) + " yet. Add a line below if needed.</div>";
    else h += '<div class="small-btns"><button class="btn ghost" id="amAll">✓ All passed</button></div>';
    AM.rows.forEach(function (r, i) {
      var ok = (+r.ins || 0) - (+r.rej || 0), fixed = r.av != null;
      h += '<div class="row has"><div class="rhead">' + (fixed ? esc(ownerName(r.o)) + " · " + esc(r.sp) : "Extra line") + (fixed ? "" : '<button class="x" data-del="' + i + '">✕ Remove</button>') + "</div>" +
        (fixed ? "" : '<div class="two"><div class="fld"><label>Owner</label><select data-f="o" data-i="' + i + '">' + opts(OWNERS, r.o) + '</select></div><div class="fld"><label>Species</label><select data-f="sp" data-i="' + i + '">' + opts(X.sp, r.sp, "Choose…") + "</select></div></div>") +
        (fixed ? '<div class="hint">Available: ' + fmt(r.av) + " heads</div>" : "") +
        '<div class="three"><div class="fld"><label>Inspected</label>' + numBox("ami" + i, r.ins) + '</div><div class="fld"><label>Rejected</label>' + numBox("amr" + i, r.rej) + '</div><div class="fld"><label>Passed</label><div class="val' + (ok < 0 ? " bad" : "") + '">' + fmt(ok) + "</div></div></div>" +
        (+r.rej > 0 ? '<div class="fld"><label>Reason for rejection</label><select data-f="why" data-i="' + i + '">' + opts(X.rs, r.why, "Choose the reason…") + "</select></div>" : "") +
        (r.av != null && +r.ins > r.av ? '<div class="warn">More inspected than available (' + fmt(r.av) + ").</div>" : "") + "</div>";
    });
    h += '<button class="btn ghost" id="amAdd">+ Add line</button><button class="btn" id="amSave">' + (sav ? "Save changes" : "Save ante-mortem") + "</button>";
    el.innerHTML = h;
    bindDates(el, function (d) { amLoad(d); amDraw(); });
    bindSteps(el, function (inp, redraw) { var r = AM.rows[+inp.id.slice(3)]; r[inp.id.charAt(2) === "i" ? "ins" : "rej"] = +inp.value || 0; if (redraw) amDraw(); });
    var f = el.querySelectorAll("[data-f]");
    for (var i = 0; i < f.length; i++) f[i].onchange = function () { AM.rows[+this.getAttribute("data-i")][this.getAttribute("data-f")] = this.value; };
    var dl = el.querySelectorAll("[data-del]");
    for (i = 0; i < dl.length; i++) dl[i].onclick = function () { AM.rows.splice(+this.getAttribute("data-del"), 1); amDraw(); };
    if ($("amAll")) $("amAll").onclick = function () { haptic(); AM.rows.forEach(function (r) { r.rej = 0; r.why = ""; }); amDraw(); };
    $("amAdd").onclick = function () { AM.rows.push({ o: "Own", sp: "", ins: 0, rej: 0, why: "" }); amDraw(); };
    $("amSave").onclick = function () {
      var rows = [], err = "";
      AM.rows.forEach(function (r, i) {
        if (!+r.ins && !+r.rej) return;
        if (!r.sp) err = err || "Line " + (i + 1) + ": choose the species.";
        else if (+r.rej > +r.ins) err = err || ownerName(r.o) + " " + r.sp + ": rejected is more than inspected.";
        else if (+r.rej > 0 && !r.why) err = err || ownerName(r.o) + " " + r.sp + ": choose the reason for rejection.";
        rows.push({ o: r.o, sp: r.sp, ins: +r.ins || 0, rej: +r.rej || 0, why: r.why || "" });
      });
      if (err) return alertMsg(err); if (!rows.length) return alertMsg("Nothing to save.");
      send({ k: "am", d: AM.d, rows: rows }, "Save ante-mortem for slaughter on " + dlabel(AM.d) + "?");
    };
  }

  // ---------------------------------------------------------------- 3 PRODUCTION ORDER / RESERVATION
  var OD = { d: X.dd.order, rows: null };
  function passedMap(d) { var m = {}; ((X.pre.ok || {})[d] || []).forEach(function (a) { m[a[0] + "|" + a[1]] = a[2]; }); return m; }
  function odLoad(d) {
    OD.d = d; var s = saved("order", d);
    OD.rows = s ? clone(s).map(function (r) { r.auto = false; return r; }) :
      ((X.pre.ok || {})[d] || []).map(function (a) { return { o: a[0], sp: a[1], ch: a[0] === "Own" ? "Export" : a[0], pcs: a[2], kg: Math.round(a[2] * (X.avg[a[1]] || 0)), auto: true }; });
  }
  function odDraw() {
    var el = $("sec_order"), sav = !!saved("order", OD.d), pm = passedMap(OD.d), src = (X.pre.src || {})[OD.d];
    var h = '<div class="title">📝 Production Order</div><div class="note">Reservation for the <b>slaughter date</b>. ' +
      (sav ? "<b>Saved: correct anything and save again.</b>" : src === "am" ? "Filled from the ante-mortem passed heads: adjust pieces; kg is estimated." : src === "lv" ? "Filled from the available livestock (ante-mortem not entered yet)." : "No ante-mortem yet for this date: add lines.") + "</div>" + dateSeg("order", OD.d);
    var sum = {}; OD.rows.forEach(function (r) { var k = r.o + "|" + r.sp; sum[k] = (sum[k] || 0) + (+r.pcs || 0); });
    OD.rows.forEach(function (r, i) {
      var p = pm[r.o + "|" + r.sp], over = p != null && sum[r.o + "|" + r.sp] > p;
      h += '<div class="row has"><div class="rhead">' + esc(ownerName(r.o)) + (r.sp ? " · " + esc(r.sp) : "") +
        (r.o === "Own" && r.sp ? '<button class="x" data-split="' + i + '" style="margin-left:auto;background:var(--blue-50);color:var(--blue)">+ Other channel</button>' : "") +
        '<button class="x" data-del="' + i + '"' + (r.o === "Own" && r.sp ? ' style="margin-left:6px"' : "") + '>✕</button></div>' +
        (r.fixed === false || !r.sp ? '<div class="two"><div class="fld"><label>Owner</label><select data-f="o" data-i="' + i + '">' + opts(OWNERS, r.o) + '</select></div><div class="fld"><label>Species</label><select data-f="sp" data-i="' + i + '">' + opts(X.sp, r.sp, "Choose…") + "</select></div></div>" : "") +
        (p != null ? '<div class="hint">' + (src === "am" ? "Passed ante-mortem" : "Available") + ": " + fmt(p) + " · ordered " + fmt(sum[r.o + "|" + r.sp]) + "</div>" : "") +
        (r.o === "Own" ? '<div class="fld"><label>Channel</label><select data-f="ch" data-i="' + i + '">' + opts(X.ch, r.ch) + "</select></div>" : "") +
        '<div class="two"><div class="fld"><label>Pieces</label>' + numBox("odp" + i, r.pcs) + '</div><div class="fld"><label>Kg (est.)' + (r.sp ? " · " + fmt(X.avg[r.sp]) + " kg/hd" : "") + '</label><input data-f="kg" data-i="' + i + '" inputmode="decimal" value="' + (r.kg || "") + '" style="font-weight:800;text-align:right;' + (r.auto ? "color:var(--ink2);font-style:italic" : "") + '"></div></div>' +
        (over ? '<div class="warn">Ordered more than ' + (src === "am" ? "passed" : "available") + ".</div>" : "") + "</div>";
    });
    if (!OD.rows.length) h += '<div class="empty">No lines yet.</div>';
    h += '<button class="btn ghost" id="odAdd" style="margin-bottom:8px">+ Add line</button>';
    h += '<button class="btn" id="odSave">' + (sav ? "Save changes" : "Save order") + "</button>";
    el.innerHTML = h;
    bindDates(el, function (d) { odLoad(d); odDraw(); });
    bindSteps(el, function (inp, redraw) { var r = OD.rows[+inp.id.slice(3)]; r.pcs = +inp.value || 0; if (r.auto || !r.kg) { r.kg = Math.round(r.pcs * (X.avg[r.sp] || 0)); r.auto = true; } if (redraw) odDraw(); });
    var f = el.querySelectorAll("[data-f]");
    for (var i = 0; i < f.length; i++) f[i][f[i].tagName === "SELECT" ? "onchange" : "oninput"] = function () {
      var r = OD.rows[+this.getAttribute("data-i")], k = this.getAttribute("data-f");
      if (k === "kg") { this.value = this.value.replace(",", ".").replace(/[^\d.]/g, ""); r.kg = this.value; r.auto = false; return; }
      r[k] = this.value; if (k === "o") { r.ch = r.o === "Own" ? "Export" : r.o; r.fixed = false; } if (k === "sp") { r.fixed = false; r.kg = Math.round((+r.pcs || 0) * (X.avg[r.sp] || 0)); r.auto = true; } odDraw();
    };
    var dl = el.querySelectorAll("[data-del]");
    for (i = 0; i < dl.length; i++) dl[i].onclick = function () { OD.rows.splice(+this.getAttribute("data-del"), 1); odDraw(); };
    $("odAdd").onclick = function () { OD.rows.push({ o: "Own", sp: "", ch: "Export", pcs: 0, kg: 0, auto: true, fixed: false }); odDraw(); };
    var sp2 = el.querySelectorAll("[data-split]");
    for (i = 0; i < sp2.length; i++) sp2[i].onclick = function () {      // same species, another own channel
      var j = +this.getAttribute("data-split"), l = OD.rows[j], used = OD.rows.filter(function (r) { return r.o === l.o && r.sp === l.sp; }).map(function (r) { return r.ch; });
      var ch = X.ch.filter(function (c) { return used.indexOf(c) < 0; })[0] || "Local";
      OD.rows.splice(j + 1, 0, { o: l.o, sp: l.sp, ch: ch, pcs: 0, kg: 0, auto: true }); odDraw();
    };
    $("odSave").onclick = function () {
      var rows = [], err = "";
      OD.rows.forEach(function (r) {
        if (!+r.pcs) return;
        if (!r.sp) err = err || "Choose the species on every line.";
        rows.push({ o: r.o, sp: r.sp, ch: r.o === "Own" ? r.ch : r.o, pcs: +r.pcs, kg: Math.round((+r.kg || 0) * 10) / 10 });
      });
      if (err) return alertMsg(err); if (!rows.length) return alertMsg("Enter pieces on at least one line.");
      send({ k: "order", d: OD.d, rows: rows }, "Save the production order for " + dlabel(OD.d) + "?");
    };
  }

  // ---------------------------------------------------------------- plan at a glance (everyone)
  function planCard() {
    var h = '<div class="card"><div class="h">The plan<span class="sub">as of opening</span></div>';
    (X.rep || []).forEach(function (day) {
      h += '<div style="font-weight:800;margin:6px 0 2px">🔪 Slaughter ' + dlabel(day[0]) + "</div>";
      if (!day[1].length) { h += '<div class="empty">Nothing entered yet.</div>'; return; }
      h += "<table><tr><th>Species</th><th>Avl</th><th>Pass</th><th>Rej</th><th>Ord</th><th>Bal</th></tr>";
      var cur = null;
      day[1].forEach(function (r) {
        if (r[0] !== cur) { cur = r[0]; h += '<tr class="grp"><td colspan="6">' + esc(r[0] === "Own" ? "OWN" : r[0]) + "</td></tr>"; }
        h += "<tr><td>" + esc(r[1]) + "</td><td>" + fmt(r[2]) + "</td><td>" + fmt(r[3]) + "</td><td>" + fmt(r[4] || null) + "</td><td>" + fmt(r[5] || null) + '</td><td class="' + (r[6] < 0 ? "neg" : "") + '">' + fmt(r[6]) + "</td></tr>";
      });
      h += "</table>";
    });
    return h + '<button class="btn ghost" id="refresh" style="margin-top:10px">↻ Load the latest</button></div>';
  }

  // ---------------------------------------------------------------- page
  var h = statusCard();
  if (!X.k.length) h += '<div class="card"><div class="note" style="margin:0">You can see the plan. Entries are made by the team.</div></div>';
  X.k.forEach(function (k) { h += '<div class="card" id="sec_' + k + '"></div>'; });
  h += planCard() + '<div class="foot">' + esc(FOOTER) + "</div>";
  $("main").innerHTML = h;
  if (X.k.indexOf("lv") >= 0) { lvLoad(LV.d); lvDraw(); }
  if (X.k.indexOf("am") >= 0) { amLoad(AM.d); amDraw(); }
  if (X.k.indexOf("order") >= 0) { odLoad(OD.d); odDraw(); }
  $("refresh").onclick = function () { send({ k: "refresh" }); };
  if (inTg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#f4f5f7"); } catch (e) {} }
  window.__v13 = { LV: LV, AM: AM, OD: OD };
})();
</script>
</body>
</html>
