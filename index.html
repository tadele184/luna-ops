<script>
window.addEventListener("error", function (e) {
  var m = document.getElementById("main");
  if (m) m.innerHTML = '<div class="card"><div class="title">Something went wrong</div><div class="note">' + String(e.message || e).replace(/[<>&]/g, "") + " (line " + (e.lineno || "?") + ')</div><button class="btn" onclick="location.reload()">Reload</button></div>';
});
// ============================================================================================================
// SHARED LOGIC (used by the server in Google Apps Script AND by the app on the phone).
// Everything is aligned on the SLAUGHTER DAY S:
//   Available Livestock   entered on S-1 (animals in the lairage the day before slaughter)
//   Ante Mortem           done on S-1, recorded for S (one day ahead of the other entries)
//   Production Order      for S (plan)
//   Production Actual     on S (pieces and carcass kg, against the order)
// Dates are ISO text "yyyy-mm-dd" everywhere, so there are no time-zone surprises.
// ============================================================================================================
var L = (function () {
  var SPECIES = ["HL Sheep", "BH Sheep", "Goat", "Bull", "Calf"];
  var CUSTOMERS = ["YABU", "BILASOT", "BBM", "ART MERI", "GETACHEW", "BLACK PHOENIX", "HABTAMU DEMBEL",
    "AL HALAL", "YASMIN JIBRIL", "HOMESIDE", "FUAD"];
  var CHANNELS = ["Export", "Local", "Fresh Corner", "Kitchen"];
  var REASONS = ["Sick / fever", "Lame / injured", "Emaciated", "Pregnant", "Dead on arrival", "Other"];
  var AVG_KG = { "HL Sheep": 15, "BH Sheep": 13, "Goat": 11, "Bull": 210, "Calf": 70 };        // carcass kg per head
  var RANGE = { "HL Sheep": [7, 28], "BH Sheep": [7, 28], "Goat": [5, 22], "Bull": [90, 420], "Calf": [25, 160] };
  var KINDS = { lv: "Available Livestock", am: "Ante Mortem", order: "Production Order", prod: "Production Actual", stock: "Dispatch & Stock" };
  // Dispatch & Stock lines, in the order of the carcass entry sheet. Service customers come between local sale and export.
  var LOCAL = [["modjo", "Modjo Sales"], ["fk", "Fresh Kitchen"], ["fc", "Fresh Corner"]];
  var EXPORT = [["exp", "Own export"]];
  var QUALITY = [["detp", "Detained during production"], ["detl", "Detained during loading"], ["dmg", "Damage / condemnation"]];
  var OWN = "Own";
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var MONL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  // ---------------------------------------------------------------- dates
  function isISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(Date.parse(s + "T00:00:00Z")) && new Date(s + "T00:00:00Z").toISOString().slice(0, 10) === s; }
  function addDays(iso, k) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + k); return d.toISOString().slice(0, 10); }
  function diff(a, b) { return Math.round((Date.parse(a + "T00:00:00Z") - Date.parse(b + "T00:00:00Z")) / 864e5); }   // a - b in days
  function dObj(iso) { return new Date(iso + "T00:00:00Z"); }
  function dShort(iso) { var d = dObj(iso); return DOW[d.getUTCDay()] + " " + ("0" + d.getUTCDate()).slice(-2) + " " + MON[d.getUTCMonth()]; }
  function dLong(iso) { var d = dObj(iso); return DOWL[d.getUTCDay()] + " " + ("0" + d.getUTCDate()).slice(-2) + " " + MONL[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function dDM(iso) { var d = dObj(iso); return ("0" + d.getUTCDate()).slice(-2) + " " + MON[d.getUTCMonth()]; }
  function range(d1, d2) { var out = [], d = d1; while (d <= d2) { out.push(d); d = addDays(d, 1); } return out; }

  // Which dates each form may be saved for, relative to today. The admin may also correct the past week.
  function win(kind, admin) {
    var w = { lv: [-1, 0], am: [-1, 1], order: [-1, 2], prod: [-2, 0], stock: [-2, 0] }[kind];
    return admin ? [Math.min(w[0], -7), w[1]] : [w[0], w[1]];
  }
  function defaultDate(kind, t) { return addDays(t, { lv: 0, am: 1, order: 1, prod: 0, stock: 0 }[kind]); }

  // ---------------------------------------------------------------- numbers and text
  function n(x) { return x ? Math.round(x).toLocaleString("en-US") : "-"; }
  function n1(x) { return x ? (Math.round(x * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : "-"; }
  function pct(x) { return Math.round(x * 100) + "%"; }
  function int_(v, lo, hi) {
    if (v === null || v === undefined || v === "" || typeof v === "boolean") return null;
    var f = Number(v);
    if (!isFinite(f) || f !== Math.floor(f) || f < lo || f > hi) return null;
    return f;
  }
  function num_(v, lo, hi) {
    if (v === null || v === undefined || v === "" || typeof v === "boolean") return null;
    var f = Number(v);
    if (!isFinite(f) || f < lo || f > hi) return null;
    return Math.round(f * 10) / 10;
  }
  function txt(v, max) { return String(v == null ? "" : v).replace(/\s+/g, " ").trim().slice(0, max || 80); }
  function owner(o) {
    if (o === "own" || o === OWN) return OWN;
    o = txt(o).toUpperCase();
    return CUSTOMERS.indexOf(o) >= 0 ? o : null;
  }
  function ownerLabel(o) { return o === OWN ? "Own" : o; }

  function sum(rows, field) {          // {"owner|species": total} in first-seen order
    var t = {};
    (rows || []).forEach(function (r) { var k = r.o + "|" + r.sp; t[k] = (t[k] || 0) + (Number(r[field]) || 0); });
    return t;
  }

  // ---------------------------------------------------------------- validation (the server always re-checks)
  // getDoc(kind, iso) returns the saved rows or null. Returns {d, rows, warn, err}.
  // allow(kind, date) decides whether a date may be saved (normal window, cut-off, reopened dates). Default: the window.
  function inWin(kind, d, t, admin) { var w = win(kind, admin), k = diff(d, t); return k >= w[0] && k <= w[1]; }
  function clean(kind, data, t, admin, getDoc, allow) {
    var bad = function (m) { return { err: m, warn: [] }; };
    if (!KINDS[kind]) return bad("Unknown form.");
    if (kind === "stock") return cleanStock(data, t, admin, allow);
    var d = data && data.d;
    if (!isISO(d)) return bad("Choose the date.");
    if (!(allow ? allow(kind, d) : inWin(kind, d, t, admin))) return bad("This date is closed. Ask the admin to reopen it.");
    var rows = data.rows;
    if (!Array.isArray(rows) || rows.length > 120) return bad("The data is not valid.");
    var out = [], warn = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], no = i + 1;
      if (!r || typeof r !== "object") return bad("Line " + no + " is not valid.");
      var o = owner(r.o), sp = r.sp;
      if (!o) return bad("Line " + no + ": choose the owner.");
      if (SPECIES.indexOf(sp) < 0) return bad("Line " + no + ": choose the species.");
      if (kind === "lv") {
        var q = int_(r.q, 1, 5000);
        if (q === null) return bad("Line " + no + " (" + sp + "): enter the number of heads.");
        var sup = txt(r.sup), plate = txt(r.plate, 20).toUpperCase(), org = txt(r.org);
        if (!sup) return bad("Line " + no + " (" + sp + "): enter the supplier name.");
        if (!plate) return bad("Line " + no + " (" + sp + "): enter the plate number.");
        if (!org) return bad("Line " + no + " (" + sp + "): enter the origin (location).");
        out.push({ o: o, sp: sp, q: q, sup: sup, plate: plate, org: org });
      } else if (kind === "am") {
        var ins = int_(r.ins, 0, 5000), rej = int_(r.rej === "" || r.rej == null ? 0 : r.rej, 0, 5000);
        if (ins === null || rej === null) return bad("Line " + no + " (" + sp + "): heads must be whole numbers.");
        if (rej > ins) return bad("Line " + no + " (" + sp + "): rejected cannot be more than inspected.");
        var why = txt(r.why, 120);
        if (rej && !why) return bad("Line " + no + " (" + sp + "): give the reason for the " + rej + " rejected.");
        if (ins) out.push({ o: o, sp: sp, ins: ins, rej: rej, ok: ins - rej, why: rej ? why : "" });
      } else {
        var ch = o === OWN ? txt(r.ch) : o;
        if (o === OWN && CHANNELS.indexOf(ch) < 0) return bad("Line " + no + " (" + sp + "): choose the channel (Export, Local, Fresh Corner, Kitchen).");
        var pcs = int_(r.pcs === "" || r.pcs == null ? 0 : r.pcs, 0, 5000), kg = num_(r.kg === "" || r.kg == null ? 0 : r.kg, 0, 1e7);
        if (pcs === null || kg === null) return bad("Line " + no + " (" + sp + "): pieces and kg must be numbers.");
        if (kind === "prod" && pcs && !kg) return bad("Line " + no + " (" + sp + "): enter the actual carcass kg.");
        if (kind === "prod" && kg && !pcs) return bad("Line " + no + " (" + sp + "): enter the pieces.");
        if (pcs && kg && (kg / pcs < 3 || kg / pcs > 450)) return bad("Line " + no + " (" + sp + "): " + (kg / pcs).toFixed(1) + " kg per head is not possible. Check pieces and kg.");
        if (pcs) {
          if (kind === "prod") {
            var rg = RANGE[sp];
            if (kg / pcs < rg[0] || kg / pcs > rg[1]) warn.push(ownerLabel(o) + " " + sp + ": " + (kg / pcs).toFixed(1) + " kg per carcass is outside the usual " + rg[0] + "-" + rg[1] + " kg.");
          }
          out.push({ o: o, ch: ch, sp: sp, pcs: pcs, kg: kg });
        }
      }
    }
    if (!out.length) return bad("Nothing entered yet.");
    if (kind === "am") {
      var av = available(d, getDoc);
      out.forEach(function (r) {
        var a = av[r.o + "|" + r.sp];
        if (a !== undefined && r.ins > a) warn.push(ownerLabel(r.o) + " " + r.sp + ": " + r.ins + " inspected but " + a + " available.");
      });
    }
    if (kind === "order" || kind === "prod") {
      var passed = amPassed(d, getDoc), tot = sum(out, "pcs");
      Object.keys(tot).forEach(function (key) {
        var p = passed[key], parts = key.split("|");
        if (p !== undefined && tot[key] > p) warn.push(ownerLabel(parts[0]) + " " + parts[1] + ": " + tot[key] + (kind === "order" ? " ordered" : " produced") + " but only " + p + " passed ante-mortem.");
      });
    }
    return { d: d, rows: out, warn: warn, err: null };
  }

  // ---------------------------------------------------------------- the plan for a slaughter day
  function available(S, getDoc) { var r = getDoc("lv", addDays(S, -1)); return r ? sum(r, "q") : {}; }
  function amPassed(S, getDoc) { var r = getDoc("am", S); return r ? sum(r, "ok") : {}; }

  function plan(S, getDoc) {
    var lvDay = addDays(S, -1);
    var lv = getDoc("lv", lvDay), am = getDoc("am", S), od = getDoc("order", S), pr = getDoc("prod", S);
    var lines = {}, keys = [];
    function line(o, sp) {
      var k = o + "|" + sp;
      if (!lines[k]) { lines[k] = { o: o, sp: sp, av: null, ins: null, rej: 0, ok: null, why: [], pcs: 0, kg: 0, ch: {}, apcs: null, akg: null }; keys.push(k); }
      return lines[k];
    }

    // ---------- Dashboard

  // ================================================================ 3 PRODUCTION ORDER and 4 PRODUCTION ACTUAL (same line layout)
  var OD = { kind: "order", d: null, rows: [], add: null }, PR = { kind: "prod", d: null, rows: [], add: null };
  function okDate(kind, d) { var ds = datesOf(kind); return d && ds.indexOf(d) >= 0 ? d : (ds.indexOf(X.dd[kind]) >= 0 ? X.dd[kind] : ds[ds.length - 1] || X.dd[kind]); }
  function passedMap(d, key) { var m = {}; ((X.pre[key] || {})[d] || []).forEach(function (a) { m[a[0] + "|" + a[1]] = a[2]; }); return m; }
  function odOpen() { odLoad(OD, okDate("order", OD.d)); lineDraw(OD); }
  function prOpen() { odLoad(PR, okDate("prod", PR.d)); lineDraw(PR); }
  function odLoad(S, d) {
    S.d = d; S.add = null; var s = saved(S.kind, d);

    else if (S.kind === "order") S.rows = ((X.pre.ok || {})[d] || []).map(function (a) { return { o: a[0], sp: a[1], ch: a[0] === "Own" ? "Export" : a[0], pcs: a[2], kg: Math.round(a[2] * (X.avg[a[1]] || 0)), auto: true }; });
    else S.rows = ((X.pre.od || {})[d] || []).map(function (r) { return { o: r.o, sp: r.sp, ch: r.ch, pcs: "", kg: "", plan: [r.pcs, r.kg] }; });
    if (S.kind === "prod") {                 // show the plan next to each saved line too
      var plan = {}; ((X.pre.od || {})[d] || []).forEach(function (r) { plan[r.o + "|" + r.ch + "|" + r.sp] = [r.pcs, r.kg]; });

  }
  function lineDraw(S) {

    var note = isOrder ? "Reservation for the <b>slaughter date</b>. " + (sav ? savedBy("order", S.d) + " <b>Correct and save again.</b>" : src === "am" ? "Filled from the heads that passed ante-mortem: adjust the pieces; kg is estimated." : src === "lv" ? "Filled from the available livestock (no ante-mortem yet)." : "No ante-mortem for this date yet: add lines.")
      : "Actual pieces and <b>weighed carcass kg</b> for the slaughter date. " + (sav ? savedBy("prod", S.d) + " <b>Correct and save again.</b>" : (X.pre.od || {})[S.d] && X.pre.od[S.d].length ? "Lines come from the production order; the plan is shown on each line." : "No production order for this date: add lines.");
    var h = '<div class="note">' + note + "</div>" + dateSeg(S.kind, S.d), sum = {}, tP = 0, tK = 0;

    S.rows.forEach(function (r, i) {
      var p = pm[r.o + "|" + r.sp], over = p != null && sum[r.o + "|" + r.sp] > p, avg = (+r.pcs && +r.kg) ? r.kg / r.pcs : null, rg = X.range[r.sp] || [0, 1e9];
      h += '<div class="row has"><div class="rhead">' + esc(ownerName(r.o)) + " · " + esc(r.sp) +

        '<button class="x" data-del="' + i + '"' + (r.o === "Own" ? ' style="margin-left:6px"' : "") + ">✕</button></div>" +
        (r.o === "Own" ? chips("Channel", X.ch, r.ch, "ch" + i, "sm") : "") +
        (!isOrder && r.plan ? '<div class="hint">Order: ' + fmt(r.plan[0]) + " pcs · " + fmt(r.plan[1]) + ' kg <button class="chip sm sug" data-same="' + i + '" style="margin:0 0 0 6px">Same pieces</button></div>' : "") +
        (isOrder && p != null ? '<div class="hint">' + (src === "am" ? "Passed ante-mortem" : "Available") + ": " + fmt(p) + " · ordered " + fmt(sum[r.o + "|" + r.sp]) + "</div>" : "") +
        '<div class="two"><div class="fld"><label>Pieces</label>' + numBox("lp" + i, r.pcs) + '</div><div class="fld kgbox"><label>' + (isOrder ? "Kg (estimated · " + fmt(X.avg[r.sp]) + " kg/hd)" : "Carcass kg (weighed)") + '</label><input data-kg="' + i + '" inputmode="decimal" class="' + (isOrder && r.auto ? "auto" : "") + '" value="' + (r.kg || "") + '" placeholder="0"></div></div>' +
        (!isOrder && avg ? '<div class="' + (avg < rg[0] || avg > rg[1] ? "warn" : "hint") + '">' + fmt(avg, 1) + " kg per carcass" + (avg < rg[0] || avg > rg[1] ? " · outside the usual " + rg[0] + "-" + rg[1] + " kg" : "") + (r.plan && r.plan[0] ? " · " + Math.round(r.pcs / r.plan[0] * 100) + "% of order" : "") + "</div>" : "") +
        (over ? '<div class="warn">' + (isOrder ? "Ordered" : "Produced") + " more than " + (isOrder && src !== "am" ? "available" : "passed ante-mortem") + ".</div>" : "") + "</div>";
    });
    if (!S.rows.length) h += '<div class="empty">No lines yet.</div>';
    else h += '<div class="hint">Total: ' + fmt(tP) + " pcs · " + fmt(tK, 1) + " kg</div>";
    if (S.add) h += '<div class="card" style="background:var(--bg);box-shadow:none;margin:12px 0"><div class="h">Add a line</div>' +
      ownerChips(S.add.o, "ao") + chips("Species", X.sp, S.add.sp, "asp") +
      (S.add.o === "Own" ? chips("Channel", X.ch, S.add.ch, "ach", "sm") : "") + '<button class="btn ghost" id="addOk">Add the line</button></div>';

    var el = screen(S.kind, h);

    bindSteps(el, function (inp, redraw) {
      var r = S.rows[+inp.id.slice(2)]; r.pcs = +inp.value || 0;
      if (isOrder && (r.auto || !r.kg)) { r.kg = Math.round(r.pcs * (X.avg[r.sp] || 0)); r.auto = true; }

    all(el, "[data-kg]").forEach(function (inp) {
      inp.oninput = function () { this.value = this.value.replace(",", ".").replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1").slice(0, 9); var r = S.rows[+this.getAttribute("data-kg")]; r.kg = this.value; r.auto = false; };
      inp.onchange = function () { lineDraw(S); };
    });
    S.rows.forEach(function (r, i) { onChip(el, "ch" + i, function (v) { r.ch = v; lineDraw(S); }); });
    onChip(el, "same", function (v) { var r = S.rows[+v]; r.pcs = r.plan[0]; lineDraw(S); });
    onChip(el, "del", function (v) { S.rows.splice(+v, 1); lineDraw(S); });
    onChip(el, "split", function (v) {
      var j = +v, l = S.rows[j], used = S.rows.filter(function (r) { return r.o === l.o && r.sp === l.sp; }).map(function (r) { return r.ch; });
      var ch = X.ch.filter(function (c) { return used.indexOf(c) < 0; })[0];

    });
    if ($("addLine")) $("addLine").onclick = function () { S.add = { o: "Own", sp: "", ch: "Export" }; lineDraw(S); window.scrollTo(0, 9999); };
    onChip(el, "ao", function (v) { S.add.o = v; S.add.ch = v === "Own" ? "Export" : v; lineDraw(S); });
    onChip(el, "asp", function (v) { S.add.sp = v; lineDraw(S); });
    onChip(el, "ach", function (v) { S.add.ch = v; lineDraw(S); });
    if ($("addOk")) $("addOk").onclick = function () {
      if (!S.add.sp) return alertMsg("Tap the species.");
      var ch = S.add.o === "Own" ? S.add.ch : S.add.o;
      if (S.rows.some(function (r) { return r.o === S.add.o && r.sp === S.add.sp && (r.ch || r.o) === ch; })) return alertMsg("That line is already in the list.");
      S.rows.push({ o: S.add.o, sp: S.add.sp, ch: ch, pcs: 0, kg: 0, auto: true }); S.add = null; lineDraw(S);
    };
    $("save").onclick = function () {
      var rows = [], err = "";
      S.rows.forEach(function (r) {

      });

  // ================================================================ 5 DISPATCH & STOCK (the carcass entry sheet)
  var ST = { d: null, rows: [], add: -1 };
  function stKeys() { return L.LOCAL.map(function (x) { return x[0]; }).concat(X.c, ["exp", "detp", "detl", "dmg", "shr"]); }
  function stLabel(k) { return X.c.indexOf(k) >= 0 ? k : L.outLabel(k); }
  function stPre(d) { return ((X.pre.stk || {})[d]) || { bbf: {}, inn: {}, use: {} }; }
  function stOpen() { stLoad(okDate("stock", ST.d)); stDraw(); }
  function stLoad(d) {
    ST.d = d; ST.add = -1;
    var pre = stPre(d), s = saved("stock", d), rows = [], have = {};
    if (s) rows = clone(s).map(function (r) { r.auto = {}; return r; });
    rows.forEach(function (r) { have[r.sp] = 1; });
    X.sp.forEach(function (sp) {
      if (have[sp]) return;
      var b = pre.bbf[sp], inn = pre.inn[sp];
      if (!((b && (b[0] || b[1])) || (inn && (inn[0] || inn[1])))) return;
      var row = { sp: sp, open: null, out: {}, auto: {} };
      if (!s) Object.keys(pre.use[sp] || {}).forEach(function (k) {   // service customers take their own carcasses: filled in
        if (X.c.indexOf(k) >= 0) { row.out[k] = clone(pre.use[sp][k]); row.auto[k] = 1; }
      });
      rows.push(row);
    });
    rows.sort(function (a, b) { return X.sp.indexOf(a.sp) - X.sp.indexOf(b.sp); });
    ST.rows = rows;
  }
  function stDraw() {
    var sav = !!saved("stock", ST.d), pre = stPre(ST.d), keys = stKeys();
    var h = '<div class="note">Carcasses in the chiller for this date. <b>BBF</b> is yesterday\'s balance and <b>In</b> comes from Production Actual. Enter what left the stock.' + (sav ? savedBy("stock", ST.d) + " <b>Correct and save again.</b>" : "") + "</div>" + dateSeg("stock", ST.d);
    if (!ST.rows.length) h += '<div class="empty">No carcasses in stock and no production for ' + esc(dlabel(ST.d)) + ".</div>";
    ST.rows.forEach(function (r, i) {
      var bbf = pre.bbf[r.sp] || [0, 0], inn = pre.inn[r.sp] || [0, 0], x = L.stockLine(r.sp, bbf, inn, r), use = pre.use[r.sp] || {};
      h += '<div class="row has"><div class="rhead">' + esc(r.sp) + '<button class="x" data-sdel="' + i + '">✕</button></div>' +
        '<div class="tiles"><div><span>BBF' + (r.open ? " (set)" : "") + "</span><b>" + fmt(x.bbf[0]) + "</b><em>" + fmt(x.bbf[1], 1) + ' kg</em></div><div><span>In</span><b>' + fmt(x.inn[0]) + "</b><em>" + fmt(x.inn[1], 1) + ' kg</em></div><div><span>Total</span><b>' + fmt(x.tot[0]) + "</b><em>" + fmt(x.tot[1], 1) + " kg</em></div></div>";
      if (X.su) h += r.open ? '<div class="two"><div class="fld"><label>Opening pcs</label><input class="kgbox-in" data-open="' + i + '|0" inputmode="numeric" value="' + esc(r.open[0]) + '"></div><div class="fld"><label>Opening kg</label><input class="kgbox-in" data-open="' + i + '|1" inputmode="decimal" value="' + esc(r.open[1]) + '"></div></div><button class="chip sm" data-noopen="' + i + '">Use the carried balance</button>'
        : '<button class="chip sm" data-setopen="' + i + '">Set the opening stock (admin)</button>';
      keys.forEach(function (k, ki) {
        if (!r.out[k]) return;
        var v = r.out[k], id = "s" + i + "_" + ki;
        h += '<div class="oline"><div class="ol-lab">' + esc(stLabel(k)) + (r.auto[k] ? ' <small class="hintx">as produced</small>' : "") + '<button class="xs" data-orm="' + i + "|" + k + '">✕</button></div><div class="two">' +
          (k === "shr" ? '<div class="fld"><label>Pieces</label><div class="val" style="background:var(--bg);color:var(--ink3)">-</div></div>' : '<div class="fld"><label>Pieces</label>' + numBox(id, v[0]) + "</div>") +
          '<div class="fld kgbox"><label>Kg</label><input data-skg="' + i + "|" + k + '" inputmode="decimal" class="' + (r.auto[k] ? "auto" : "") + '" value="' + (v[1] ? v[1] : "") + '" placeholder="0"></div></div></div>';
      });
      var sug = Object.keys(use).filter(function (k) { return !r.out[k]; });
      if (sug.length) h += '<div class="chips"><span class="lab">Produced today (tap to dispatch)</span>' + sug.map(function (k) { return '<button class="chip sm sug" data-use="' + i + "|" + k + '">+ ' + esc(stLabel(k)) + " " + fmt(use[k][0]) + " pcs</button>"; }).join("") + "</div>";
      if (ST.add === i) {
        var free = function (list) { return list.filter(function (k) { return !r.out[k]; }).map(function (k) { return { v: k, l: stLabel(k) }; }); };
        h += '<div class="card" style="background:var(--bg);box-shadow:none;margin:8px 0"><div class="h">Add a line<button class="xs" data-addx="1" style="margin-left:auto">Close</button></div>' +
          chips("Local sale", free(L.LOCAL.map(function (x) { return x[0]; })), "", "oadd", "sm") + chips("Service customers", free(X.c), "", "oadd", "sm") +
          chips("Export", free(["exp"]), "", "oadd", "sm") + chips("Quality and losses", free(["detp", "detl", "dmg", "shr"]), "", "oadd", "sm") + "</div>";
      } else h += '<button class="btn ghost" data-addline="' + i + '" style="margin:6px 0 8px">+ Add a dispatch or loss line</button>';
      var neg = x.bal[0] < 0 || x.bal[1] < 0;
      h += '<div class="balbox' + (neg ? " bad" : "") + '"><span>Stock balance</span><b>' + fmt(x.bal[0]) + " pcs</b><b>" + fmt(x.bal[1], 1) + " kg</b></div>" +
        '<div class="mini">Local ' + fmt(x.local[0]) + " · Customers " + fmt(x.service[0]) + " · Export " + fmt(x.exp[0]) + " · Damage " + fmt(x.dmg[0]) + (x.det[0] ? " · Detained " + fmt(x.det[0]) + " (kept)" : "") + (x.shr ? " · Shrinkage " + fmt(x.shr, 1) + " kg" : "") + "</div></div>";
    });
    var miss = X.sp.filter(function (sp) { return !ST.rows.some(function (r) { return r.sp === sp; }); });
    if (miss.length) h += chips("Add a species", miss, "", "ssp", "sm");
    h += '<button class="btn" id="stSave">' + (sav ? "Save changes" : "Save Dispatch & Stock") + "</button>";
    var el = screen("stock", h);
    onChip(el, "date", function (d) { stLoad(d); stDraw(); });
    onChip(el, "sdel", function (v) { ST.rows.splice(+v, 1); ST.add = -1; stDraw(); });
    onChip(el, "setopen", function (v) { var r = ST.rows[+v], b = pre.bbf[r.sp] || [0, 0]; r.open = [b[0], b[1]]; stDraw(); });
    onChip(el, "noopen", function (v) { ST.rows[+v].open = null; stDraw(); });
    all(el, "[data-open]").forEach(function (inp) {
      inp.oninput = function () { var p = this.getAttribute("data-open").split("|"); ST.rows[+p[0]].open[+p[1]] = this.value.replace(",", ".").replace(/[^\d.]/g, ""); };
      inp.onchange = function () { stDraw(); };
    });
    onChip(el, "orm", function (v) { var p = v.split("|"); delete ST.rows[+p[0]].out[p[1]]; stDraw(); });
    onChip(el, "use", function (v) { var p = v.split("|"), r = ST.rows[+p[0]]; r.out[p[1]] = clone(pre.use[r.sp][p[1]]); r.auto[p[1]] = 1; stDraw(); });
    onChip(el, "addline", function (v) { ST.add = +v; stDraw(); });
    onChip(el, "addx", function () { ST.add = -1; stDraw(); });
    onChip(el, "oadd", function (k) { var r = ST.rows[ST.add]; r.out[k] = [0, 0]; ST.add = -1; stDraw(); });
    onChip(el, "ssp", function (sp) { ST.rows.push({ sp: sp, open: null, out: {}, auto: {} }); ST.rows.sort(function (a, b) { return X.sp.indexOf(a.sp) - X.sp.indexOf(b.sp); }); stDraw(); });
    bindSteps(el, function (inp, redraw) {
      var m = inp.id.match(/^s(\d+)_(\d+)$/), r = ST.rows[+m[1]], k = keys[+m[2]];
      r.out[k][0] = +inp.value || 0; delete r.auto[k];
      if (redraw) stDraw();
    });
    all(el, "[data-skg]").forEach(function (inp) {
      inp.oninput = function () { this.value = this.value.replace(",", ".").replace(/[^\d.\-]/g, "").slice(0, 9); var p = this.getAttribute("data-skg").split("|"), r = ST.rows[+p[0]]; r.out[p[1]][1] = this.value; delete r.auto[p[1]]; };
      inp.onchange = function () { stDraw(); };
    });
    $("stSave").onclick = function () {
      var rows = [], err = "";
      ST.rows.forEach(function (r) {
        var out = {};
        Object.keys(r.out).forEach(function (k) {
          var p = +r.out[k][0] || 0, kg = Math.round((+r.out[k][1] || 0) * 10) / 10;
          if (!p && !kg) return;
          if (k !== "shr" && p && !kg) err = err || r.sp + ", " + stLabel(k) + ": enter the kg.";
          if (k !== "shr" && kg && !p) err = err || r.sp + ", " + stLabel(k) + ": enter the pieces.";
          out[k] = [k === "shr" ? 0 : p, kg];
        });
        var x = L.stockLine(r.sp, pre.bbf[r.sp] || [0, 0], pre.inn[r.sp] || [0, 0], { out: out, open: r.open ? [+r.open[0] || 0, +r.open[1] || 0] : null });
        if (x.bal[0] < 0) err = err || r.sp + ": " + (-x.bal[0]) + " pieces more dispatched than in stock (" + x.tot[0] + ").";
        rows.push({ sp: r.sp, open: r.open ? [+r.open[0] || 0, +r.open[1] || 0] : null, out: out });
      });
      if (err) return alertMsg(err);
      if (!rows.length) return alertMsg("Nothing to save.");

    };
  }

  // voice: tap to start, then Send or Cancel; up to 3 minutes
  function record(topic) {
    if (!navigator.mediaDevices || !window.MediaRecorder) return alertMsg("Voice notes need the LUNA app or Chrome on this phone.");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var types = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"], type = types.filter(function (t) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t); })[0];
      var rec = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 32000 } : undefined), chunks = [], t0 = Date.now(), cancel = false;
      rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
      var wrap = document.createElement("div"); wrap.className = "shade";
      wrap.innerHTML = '<div class="sheet rec"><div class="rec-dot"></div><div class="rec-t" id="recT">0:00</div><div class="rec-to">Voice note to <b>' + esc(toName(TM.to)) + '</b></div><div class="eq">' + new Array(24).join("<i></i>") + '</div><button class="btn" id="recSend">■ Stop and send</button><button class="btn ghost" id="recX">Cancel</button></div>';
      document.body.appendChild(wrap);
      var timer = setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); if ($("recT")) $("recT").textContent = Math.floor(s / 60) + ":" + ("0" + s % 60).slice(-2); if (s >= 180) rec.stop(); }, 250);
      rec.onstop = function () {
        clearInterval(timer); stream.getTracks().forEach(function (t) { t.stop(); }); if (wrap.parentNode) document.body.removeChild(wrap);
        if (cancel || !chunks.length) return;
        var blob = new Blob(chunks, { type: (rec.mimeType || type || "audio/webm").split(";")[0] });
        sendMsg({ kind: "voice", blob: blob, sec: Math.round((Date.now() - t0) / 1000), topic: topic || "" });
      };
      $("recSend").onclick = function () { haptic(); rec.stop(); };
      $("recX").onclick = function () { cancel = true; rec.stop(); };
      rec.start(500); haptic();
    }).catch(function () { alertMsg("Allow the microphone for LUNA, then try again."); });
  }
  // photo or video from the camera or the gallery; photos are made smaller before sending
  function pickedMedia(file, kind, topic) {
    var go = function (blob) {
      var url = URL.createObjectURL(blob);
      sheet('<div class="msg"><b>' + (kind === "photo" ? "📷 Photo" : "🎥 Video") + " to " + esc(toName(TM.to)) + "</b></div>" + (kind === "photo" ? '<img class="pv" src="' + url + '">' : '<video class="pv" src="' + url + '" controls playsinline></video>') +
        '<div class="fld"><label>What is it about?</label><input id="mCap" maxlength="300" placeholder="e.g. Lame goat, pen 3, supplier Kedir"></div>', [{ t: "➤ Send", v: "send" }, { t: "Cancel", v: "", ghost: true }]).then(function (v) {
        URL.revokeObjectURL(url);
        if (v === "send") sendMsg({ kind: kind, blob: blob, text: CAP, topic: topic || "" });
      });
      var cap = $("mCap"); CAP = ""; if (cap) cap.oninput = function () { CAP = this.value; };
    };
    if (kind === "video") { if (file.size > 24e6) return alertMsg("The video is too long. Record up to about 30 seconds."); return go(file); }
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(function (b) { go(b || file); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { go(file); };
    img.src = u;
  }
  var CAP = "";
  function waveBars(id) { var s = "", x = 0; for (var i = 0; i < 28; i++) { x = (x * 31 + id.charCodeAt(i % id.length) + i * 7) % 97; s += '<i style="height:' + (6 + x % 18) + 'px"></i>'; } return s; }
  function ago(at) { return String(at).slice(5).replace(/^(\d\d)-(\d\d)/, "$2/$1"); }
  function feed() {
    var list = TM.list || [], h = "";
    if (!list.length) h = '<div class="card"><div class="empty">No messages yet. Tap the microphone to send the first voice note.</div></div>';
    list.forEach(function (m) {
      var mine = m.from === X.u, kindIc = { voice: "🎙️", photo: "📷", video: "🎥", text: "💬" }[m.kind];
      h += '<div class="mcard' + (m.iHeard ? "" : " new") + (mine ? " mine" : "") + '"><div class="mh"><div class="av sm">' + avatar(m.from, m.fromNm) + '</div><div class="mh-t"><b>' + esc(m.fromNm) + '</b> <span>→ ' + esc(m.toNm) + "</span><small>" + kindIc + " " + esc(ago(m.at)) + (m.topic ? " · " + esc(m.topic) : "") + "</small></div>" + (!m.iHeard ? '<em class="newtag">New</em>' : "") + "</div>";
      if (m.kind === "voice") h += '<div class="voice"><button class="vplay" data-play="' + m.id + '">' + (TM.playing === m.id ? "❚❚" : "▶") + '</button><div class="vwave">' + waveBars(m.id) + '</div><span>' + Math.floor((m.sec || 0) / 60) + ":" + ("0" + (m.sec || 0) % 60).slice(-2) + "</span></div>";
      if (m.kind === "photo" || m.kind === "video") h += TM.media[m.id] ? (m.kind === "photo" ? '<img class="mimg" src="' + TM.media[m.id] + '" data-zoom="' + m.id + '">' : '<video class="mimg" src="' + TM.media[m.id] + '" controls playsinline></video>')
        : '<button class="mload" data-load="' + m.id + '">' + (m.kind === "photo" ? "📷 Tap to view the photo" : "🎥 Tap to play the video") + "</button>";
      if (m.text) h += '<div class="mtext">' + esc(m.text) + "</div>";
      h += '<div class="macts">' + (!mine ? '<button class="' + (m.iHeard ? "ok" : "") + '" data-heard="' + m.id + '">' + (m.iHeard ? "✓ Heard" : "👂 Mark heard") + '</button><button class="' + (m.iDone ? "ok" : "") + '" data-done="' + m.id + '">' + (m.iDone ? "✓ Done" : "Action done") + "</button>" : "") +
        '<button data-reply="' + m.from + '">↩ Reply</button>' + (mine || X.su ? '<button class="del" data-del="' + m.id + '">🗑</button>' : "") + "</div>" +
        (m.heard.length || m.done.length ? '<div class="mseen">' + (m.heard.length ? "Heard: " + esc(m.heard.join(", ")) : "") + (m.done.length ? " · Done: " + esc(m.done.join(", ")) : "") + "</div>" : "") + "</div>";
    });
    $("tfeed").innerHTML = '<div class="sect">Messages</div>' + h;
    var root = $("tfeed");
    onChip(root, "play", function (id) { play(id); });
    onChip(root, "load", function (id) { loadMedia(id).then(function () { feed(); }); });
    onChip(root, "heard", function (id) { mark(id, "heard"); });
    onChip(root, "done", function (id) { mark(id, "done"); });
    onChip(root, "reply", function (u) { if (u === X.u) return; TM.to = u; $("composer").outerHTML = composer(); bindComposer(); window.scrollTo(0, 0); $("cText").focus(); });
    onChip(root, "del", function (id) { confirmMsg("Delete this message for everyone?", "Delete").then(function (ok) { if (!ok) return; busy(true); api("msgDelete", { id: id }).then(function (j) { busy(false); if (!j.ok) return alertMsg(j.error); TM.list = j.list; feed(); }); }); });
    onChip(root, "zoom", function (id) { sheet('<img class="pv full" src="' + TM.media[id] + '">', [{ t: "Close", v: "" }]); });
  }
  function loadMedia(id) {
    if (TM.media[id]) return Promise.resolve(TM.media[id]);
    busy(true, "Loading…");
    return api("msgMedia", { id: id }).then(function (j) {
      busy(false);
      if (!j.ok) { alertMsg(j.error); throw new Error(j.error); }
      var bin = atob(j.b64), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      TM.media[id] = URL.createObjectURL(new Blob([u8], { type: j.mime })); return TM.media[id];
    }, function (e) { busy(false); alertMsg(errText(e)); throw e; });
  }
  var AUD = null;
  function play(id) {
    if (TM.playing === id && AUD) { AUD.pause(); TM.playing = null; feed(); return; }
    loadMedia(id).then(function (url) {
      if (AUD) AUD.pause();
      AUD = new Audio(url); TM.playing = id; feed();
      AUD.onended = function () { TM.playing = null; feed(); };
      AUD.play().catch(function () { TM.playing = null; feed(); });
      var m = (TM.list || []).filter(function (x) { return x.id === id; })[0];
      if (m && !m.iHeard) mark(id, "heard", true);
    }).catch(function () {});
  }
  function mark(id, what, quiet) {
    api("msgMark", { id: id, what: what }).then(function (j) { if (!j.ok) return quiet || alertMsg(j.error); TM.list = j.list; X.unread = j.unread; if (TAB === "team" && !onForm) { feed(); tabbar(); } }).catch(function (e) { if (!quiet) alertMsg(errText(e)); });
  }
  // a photo or video from inside a form (Ante Mortem, Livestock): goes to everyone with the form as the subject
  function formMedia(topic) {
    var w = document.createElement("div");
    w.innerHTML = '<input type="file" accept="image/*,video/*">';
    var inp = w.firstChild;
    inp.onchange = function () { var f = inp.files[0]; if (!f) return; TM.to = "all"; pickedMedia(f, /^video/.test(f.type) ? "video" : "photo", topic); };
    inp.click();
  }


  // ================================================================ ADMIN: cut-off, reopen for the team, erase, activity
  var ADM = null, AE = { kinds: [], d1: "", d2: "" }, AR = { k: "all", d: "", days: "1" };
  function adminTab() {
    $("main").innerHTML = '<div class="sect">Admin</div><div class="card"><div class="empty">Loading…</div></div>';
    api("admin").then(function (j) { if (!j.ok) return alertMsg(j.error); ADM = j; if (TAB === "admin" && !onForm) adminDraw(); })
      .catch(function (e) { $("main").innerHTML = '<div class="card"><div class="empty">' + esc(errText(e)) + "</div></div>"; });
  }
  function adminDo(a, body, ask, yes) {
    return confirmMsg(ask, yes || "Yes").then(function (ok) {
      if (!ok) return;
      busy(true, "Working…");
      return api(a, body).then(function (j) {
        busy(false);
        if (!j.ok) return alertMsg(j.error);
        ADM = j; if (j.ctx) setCtx(j.ctx); REP = {};
        adminDraw();
        if (j.erased !== undefined) alertMsg(j.erased + " entr" + (j.erased === 1 ? "y" : "ies") + " erased. The team can enter them again.");
      }).catch(function (e) { busy(false); alertMsg(errText(e)); });
    });
  }
  function adminDraw() {
    var j = ADM, KS = [["lv", "Livestock"], ["am", "Ante Mortem"], ["order", "Order"], ["prod", "Actual"], ["stock", "Dispatch & Stock"]];
    var name = function (k) { return k === "all" ? "All forms" : L.KINDS[k]; };
    if (!AR.d) AR.d = addDays(X.t, -1);
    if (!AE.d1) { AE.d1 = X.t; AE.d2 = X.t; }
    var h = '<div class="sect">Admin</div>';
    h += '<div class="card"><div class="h">Records<span class="sub">live entries</span></div><div class="kgrid">' + KS.map(function (k) { return '<div class="kc"><span>' + k[1] + "</span><b>" + fmt((j.count || {})[k[0]] || 0) + "</b><em>dates</em></div>"; }).join("") + "</div></div>";
    // cut-off
    h += '<div class="card"><div class="h">Cut-off<span class="sub">' + (j.cut ? "closed up to " + esc(dlabel(j.cut)) : "not set") + '</span></div><div class="note">Entries on or before the cut-off date are closed for everyone. Reopen a date below when someone must correct it.</div>' +
      '<div class="two"><div class="fld"><label>Close up to</label><input type="date" id="cutD" max="' + X.t + '" value="' + esc(j.cut || addDays(X.t, -3)) + '"></div><div class="fld"><label>&nbsp;</label><button class="btn" id="cutGo">Set cut-off</button></div></div>' +
      (j.cut ? '<button class="btn ghost" id="cutX">Remove the cut-off</button>' : "") + "</div>";
    // reopen
    h += '<div class="card"><div class="h">Reopen a date for the team</div><div class="note">The team can save this form and date again, even if it is before the cut-off or outside their normal days.</div>' +
      chips("Form", [{ v: "all", l: "All forms" }].concat(KS.map(function (k) { return { v: k[0], l: k[1] }; })), AR.k, "rk", "sm") +
      '<div class="two"><div class="fld"><label>Date of the form</label><input type="date" id="roD" max="' + addDays(X.t, 2) + '" value="' + esc(AR.d) + '"></div><div class="fld"><label>Open for</label>' + chips("", [{ v: "1", l: "Today" }, { v: "2", l: "2 days" }, { v: "7", l: "1 week" }], AR.days, "rdays", "sm") + "</div></div>" +
      '<button class="btn" id="roGo">🔓 Reopen</button>';
    if ((j.opens || []).length) h += '<div class="opens">' + j.opens.map(function (o, i) { return '<div class="open-i"><div><b>' + esc(name(o.k)) + "</b><span>" + esc(dlabel(o.d)) + " · open until " + esc(dlabel(o.until)) + '</span></div><button class="xs" data-roclose="' + i + '">Close</button></div>'; }).join("") + "</div>";
    h += "</div>";
    // erase
    h += '<div class="card danger"><div class="h">Erase data</div><div class="note">Removes the entries so the team can enter them again. Each erased entry is kept in the History tab of the sheet.</div>' +
      chips("Forms", KS.map(function (k) { return { v: k[0], l: (AE.kinds.indexOf(k[0]) >= 0 ? "✓ " : "") + k[1] }; }), "", "ek", "sm") +
      '<div class="two"><div class="fld"><label>From (date of the form)</label><input type="date" id="eD1" value="' + esc(AE.d1) + '"></div><div class="fld"><label>To</label><input type="date" id="eD2" value="' + esc(AE.d2) + '"></div></div>' +
      '<div class="fld"><label>Type ERASE to confirm</label><input id="eOk" autocapitalize="characters" placeholder="ERASE"></div><button class="btn red" id="eGo">Erase</button></div>';
    // activity
    h += '<div class="card"><div class="h">Activity<span class="sub">latest first</span></div>' + ((j.log || []).length ? (j.log || []).slice(0, 40).map(function (r) {
      return '<div class="act"><i class="' + (r[2] === "Erased" ? "r" : r[2] === "Corrected" ? "a" : r[2] === "Saved" ? "g" : "b") + '"></i><div><b>' + esc(r[2]) + (r[3] ? " · " + esc(r[3]) : "") + (r[4] ? " · " + esc(L.isISO(r[4]) ? dlabel(r[4]) : r[4]) : "") + "</b><span>" + esc(r[1]) + " · " + esc(String(r[0]).slice(5).replace(/^(\d\d)-(\d\d)/, "$2/$1")) + (r[5] ? " · " + esc(r[5]) : "") + "</span></div></div>";
    }).join("") : '<div class="empty">Nothing yet.</div>') + "</div>";
    $("main").innerHTML = h + '<div class="foot">' + esc(FOOTER) + "</div>";
    var root = $("main");
    $("cutGo").onclick = function () { var d = $("cutD").value; if (!d) return alertMsg("Choose a date."); adminDo("adminCutoff", { d: d }, "Close all entries up to " + dlabel(d) + "?", "Set cut-off"); };
    if ($("cutX")) $("cutX").onclick = function () { adminDo("adminCutoff", { d: "" }, "Remove the cut-off?", "Remove"); };
    onChip(root, "rk", function (v) { AR.k = v; AR.d = $("roD").value; adminDraw(); });
    onChip(root, "rdays", function (v) { AR.days = v; AR.d = $("roD").value; adminDraw(); });
    $("roGo").onclick = function () { AR.d = $("roD").value; if (!AR.d) return alertMsg("Choose a date."); adminDo("adminReopen", { k: AR.k, d: AR.d, days: AR.days }, "Reopen " + name(AR.k) + " for " + dlabel(AR.d) + "?", "Reopen"); };
    onChip(root, "roclose", function (v) { var o = j.opens[+v]; adminDo("adminClose", { k: o.k, d: o.d }, "Close " + name(o.k) + " for " + dlabel(o.d) + "?", "Close"); });
    onChip(root, "ek", function (v) { var i = AE.kinds.indexOf(v); if (i >= 0) AE.kinds.splice(i, 1); else AE.kinds.push(v); AE.d1 = $("eD1").value; AE.d2 = $("eD2").value; adminDraw(); });
    $("eGo").onclick = function () {
      AE.d1 = $("eD1").value; AE.d2 = $("eD2").value;
      if (!AE.kinds.length) return alertMsg("Tap the forms to erase.");
      if (!AE.d1 || !AE.d2 || AE.d2 < AE.d1) return alertMsg("Choose the dates.");
      if ($("eOk").value.trim().toUpperCase() !== "ERASE") return alertMsg("Type ERASE to confirm.");
      adminDo("adminErase", { kinds: AE.kinds, d1: AE.d1, d2: AE.d2, confirm: "ERASE" }, "Erase " + AE.kinds.map(name).join(", ") + " from " + dlabel(AE.d1) + " to " + dlabel(AE.d2) + "? This cannot be undone in the app.", "Erase");
    };
  }


  // ================================================================ go
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});
  start();
  window.__app = { get X() { return X; }, show: show };
})();
