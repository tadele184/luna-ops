  .cr-list { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; } .cr-list::-webkit-scrollbar { display: none; }
  .cr-list button { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--ink2); }
  .cr-list span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cr-av { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 18px; position: relative; }
  .cr-av img { width: 100%; height: 100%; object-fit: cover; background: #fff; } .cr-av.grp { background: #0076a8; font-size: 22px; } .cr-av.mg { background: #f39200; }
  .cr-av::after { content: "📞"; position: absolute; right: -2px; bottom: -2px; font-size: 13px; background: #3daa35; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .callrec { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 12px; padding: 8px 10px; margin: 6px 0; }
  .callrec i { font-style: normal; font-weight: 900; color: #3daa35; font-size: 18px; } .callrec.miss i { color: var(--red); }
  .callrec b { display: block; font-size: 14px; } .callrec span { font-size: 12px; color: var(--ink3); } .callrec > div { flex: 1; }
  .callrec button { font-size: 12px; font-weight: 800; color: #23843a; background: #e3f4e5; border-radius: 10px; padding: 6px 10px; }
  /* v18.2: forms use the whole screen */
  body.fs .wrap { max-width: none; }
  .fsbody { max-width: 1400px; margin: 0 auto; }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; align-items: start; }
  .tgrid > .row { margin-bottom: 0; }
  .fsbody .num input { font-size: 20px; height: 48px; } .fsbody .num button { width: 48px; height: 48px; font-size: 24px; }
  .fsbody .kgbox input { height: 48px; font-size: 19px; }
  .fsbody .segtabs { position: sticky; top: calc(61px + env(safe-area-inset-top)); z-index: 8; background: #fff; padding: 6px 0; margin: 0 0 10px; }
  .cuchips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; }
  .cuchips .lab { width: 100%; font-size: 11px; font-weight: 800; color: var(--ink3); text-transform: uppercase; letter-spacing: .4px; }
  .chip.cu { padding: 10px 14px; font-size: 14px; border-radius: 22px; margin: 0; }
  .chip.cu.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip.cu b { margin-left: 4px; background: rgba(255,255,255,.18); border-radius: 10px; padding: 1px 7px; font-size: 12px; }
  .cucard .tline2 { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .cucard .tline2:first-of-type { border-top: 0; }
  .tline2 .tl-n { flex: 1; font-weight: 800; } .tline2 .tl-n small { display: block; font-size: 11px; color: var(--ink3); font-weight: 700; }
  .tline2 .fld { width: 160px; flex: none; margin-bottom: 0; } .tline2 .fld > label { display: none; }
  .row.tline .fld { width: 170px; }
  .banner.upd { display: block; text-decoration: none; background: #0076a8; color: #fff; } .banner.upd b { display: block; font-size: 15px; } .banner.upd span { font-size: 13px; opacity: .9; }
  .cl-sub.warnline { margin-top: 14px; max-width: 320px; background: rgba(243,146,0,.18); color: #ffd28a; padding: 8px 12px; border-radius: 12px; opacity: 1; font-size: 13.5px; }

  }
  function fmtN(x) { return Math.round(x || 0).toLocaleString("en-US"); }

  // ---------- chart XML (DrawingML), added to the saved file with JSZip

  function strCache(v) { return '<c:strCache><c:ptCount val="' + v.length + '"/>' + v.map(function (x, i) { return '<c:pt idx="' + i + '"><c:v>' + xe(x) + "</c:v></c:pt>"; }).join("") + "</c:strCache>"; }

    var fill = function (col) { return '<c:spPr><a:solidFill><a:srgbClr val="' + col + '"/></a:solidFill><a:ln><a:noFill/></a:ln></c:spPr>'; };
    var plot, axes = true;
    if (c.type === "bar") {
      plot = '<c:barChart><c:barDir val="col"/><c:grouping val="clustered"/><c:varyColors val="0"/>' + c.ser.map(function (s, i) {
        return '<c:ser><c:idx val="' + i + '"/><c:order val="' + i + '"/>' + tx(s) + fill(s.c) + '<c:invertIfNegative val="0"/>' + cat + val(s) + "</c:ser>";
      }).join("") + '<c:gapWidth val="70"/><c:overlap val="-8"/><c:axId val="5001"/><c:axId val="5002"/></c:barChart>';
    } else if (c.type === "line") {
      plot = '<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>' + c.ser.map(function (s, i) {
        return '<c:ser><c:idx val="' + i + '"/><c:order val="' + i + '"/>' + tx(s) + '<c:spPr><a:ln w="28575" cap="rnd"><a:solidFill><a:srgbClr val="' + s.c + '"/></a:solidFill><a:round/></a:ln></c:spPr>' +
          '<c:marker><c:symbol val="circle"/><c:size val="6"/><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="19050"><a:solidFill><a:srgbClr val="' + s.c + '"/></a:solidFill></a:ln></c:spPr></c:marker>' + cat + val(s) + '<c:smooth val="0"/></c:ser>';
      }).join("") + '<c:marker val="1"/><c:axId val="5001"/><c:axId val="5002"/></c:lineChart>';
    } else {
      axes = false;
      var s = c.ser[0];
      plot = '<c:doughnutChart><c:varyColors val="1"/><c:ser><c:idx val="0"/><c:order val="0"/>' + tx(s) + s.cs.map(function (col, i) {
        return '<c:dPt><c:idx val="' + i + '"/><c:bubble3D val="0"/><c:spPr><a:solidFill><a:srgbClr val="' + col + '"/></a:solidFill><a:ln w="19050"><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill></a:ln></c:spPr></c:dPt>';
      }).join("") + '<c:dLbls><c:numFmt formatCode="0%" sourceLinked="0"/><c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr>' + txPr(900, "FFFFFF", true) +
