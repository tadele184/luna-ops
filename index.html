<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LUNA Ops</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f3f4f6);
    --text: var(--tg-theme-text-color, #1f2328);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --sep: color-mix(in srgb, var(--hint) 22%, transparent);
    --red: #e6332a;
    --red-soft: color-mix(in srgb, #e6332a 12%, var(--bg));
    --green: #2ea043;
    --amber: #e69100;
    --slate: #56707c;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Ethiopic", sans-serif; }
  body { padding-bottom: 96px; min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  input { font: inherit; color: var(--text); }

  /* header */
  .stripe { height: 4px; background: linear-gradient(90deg,#e6332a 0 25%,#f39200 25% 50%,#3daa35 50% 75%,#0076a8 75%); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; background: var(--bg); }
  header img { width: 34px; height: 34px; }
  header .t { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
  header .s { color: var(--hint); font-size: 13px; }
  header .right { margin-left: auto; text-align: right; }

  .screen { display: none; }
  .screen.on { display: block; animation: in .18s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .section-title { padding: 18px 16px 8px; color: var(--hint); font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }

  /* home tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
  .tile { background: var(--bg); border-radius: var(--radius); padding: 14px; text-align: left; min-height: 104px;
    display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; transition: transform .08s; }
  .tile:active { transform: scale(.97); }
  .tile .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: var(--red-soft); }
  .tile .nm { font-weight: 600; font-size: 15px; }
  .tile .st { font-size: 12px; color: var(--hint); margin-top: auto; }
  .tile .st.done { color: var(--green); font-weight: 600; }
  .tile.wide { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
  .tile.wide .st { margin: 0 0 0 auto; }
  header img { object-fit: contain; }
  .note { margin: 14px 16px; color: var(--hint); font-size: 13px; }

  /* entry */
  .bar { background: var(--bg); padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  .bar h2 { margin: 0; font-size: 18px; }
  .seg { display: inline-flex; background: var(--bg2); border-radius: 10px; padding: 3px; margin-left: auto; }
  .seg button { padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--hint); }
  .seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 12px; background: var(--bg); scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 14px; border-radius: 20px; background: var(--bg2); font-size: 14px; position: relative; white-space: nowrap; }
  .chip.on { background: var(--red); color: #fff; font-weight: 600; }
  .chip .b { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; }
  .chip.on .b { background: #fff; color: var(--red); }
  .group-label { padding: 2px 16px 6px; color: var(--hint); font-size: 12px; background: var(--bg); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .card { background: var(--bg); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px;
    border: 2px solid transparent; transition: border-color .15s; }
  .card.has { border-color: var(--red); }
  .card .sp { font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .card .avg { font-size: 12px; color: var(--hint); font-weight: 500; }
  .card .avg.bad { color: var(--red); font-weight: 700; }
  .stepper { display: flex; align-items: center; background: var(--bg2); border-radius: 12px; overflow: hidden; }
  .stepper button { width: 40px; height: 40px; font-size: 22px; font-weight: 500; color: var(--red); flex: none; }
  .stepper button:active { background: var(--red-soft); }
  .stepper input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 18px; font-weight: 700; padding: 0; height: 40px; outline: none; }
  .lbl { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: .4px; margin-bottom: -4px; }
  .kg { display: flex; align-items: center; background: var(--bg2); border-radius: 12px; padding: 0 12px; height: 40px; }
  .kg input { border: 0; background: none; width: 100%; font-size: 17px; font-weight: 700; outline: none; text-align: right; }
  .kg span { color: var(--hint); margin-left: 6px; font-size: 13px; }
  .woito { font-size: 12px; color: var(--hint); display: flex; align-items: center; gap: 6px; }
  .woito input { width: 64px; border: 0; background: var(--bg2); border-radius: 8px; padding: 6px; text-align: center; font-weight: 600; }

  /* review */
  .list { background: var(--bg); margin: 12px; border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; padding: 11px 14px; border-bottom: 1px solid var(--sep); gap: 8px; align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .l { flex: 1; }
  .row .r { font-variant-numeric: tabular-nums; text-align: right; }
  .row.head { font-weight: 700; background: var(--red-soft); }
  .row.tot { font-weight: 700; }
  .warn { margin: 0 12px 10px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--amber) 14%, var(--bg)); font-size: 13px; }
  .empty { text-align: center; color: var(--hint); padding: 40px 20px; }
  .fallback-btn { position: fixed; left: 12px; right: 12px; bottom: 16px; height: 50px; border-radius: 12px; background: var(--red);
    color: #fff; font-weight: 700; font-size: 16px; display: none; }
  .denied { margin: 40px 20px; text-align: center; }
  .denied .big { font-size: 42px; }
</style>
</head>

  const $ = id => document.getElementById(id);
  const fmt = n => (Math.round(n * 10) / 10).toLocaleString("en-US");
  const secKey = s => s.o + "|" + (s.n || "");
  const haptic = (t = "light") => { try { tg && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
  const select = () => { try { tg && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  function dayLabel(iso) {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" });
  }
  function addDays(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

  // ---------------------------------------------------------------- main button (Telegram) with browser fallback
  let mainHandler = null;
  function mainButton(text, enabled, handler) {
    mainHandler = handler;
    if (inTelegram) {
      const mb = tg.MainButton;
      try {
        if (!text) { mb.hide(); return; }          // Telegram throws if text is empty
        mb.setParams({ text, color: enabled ? "#e6332a" : "#c9cdd2", text_color: "#ffffff" });
        enabled ? mb.enable() : mb.disable();
        mb.show();
      } catch (e) {
        const b = $("fb"); b.textContent = text; b.style.display = text ? "block" : "none"; b.style.opacity = enabled ? 1 : .45;
      }
    } else {
      const b = $("fb"); b.textContent = text; b.style.display = text ? "block" : "none"; b.style.opacity = enabled ? 1 : .45;
    }
  }
  if (inTelegram) tg.MainButton.onClick(() => mainHandler && mainHandler());
  $("fb").onclick = () => mainHandler && mainHandler();

  function backButton(handler) {
    if (!inTelegram) return;
    if (backButton._h) tg.BackButton.offClick(backButton._h);
    backButton._h = handler;
    if (handler) { tg.BackButton.onClick(handler); tg.BackButton.show(); } else tg.BackButton.hide();
  }

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- HOME
  function renderHome() {
    kind = null;
    show("home");
    backButton(null);
    mainButton("", false, null);
    $("who").textContent = ctx.u ? "@" + ctx.u : "";
    $("today").textContent = dayLabel(ctx.t);
    const tiles = $("tiles");
    tiles.innerHTML = "";
    const mine = ORDER.filter(k => ctx.k.includes(k));
    if (!mine.length) {
      tiles.innerHTML = "";
      $("homeNote").innerHTML = '<div class="denied"><div class="big">🔒</div><p>You are not assigned to any report.<br>Ask the admin if this is wrong.</p></div>';
      return;
    }
    mine.forEach((k, i) => {
      const done = ctx.s && ctx.s[k];
      const b = document.createElement("button");
      b.className = "tile" + (mine.length % 2 === 1 && i === mine.length - 1 ? " wide" : "");
      b.innerHTML = `<div class="ic">${KINDS[k].icon}</div><div class="nm">${KINDS[k].name}</div>
        <div class="st ${done ? "done" : ""}">${done ? "✓ Submitted today, tap to correct" : "Due today"}</div>`;
      b.onclick = () => { haptic(); openEntry(k); };
      tiles.appendChild(b);
    });
    $("homeNote").textContent = "Pick a report, enter only the numbers, review and submit. The bot checks everything and posts it to the group.";
  }

  // ---------------------------------------------------------------- ENTRY
  function sections() {
    const own = KINDS[kind].own.map(ch => ({ o: "own", n: ch, label: ch ? "Own · " + ch : "Own" }));
    const svc = (ctx.c || []).map(c => ({ o: "svc", n: c, label: c }));
    return own.concat(svc);
  }

  function loadPrefill(k) {
    values = {};
    const p = (ctx.p || {})[k];
    if (!p) return;
    p.forEach(s => {
      const key = s.o + "|" + (s.n || "");
      values[key] = {};
      Object.entries(s.v).forEach(([sp, v]) => {
        if (KINDS[k].unit === "heads") {
          const m = String(v).match(/^(\d+)(?:\+(\d+)\(Woito\))?$/i);
          values[key][sp] = m ? { h: +m[1], w: m[2] ? +m[2] : 0 } : { h: +String(v).replace(/\D/g, "") || 0, w: 0 };
        } else values[key][sp] = { p: v[0], kg: v[1] };
      });
    });
  }

  function openEntry(k) {
    if (kind !== k) { kind = k; date = ctx.t; loadPrefill(k); }
    sel = sel && sections().some(s => secKey(s) === secKey(sel)) ? sel : sections()[0];
    show("entry");
    backButton(() => { haptic(); renderHome(); });
    renderEntry();
  }

  function lineCount() {
    let n = 0;
    Object.values(values).forEach(sec => Object.values(sec).forEach(v => { if (has(v)) n++; }));
    return n;
  }
  const has = v => v && ((v.h || 0) + (v.w || 0) > 0 || (v.p || 0) > 0 || (v.kg || 0) > 0);

  function renderEntry() {
    $("eTitle").textContent = KINDS[kind].name;
    // date
    const seg = $("dateSeg"); seg.innerHTML = "";
    const opts = [["Yesterday", addDays(ctx.t, -1)], ["Today", ctx.t]].concat(kind === "order" ? [["Tomorrow", addDays(ctx.t, 1)]] : []);
    opts.forEach(([lab, iso]) => {
      const b = document.createElement("button");
      b.textContent = lab; b.className = iso === date ? "on" : "";
      b.onclick = () => { select(); date = iso; renderEntry(); };
      seg.appendChild(b);
    });
    // chips
    const chips = $("chips"); chips.innerHTML = "";
    sections().forEach(s => {
      const n = Object.values(values[secKey(s)] || {}).filter(has).length;
      const b = document.createElement("button");
      b.className = "chip" + (secKey(s) === secKey(sel) ? " on" : "");
      b.innerHTML = `${s.label}${n ? `<span class="b">${n}</span>` : ""}`;
      b.onclick = () => { select(); sel = s; renderEntry(); b.scrollIntoView({ inline: "center", behavior: "smooth", block: "nearest" }); };
      chips.appendChild(b);
    });
    // cards
    const cards = $("cards"); cards.innerHTML = "";
    const key = secKey(sel);
    values[key] = values[key] || {};
    SPECIES.forEach(sp => cards.appendChild(kind && KINDS[kind].unit === "heads" ? headsCard(key, sp) : pcsKgCard(key, sp)));
    $("entryNote").textContent = KINDS[kind].unit === "heads"
      ? "Tap + / − or type the number of heads. Leave at 0 if none."
      : "Enter pieces and carcass kg. The average kg per head turns red if it looks wrong.";
    updateMain();
  }

  function stepper(value, onChange, step = 1) {
    const w = document.createElement("div"); w.className = "stepper";
    const minus = document.createElement("button"); minus.textContent = "−";
    const plus = document.createElement("button"); plus.textContent = "+";
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = "numeric"; inp.pattern = "[0-9]*"; inp.value = value || "";
    inp.placeholder = "0";
    const set = v => { v = Math.max(0, Math.round(v)); inp.value = v || ""; onChange(v); };
    minus.onclick = () => { haptic(); set((+inp.value || 0) - step); };
    plus.onclick = () => { haptic(); set((+inp.value || 0) + step); };
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, "").slice(0, 6); onChange(+inp.value || 0); };
    inp.onfocus = () => inp.select();
    w.append(minus, inp, plus);
    return w;
  }

  function headsCard(key, sp) {
    const v = values[key][sp] || { h: 0, w: 0 };
    const c = document.createElement("div"); c.className = "card" + (has(v) ? " has" : "");
    c.innerHTML = `<div class="sp">${sp}<span class="avg"></span></div>`;
    const upd = () => { values[key][sp] = v; c.classList.toggle("has", has(v)); refreshChipBadges(); updateMain(); };
    c.appendChild(stepper(v.h, n => { v.h = n; upd(); }));
    if (sp === "Bull" && kind === "livestock") {
      const wo = document.createElement("label"); wo.className = "woito";
      wo.innerHTML = `+ Woito <input inputmode="numeric" pattern="[0-9]*" placeholder="0" value="${v.w || ""}">`;
      const i = wo.querySelector("input");
      i.oninput = () => { i.value = i.value.replace(/\D/g, "").slice(0, 5); v.w = +i.value || 0; upd(); };
      c.appendChild(wo);
    }
    return c;
  }

  function pcsKgCard(key, sp) {
    const v = values[key][sp] || { p: 0, kg: 0 };
    const c = document.createElement("div"); c.className = "card" + (has(v) ? " has" : "");
    c.innerHTML = `<div class="sp">${sp}<span class="avg"></span></div><div class="lbl">Pcs</div>`;
    const avg = c.querySelector(".avg");
    const showAvg = () => {
      if (v.p > 0 && v.kg > 0) {
        const a = v.kg / v.p, [lo, hi] = RANGE[sp];
        avg.textContent = fmt(a) + " kg/hd"; avg.classList.toggle("bad", a < lo || a > hi);
      } else { avg.textContent = ""; avg.classList.remove("bad"); }
    };
    const upd = () => { values[key][sp] = v; c.classList.toggle("has", has(v)); showAvg(); refreshChipBadges(); updateMain(); };
    c.appendChild(stepper(v.p, n => { v.p = n; upd(); }));
    const l2 = document.createElement("div"); l2.className = "lbl"; l2.textContent = "Carcass kg";
    const kg = document.createElement("div"); kg.className = "kg";
    kg.innerHTML = `<input inputmode="decimal" placeholder="0" value="${v.kg || ""}"><span>kg</span>`;
    const i = kg.querySelector("input");
    i.oninput = () => { i.value = i.value.replace(",", ".").replace(/[^\d.]/g, "").replace(/(\..*)\./g, "$1").slice(0, 9); v.kg = parseFloat(i.value) || 0; upd(); };
    i.onfocus = () => i.select();
    c.append(l2, kg);
    showAvg();
    return c;
  }

  function refreshChipBadges() {
    const secs = sections();
    document.querySelectorAll("#chips .chip").forEach((b, idx) => {
      const s = secs[idx], n = Object.values(values[secKey(s)] || {}).filter(has).length;
      const label = s.label;
      b.innerHTML = `${label}${n ? `<span class="b">${n}</span>` : ""}`;
    });
  }

  function updateMain() {
    const n = lineCount();
    mainButton(n ? `REVIEW  ·  ${n} line${n > 1 ? "s" : ""}` : "ENTER NUMBERS TO CONTINUE", n > 0, n ? openReview : null);
  }

  // ---------------------------------------------------------------- REVIEW
  function problems() {
    const out = [];
    sections().forEach(s => {
      Object.entries(values[secKey(s)] || {}).forEach(([sp, v]) => {
        if (!has(v) || KINDS[kind].unit === "heads") return;
        if (!v.p) out.push(`${s.label} · ${sp}: pcs missing.`);
        else if (!v.kg) out.push(`${s.label} · ${sp}: kg missing.`);
        else { const a = v.kg / v.p, [lo, hi] = RANGE[sp]; if (a < lo || a > hi) out.push(`${s.label} · ${sp}: ${fmt(a)} kg per head is outside ${lo}-${hi} kg.`); }
      });
    });
    return out;
  }

  function openReview() {
    haptic("medium");
    show("review");
    backButton(() => { haptic(); show("entry"); backButton(() => { haptic(); renderHome(); }); updateMain(); });
    $("rTitle").textContent = `${KINDS[kind].name} · ${dayLabel(date)}`;
    const heads = KINDS[kind].unit === "heads";
    let html = "", gp = 0, gk = 0;
    sections().forEach(s => {
      const rows = Object.entries(values[secKey(s)] || {}).filter(([, v]) => has(v));
      if (!rows.length) return;
      let tp = 0, tk = 0;
      html += `<div class="list"><div class="row head"><div class="l">${s.label}</div>${heads ? "" : '<div class="r">Pcs · Kg</div>'}</div>`;
      SPECIES.forEach(sp => {
        const v = (values[secKey(s)] || {})[sp]; if (!has(v)) return;
        if (heads) { const t = (v.h || 0) + (v.w || 0); tp += t;
          html += `<div class="row"><div class="l">${sp}${v.w ? ` <span style="color:var(--hint)">(${v.h} + ${v.w} Woito)</span>` : ""}</div><div class="r">${fmt(t)}</div></div>`; }
        else { tp += v.p || 0; tk += v.kg || 0;
          html += `<div class="row"><div class="l">${sp}</div><div class="r">${fmt(v.p || 0)} · ${fmt(v.kg || 0)} kg</div></div>`; }
      });
      if (rows.length > 1) html += `<div class="row tot"><div class="l">Total</div><div class="r">${heads ? fmt(tp) : fmt(tp) + " · " + fmt(tk) + " kg"}</div></div>`;
      html += "</div>";
      gp += tp; gk += tk;
    });
    const probs = problems();
    const total = heads ? `${fmt(gp)} heads` : `${fmt(gp)} pcs · ${fmt(gk)} kg`;
    html = `<div class="list"><div class="row tot"><div class="l">Grand total</div><div class="r">${total}</div></div></div>` + html;
    html += probs.map(p => `<div class="warn">⚠️ ${p}</div>`).join("");
    if (ctx.s && ctx.s[kind] && date === ctx.t) html += `<p class="note">This replaces today's earlier ${KINDS[kind].name}.</p>`;
    $("rBody").innerHTML = html;
    const blocked = probs.some(p => p.includes("missing"));
    mainButton(blocked ? "FIX MISSING PCS / KG" : "SUBMIT TO GROUP", !blocked, blocked ? null : submit);
  }

  // ---------------------------------------------------------------- SUBMIT
  function payload() {
    const heads = KINDS[kind].unit === "heads";
    const s = [];
    sections().forEach(sec => {
      const v = {};
      Object.entries(values[secKey(sec)] || {}).forEach(([sp, x]) => {
        if (!has(x)) return;
        v[sp] = heads ? (x.w ? `${x.h || 0}+${x.w}(Woito)` : String(x.h || 0)) : [x.p || 0, Math.round((x.kg || 0) * 10) / 10];
      });
      if (Object.keys(v).length) s.push({ o: sec.o, n: sec.n, v });
    });
    return JSON.stringify({ v: 1, k: kind, d: date, s });
  }

  function submit() {
    const data = payload();
    if (new Blob([data]).size > 4000) { alertMsg("Too many lines to send at once. Please split the report."); return; }
    const go = () => {
      try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
      if (inTelegram) tg.sendData(data);
      else { console.log("sendData", data); alertMsg("Preview mode: in Telegram this would be sent to the bot.\n\n" + data); }
    };
    if (inTelegram && tg.showConfirm) tg.showConfirm(`Submit ${KINDS[kind].name} for ${dayLabel(date)}?`, ok => ok && go());
    else go();
  }
  function alertMsg(m) { if (inTelegram && tg.showAlert) tg.showAlert(m); else alert(m); }

  // ---------------------------------------------------------------- boot
  if (inTelegram) {
    tg.ready(); tg.expand();
    try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
    try { tg.enableClosingConfirmation(); } catch (e) {}
  }
  if (ctx.o && ctx.k.includes(ctx.o)) openEntry(ctx.o); else renderHome();
  $("who").textContent = ctx.u ? "@" + ctx.u : "";
  $("today").textContent = dayLabel(ctx.t);
  window.__luna = { payload: () => kind && payload(), state: () => ({ kind, date, values }) };
})();
</script>
</body>
</html>
