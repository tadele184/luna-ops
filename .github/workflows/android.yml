name: Build LUNA Ops Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk LUNA-Ops.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LUNA-Ops-apk
          path: LUNA-Ops.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: LUNA Ops Android app
          body: "Install on Android: download LUNA-Ops.apk and open it. (c) 2026 Tadele B."
          files: LUNA-Ops.apk
          make_latest: true
